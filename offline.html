<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#6B9080"/>
<title>Offline - GHAR DEKHO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F5F0;color:#3A3A3A;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.card{background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px;padding:28px 22px;max-width:360px;width:100%}
.icon{font-size:52px;margin-bottom:10px}
h1{font-size:20px;font-weight:900;margin-bottom:6px}
.hi{font-size:15px;color:#8A8778;margin-bottom:6px}
p{font-size:14px;color:#8A8778;line-height:1.5;margin-bottom:18px}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#6B9080,#B08968);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📶</div>
  <h1>You're offline</h1>
  <div class="hi">इंटरनेट कनेक्शन नहीं है</div>
  <p>GHAR DEKHO needs an internet connection to show listings. Check your mobile data or Wi-Fi and try again.</p>
  <button onclick="location.reload()">Try again / फिर से कोशिश करें</button>
</div>
<script>window.addEventListener('online',function(){location.reload();});</script>
</body>
</html>
