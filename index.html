const fromFS=(doc)=>{const o={id:doc.name?.split("/").pop()};for(const[k,v]of Object.entries(doc.fields||{})){if(v.stringValue!==undefined)o[k]=v.stringValue;else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.booleanValue!==undefined)o[k]=v.booleanValue;else if(v.arrayValue)o[k]=(v.arrayValue.values||[]).map(i=>i.stringValue||"");}return o;};

"\u0939\u092e \u0909\u092a\u092f\u094b\u0917\u0915\u0930\u094d\u0924\u093e\u0913\u0902 \u0915\u0940 \u092a\u0939\u091a\u093e\u0928, \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917 \u0915\u0940 \u0938\u091f\u0940\u0915\u0924\u093e, \u092f\u093e \u0915\u093f\u0938\u0940 \u092d\u0940 \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0915\u0940 \u0938\u094d\u0925\u093f\u0924\u093f, \u0935\u0948\u0927\u0924\u093e, \u092f\u093e \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0915\u093e \u0938\u0924\u094d\u092f\u093e\u092a\u0928 \u0928\u0939\u0940\u0902 \u0915\u0930\u0924\u0947\u0964 \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917 \u092e\u0947\u0902 \u091c\u094b \u0926\u093f\u0916\u093e\u092f\u093e \u0917\u092f\u093e \u0939\u0948 \u0935\u0939 \u0909\u0938\u0947 \u092a\u094b\u0938\u094d\u091f \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0926\u094d\u0935\u093e\u0930\u093e \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948, \u0918\u0930 \u0926\u0947\u0916\u094b \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u0939\u0940\u0902\u0964",
"\u092e\u093e\u0932\u093f\u0915/\u0935\u093f\u0915\u094d\u0930\u0947\u0924\u093e \u0914\u0930 \u0916\u094b\u091c\u0915\u0930\u094d\u0924\u093e \u0915\u0947 \u092c\u0940\u091a \u0915\u094b\u0908 \u092d\u0940 \u0938\u0902\u091a\u093e\u0930, \u092e\u0941\u0932\u093e\u0915\u093e\u0924, \u092d\u0941\u0917\u0924\u093e\u0928, \u0938\u092e\u091d\u094c\u0924\u093e, \u092f\u093e \u0932\u0947\u0928-\u0926\u0947\u0928 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0909\u0928\u0915\u0947 \u0905\u092a\u0928\u0947 \u091c\u094b\u0916\u093f\u092e \u0914\u0930 \u0935\u093f\u0935\u0947\u0915 \u092a\u0930 \u0939\u094b\u0924\u093e \u0939\u0948\u0964 \u0918\u0930 \u0926\u0947\u0916\u094b \u0915\u093e \u0909\u092a\u092f\u094b\u0917\u0915\u0930\u094d\u0924\u093e\u0913\u0902 \u0915\u0947 \u092c\u0940\u091a \u091c\u094b \u0915\u0941\u091b \u0924\u092f, \u0906\u0926\u093e\u0928-\u092a\u094d\u0930\u0926\u093e\u0928, \u092f\u093e \u0935\u093e\u0926\u093e \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0909\u0938\u092e\u0947\u0902 \u0915\u094b\u0908 \u0939\u0938\u094d\u0924\u0915\u094d\u0937\u0947\u092a \u092f\u093e \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930\u0940 \u0928\u0939\u0940\u0902 \u0939\u0948\u0964",
"\u0918\u0930 \u0926\u0947\u0916\u094b \u0915\u093f\u0938\u0940 \u092d\u0940 \u0935\u093f\u0935\u093e\u0926, \u0927\u094b\u0916\u093e\u0927\u0921\u093c\u0940, \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0939\u093e\u0928\u093f, \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0915\u094b \u0928\u0941\u0915\u0938\u093e\u0928, \u0926\u0941\u0930\u094d\u0935\u094d\u092f\u0935\u0939\u093e\u0930, \u0909\u0924\u094d\u092a\u0940\u0921\u093c\u0928, \u091a\u094b\u091f, \u092f\u093e \u0910\u092a \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0939\u0941\u090f \u0938\u0902\u092a\u0930\u094d\u0915 \u0938\u0947 \u0909\u0924\u094d\u092a\u0928\u094d\u0928 \u0915\u093f\u0938\u0940 \u092d\u0940 \u0905\u0928\u094d\u092f \u0926\u0941\u0930\u094d\u0918\u091f\u0928\u093e \u0915\u0947 \u0932\u093f\u090f \u091c\u093c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u092f\u093e \u0909\u0924\u094d\u0924\u0930\u0926\u093e\u092f\u0940 \u0928\u0939\u0940\u0902 \u0939\u0948\u0964",
"\u0915\u093f\u0938\u0940 \u0938\u0947 \u092e\u093f\u0932\u0928\u0947 \u092f\u093e \u0915\u094b\u0908 \u092d\u0941\u0917\u0924\u093e\u0928 \u0915\u0930\u0928\u0947 \u0938\u0947 \u092a\u0939\u0932\u0947, \u0939\u092e \u0926\u0943\u0922\u093c\u0924\u093e \u0938\u0947 \u0938\u0932\u093e\u0939 \u0926\u0947\u0924\u0947 \u0939\u0948\u0902 \u0915\u093f \u0926\u0942\u0938\u0930\u0947 \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0915\u0940 \u092a\u0939\u091a\u093e\u0928 \u0938\u0924\u094d\u092f\u093e\u092a\u093f\u0924 \u0915\u0930\u0947\u0902, \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u092f\u093e \u0938\u094d\u0925\u093e\u0928 \u0915\u093e \u0935\u094d\u092f\u0915\u094d\u0924\u093f\u0917\u0924 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u0930\u0940\u0915\u094d\u0937\u0923 \u0915\u0930\u0947\u0902, \u0914\u0930 \u091c\u0939\u093e\u0901 \u0938\u0902\u092d\u0935 \u0939\u094b \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924, \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0938\u094d\u0925\u093e\u0928\u094b\u0902 \u092a\u0930 \u092e\u093f\u0932\u0947\u0902\u0964",
"\u0918\u0930 \u0926\u0947\u0916\u094b \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947, \u0906\u092a \u092a\u094d\u0932\u0947\u091f\u092b\u093c\u0949\u0930\u094d\u092e \u0915\u093e \u091c\u093c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930\u0940 \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0928\u0947, \u0938\u091a\u094d\u091a\u0940 \u091c\u093e\u0928\u0915\u093e\u0930\u0940 \u092a\u094b\u0938\u094d\u091f \u0915\u0930\u0928\u0947, \u0914\u0930 \u0905\u0928\u094d\u092f \u0909\u092a\u092f\u094b\u0917\u0915\u0930\u094d\u0924\u093e\u0913\u0902 \u0915\u0947 \u0938\u093e\u0925 \u092c\u093e\u0924\u091a\u0940\u0924 \u0915\u0930\u0924\u0947 \u0938\u092e\u092f \u0909\u091a\u093f\u0924 \u0938\u093e\u0935\u0927\u093e\u0928\u0940 \u092c\u0930\u0924\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0939\u092e\u0924 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902\u0964",
"\u0939\u092e \u0909\u0928 \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917 \u0915\u094b \u0939\u091f\u093e \u0938\u0915\u0924\u0947 \u0939\u0948\u0902 \u092f\u093e \u0909\u0928 \u0916\u093e\u0924\u094b\u0902 \u0915\u094b \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093f\u0924 \u0915\u0930 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902 \u091c\u094b \u0927\u094b\u0916\u093e\u0927\u0921\u093c\u0940 \u0935\u093e\u0932\u0947, \u0926\u0941\u0930\u094d\u0935\u094d\u092f\u0935\u0939\u093e\u0930 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947, \u092f\u093e \u0907\u0928 \u0928\u093f\u092f\u092e\u094b\u0902 \u0915\u093e \u0909\u0932\u094d\u0932\u0902\u0918\u0928 \u0915\u0930\u0924\u0947 \u092a\u094d\u0930\u0924\u0940\u0924 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902, \u0932\u0947\u0915\u093f\u0928 \u0939\u092e \u0917\u093e\u0930\u0902\u091f\u0940 \u0928\u0939\u0940\u0902 \u0926\u0947\u0924\u0947 \u0915\u093f \u0910\u0938\u0940 \u0938\u092d\u0940 \u0938\u093e\u092e\u0917\u094d\u0930\u0940 \u092a\u0915\u0921\u093c\u0940 \u092f\u093e \u0939\u091f\u093e\u0908 \u091c\u093e\u090f\u0917\u0940\u0964",
"\u0910\u092a \u0915\u0947 \u092c\u0922\u093c\u0928\u0947 \u0915\u0947 \u0938\u093e\u0925 \u092f\u0947 \u0928\u093f\u092f\u092e \u0905\u092a\u0921\u0947\u091f \u0915\u093f\u090f \u091c\u093e \u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964 \u0918\u0930 \u0926\u0947\u0916\u094b \u0915\u093e \u0928\u093f\u0930\u0902\u0924\u0930 \u0909\u092a\u092f\u094b\u0917 \u0907\u0938\u0915\u093e \u0905\u0930\u094d\u0925 \u0939\u0948 \u0915\u093f \u0906\u092a \u0907\u0928 \u0928\u093f\u092f\u092e\u094b\u0902 \u0915\u0947 \u0935\u0930\u094d\u0924\u092e\u093e\u0928 \u0938\u0902\u0938\u094d\u0915\u0930\u0923 \u0915\u094b \u0938\u094d\u0935\u0940\u0915\u093e\u0930 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"
],
bn:[
"\u0998\u09b0 \u09a6\u09c7\u0996\u09cb \u098f\u0995\u099f\u09bf \u09a4\u09be\u09b2\u09bf\u0995\u09be \u09aa\u09cd\u09b2\u09cd\u09af\u09be\u099f\u09ab\u09b0\u09cd\u09ae \u09af\u09be \u09ae\u09be\u09b2\u09bf\u0995, \u09ac\u09bf\u0995\u09cd\u09b0\u09c7\u09a4\u09be \u098f\u09ac\u0982 \u09b8\u09cd\u099f\u09be\u09a1\u09bf-\u09b8\u09cd\u09aa\u09c7\u09b8 \u09aa\u09cd\u09b0\u09a6\u09be\u09a8\u0995\u09be\u09b0\u09c0\u09a6\u09c7\u09b0 \u09b0\u09c1\u09ae, \u09ac\u09be\u09a1\u09bc\u09bf \u09ac\u09be \u0986\u09b8\u09a8 \u0996\u09c1\u0981\u099c\u099b\u09c7\u09a8 \u098f\u09ae\u09a8 \u09ae\u09be\u09a8\u09c1\u09b7\u09a6\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u09b8\u0982\u09af\u09cb\u0997 \u0995\u09b0\u09a4\u09c7 \u09b8\u09be\u09b9\u09be\u09af\u09cd\u09af \u0995\u09b0\u09c7\u0964 \u0986\u09ae\u09b0\u09be \u0995\u09c7\u09ac\u09b2 \u098f\u0995\u099f\u09bf \u09ae\u09bf\u09b2\u09a8\u09b8\u09cd\u09a5\u09b2 \u2014 \u0995\u09cb\u09a8\u09cb \u09a6\u09be\u09b2\u09be\u09b2, \u098f\u099c\u09c7\u09a8\u09cd\u099f, \u09ac\u09be\u09a1\u09bc\u09bf\u0993\u09af\u09bc\u09be\u09b2\u09be, \u09ac\u09be \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0\u0995\u09be\u09b0\u09c0\u09a6\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u0995\u09cb\u09a8\u09cb \u099a\u09c1\u0995\u09cd\u09a4\u09bf\u09b0 \u09aa\u0995\u09cd\u09b7 \u09a8\u0987\u0964",
"\u0986\u09ae\u09b0\u09be \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0\u0995\u09be\u09b0\u09c0\u09a6\u09c7\u09b0 \u09aa\u09b0\u09bf\u099a\u09af\u09bc, \u09a4\u09be\u09b2\u09bf\u0995\u09be\u09b0 \u09a8\u09bf\u09b0\u09cd\u09ad\u09c1\u09b2\u09a4\u09be, \u09ac\u09be \u0995\u09cb\u09a8\u09cb \u09b8\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u09b0 \u0985\u09ac\u09b8\u09cd\u09a5\u09be, \u09ac\u09c8\u09a7\u09a4\u09be \u09ac\u09be \u09ae\u09be\u09b2\u09bf\u0995\u09be\u09a8\u09be \u09af\u09be\u099a\u09be\u0987 \u0995\u09b0\u09bf \u09a8\u09be\u0964 \u09a4\u09be\u09b2\u09bf\u0995\u09be\u09af\u09bc \u09af\u09be \u09a6\u09c7\u0996\u09be\u09a8\u09cb \u09b9\u09af\u09bc \u09a4\u09be \u09aa\u09cb\u09b8\u09cd\u099f\u0995\u09be\u09b0\u09c0 \u09ac\u09cd\u09af\u0995\u09cd\u09a4\u09bf \u09aa\u09cd\u09b0\u09a6\u09be\u09a8 \u0995\u09b0\u09c7\u099b\u09c7\u09a8, \u0998\u09b0 \u09a6\u09c7\u0996\u09cb \u09a8\u09af\u09bc\u0964",
"\u09ae\u09be\u09b2\u09bf\u0995/\u09ac\u09bf\u0995\u09cd\u09b0\u09c7\u09a4\u09be \u098f\u09ac\u0982 \u0985\u09a8\u09c1\u09b8\u09a8\u09cd\u09a7\u09be\u09a8\u0995\u09be\u09b0\u09c0\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u09af\u09c7\u0995\u09cb\u09a8\u09cb \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997, \u09b8\u09be\u0995\u09cd\u09b7\u09be\u09ce, \u0985\u09b0\u09cd\u09a5\u09aa\u09cd\u09b0\u09a6\u09be\u09a8, \u099a\u09c1\u0995\u09cd\u09a4\u09bf, \u09ac\u09be \u09b2\u09c7\u09a8\u09a6\u09c7\u09a8 \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3\u09b0\u09c2\u09aa\u09c7 \u09a4\u09be\u09a6\u09c7\u09b0 \u09a8\u09bf\u099c\u09b8\u09cd\u09ac \u099d\u09c1\u0981\u0995\u09bf \u0993 \u09ac\u09bf\u09ac\u09c7\u099a\u09a8\u09be\u09af\u09bc \u0998\u099f\u09c7\u0964 \u0998\u09b0 \u09a6\u09c7\u0996\u09cb\u09b0 \u098f\u09a4\u09c7 \u0995\u09cb\u09a8\u09cb \u09b8\u09ae\u09cd\u09aa\u09c3\u0995\u09cd\u09a4\u09a4\u09be \u09ac\u09be \u09a6\u09be\u09af\u09bc\u09bf\u09a4\u09cd\u09ac \u09a8\u09c7\u0987\u0964",
"\u0998\u09b0 \u09a6\u09c7\u0996\u09cb \u098f\u0987 \u0985\u09cd\u09af\u09be\u09aa\u09c7\u09b0 \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997\u09c7\u09b0 \u09ab\u09b2\u09c7 \u09b8\u09c3\u09b7\u09cd\u099f \u0995\u09cb\u09a8\u09cb \u09ac\u09bf\u09b0\u09cb\u09a7, \u09aa\u09cd\u09b0\u09a4\u09be\u09b0\u09a3\u09be, \u0986\u09b0\u09cd\u09a5\u09bf\u0995 \u0995\u09cd\u09b7\u09a4\u09bf, \u09b8\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u09b0 \u0995\u09cd\u09b7\u09a4\u09bf, \u09a6\u09c1\u09b0\u09cd\u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0, \u09b9\u09af\u09bc\u09b0\u09be\u09a8\u09bf, \u0986\u0998\u09be\u09a4, \u09ac\u09be \u0985\u09a8\u09cd\u09af \u0995\u09cb\u09a8\u09cb \u09a6\u09c1\u09b0\u09cd\u0998\u099f\u09a8\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09a6\u09be\u09af\u09bc\u09c0 \u09a8\u09af\u09bc\u0964",
"\u0995\u09be\u09b0\u09cb \u09b8\u09be\u09a5\u09c7 \u09a6\u09c7\u0996\u09be \u0995\u09b0\u09be\u09b0 \u09ac\u09be \u0995\u09cb\u09a8\u09cb \u0985\u09b0\u09cd\u09a5\u09aa\u09cd\u09b0\u09a6\u09be\u09a8\u09c7\u09b0 \u0986\u0997\u09c7, \u0986\u09ae\u09b0\u09be \u09a6\u09c3\u09a2\u09bc\u09ad\u09be\u09ac\u09c7 \u09b8\u09c1\u09aa\u09be\u09b0\u09bf\u09b6 \u0995\u09b0\u09bf \u0985\u09a8\u09cd\u09af \u09ac\u09cd\u09af\u0995\u09cd\u09a4\u09bf\u09b0 \u09aa\u09b0\u09bf\u099a\u09af\u09bc \u09af\u09be\u099a\u09be\u0987 \u0995\u09b0\u09a4\u09c7, \u09b8\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u09aa\u09b0\u09bf\u09a6\u09b0\u09cd\u09b6\u09a8 \u0995\u09b0\u09a4\u09c7, \u098f\u09ac\u0982 \u09af\u09c7\u0996\u09be\u09a8\u09c7 \u09b8\u09ae\u09cd\u09ad\u09ac \u09a8\u09bf\u09b0\u09be\u09aa\u09a6, \u099c\u09a8\u09b8\u09ae\u09be\u0997\u09ae\u09b8\u09cd\u09a5\u09b2\u09c7 \u09a6\u09c7\u0996\u09be \u0995\u09b0\u09a4\u09c7\u0964",
"\u0998\u09b0 \u09a6\u09c7\u0996\u09cb \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09c7, \u0986\u09aa\u09a8\u09bf \u09a6\u09be\u09af\u09bc\u09bf\u09a4\u09cd\u09ac\u09b6\u09c0\u09b2\u09ad\u09be\u09ac\u09c7 \u09aa\u09cd\u09b2\u09cd\u09af\u09be\u099f\u09ab\u09b0\u09cd\u09ae \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09a4\u09c7, \u09b8\u09ce \u09a4\u09a5\u09cd\u09af \u09aa\u09cb\u09b8\u09cd\u099f \u0995\u09b0\u09a4\u09c7, \u098f\u09ac\u0982 \u0985\u09a8\u09cd\u09af\u09be\u09a8\u09cd\u09af \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0\u0995\u09be\u09b0\u09c0\u09a6\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997\u09c7\u09b0 \u09b8\u09ae\u09af\u09bc \u09af\u09c1\u0995\u09cd\u09a4\u09bf\u09b8\u0999\u09cd\u0997\u09a4 \u09b8\u09a4\u09b0\u09cd\u0995\u09a4\u09be \u0985\u09ac\u09b2\u09ae\u09cd\u09ac\u09a8 \u0995\u09b0\u09a4\u09c7 \u09b8\u09ae\u09cd\u09ae\u09a4 \u09b9\u09a8\u0964",
"\u0986\u09ae\u09b0\u09be \u09aa\u09cd\u09b0\u09a4\u09be\u09b0\u09a3\u09be\u09ae\u09c2\u09b2\u0995, \u0986\u09aa\u09a4\u09cd\u09a4\u09bf\u099c\u09a8\u0995, \u09ac\u09be \u098f\u0987 \u09b6\u09b0\u09cd\u09a4\u09be\u09ac\u09b2\u09c0 \u09b2\u0999\u09cd\u0998\u09a8\u0995\u09be\u09b0\u09c0 \u09ae\u09a8\u09c7 \u09b9\u0993\u09af\u09bc\u09be \u09a4\u09be\u09b2\u09bf\u0995\u09be \u09b8\u09b0\u09be\u09a4\u09c7 \u09ac\u09be \u0985\u09cd\u09af\u09be\u0995\u09be\u0989\u09a8\u09cd\u099f \u09b8\u09c0\u09ae\u09be\u09ac\u09a6\u09cd\u09a7 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u09bf, \u09a4\u09ac\u09c7 \u0986\u09ae\u09b0\u09be \u09a8\u09bf\u09b6\u09cd\u099a\u09af\u09bc\u09a4\u09be \u09a6\u09bf\u0987 \u09a8\u09be \u09af\u09c7 \u09b8\u09ae\u09b8\u09cd\u09a4 \u098f\u09ae\u09a8 \u09ac\u09bf\u09b7\u09af\u09bc\u09ac\u09b8\u09cd\u09a4\u09c1 \u09a7\u09b0\u09be \u09ac\u09be \u09b8\u09b0\u09be\u09a8\u09cb \u09b9\u09ac\u09c7\u0964",
"\u0985\u09cd\u09af\u09be\u09aa \u09ac\u09be\u09a1\u09bc\u09be\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b8\u09be\u09a5\u09c7 \u098f\u0987 \u09b6\u09b0\u09cd\u09a4\u09be\u09ac\u09b2\u09c0 \u0986\u09aa\u09a1\u09c7\u099f \u09b9\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964 \u0998\u09b0 \u09a6\u09c7\u0996\u09cb\u09b0 \u0995\u09cd\u09b0\u09ae\u09be\u0997\u09a4 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u09ae\u09be\u09a8\u09c7 \u0986\u09aa\u09a8\u09bf \u09b6\u09b0\u09cd\u09a4\u09be\u09ac\u09b2\u09c0\u09b0 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09b8\u0982\u09b8\u09cd\u0995\u09b0\u09a3 \u09ae\u09c7\u09a8\u09c7 \u09a8\u09c7\u09a8\u0964"
],
mr:[
"\u0918\u0930 \u0926\u0947\u0916\u094b \u0939\u0947 \u090f\u0915 \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917 \u092a\u094d\u0932\u0945\u091f\u092b\u0949\u0930\u094d\u092e \u0906\u0939\u0947 \u091c\u0947 \u092e\u093e\u0932\u0915, \u0935\u093f\u0915\u094d\u0930\u0947\u0924\u0947 \u0906\u0923\u093f \u0905\u092d\u094d\u092f\u093e\u0938-\u091c\u093e\u0917\u093e \u092a\u0941\u0930\u0935\u0920\u093e\u0926\u093e\u0930\u093e\u0902\u0928\u093e \u0916\u094b\u0932\u0940, \u0918\u0930 \u0915\u093f\u0902\u0935\u093e \u091c\u093e\u0917\u093e \u0936\u094b\u0927\u0923\u093e\u0931\u094d\u092f\u093e \u0932\u094b\u0915\u093e\u0902\u0936\u0940 \u0925\u0947\u091f \u091c\u094b\u0921\u0923\u094d\u092f\u093e\u0938 \u092e\u0926\u0924 \u0915\u0930\u0924\u0947. \u0906\u092e\u094d\u0939\u0940 \u092b\u0915\u094d\u0924 \u090f\u0915 \u092d\u0947\u091f\u0940\u091a\u0947 \u0920\u093f\u0915\u093e\u0923 \u0906\u0939\u094b\u0924 \u2014 \u0926\u0932\u093e\u0932, \u090f\u091c\u0902\u091f, \u0918\u0930\u092e\u093e\u0932\u0915 \u0915\u093f\u0902\u0935\u093e \u0935\u093e\u092a\u0930\u0915\u0930\u094d\u0924\u094d\u092f\u093e\u0902\u092e\u0927\u0940\u0932 \u0915\u094b\u0923\u0924\u094d\u092f\u093e\u0939\u0940 \u0915\u0930\u093e\u0930\u093e\u091a\u093e \u092a\u0915\u094d\u0937 \u0928\u093e\u0939\u0940.",
"\u0906\u092e\u094d\u0939\u0940 \u0935\u093e\u092a\u0930\u0915\u0930\u094d\u0924\u094d\u092f\u093e\u0902\u091a\u0940 \u0913\u0933\u0916, \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917\u091a\u0940 \u0905\u091a\u0942\u0915\u0924\u093e, \u0915\u093f\u0902\u0935\u093e \u0915\u094b\u0923\u0924\u094d\u092f\u093e\u0939\u0940 \u092e\u093e\u0932\u092e\u0924\u094d\u0924\u0947\u091a\u0940 \u0938\u094d\u0925\u093f\u0924\u0940, \u0935\u0948\u0927\u0924\u093e \u0915\u093f\u0902\u0935\u093e \u092e\u093e\u0932\u0915\u0940 \u0938\u0924\u094d\u092f\u093e\u092a\u093f\u0924 \u0915\u0930\u0924 \u0928\u093e\u0939\u0940. \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917\u092e\u0927\u094d\u092f\u0947 \u0926\u093e\u0916\u0935\u0932\u0947\u0932\u0940 \u092e\u093e\u0939\u093f\u0924\u0940 \u0924\u0940 \u092a\u094b\u0938\u094d\u091f \u0915\u0930\u0923\u093e\u0931\u094d\u092f\u093e \u0935\u094d\u092f\u0915\u094d\u0924\u0940\u0928\u0947 \u0926\u093f\u0932\u0947\u0932\u0940 \u0906\u0939\u0947, \u0918\u0930 \u0926\u0947\u0916\u094b\u0928\u0947 \u0928\u093e\u0939\u0940.",
"\u092e\u093e\u0932\u0915/\u0935\u093f\u0915\u094d\u0930\u0947\u0924\u093e \u0906\u0923\u093f \u0936\u094b\u0927\u0923\u093e\u0930\u093e \u092f\u093e\u0902\u091a\u094d\u092f\u093e\u0924\u0940\u0932 \u0915\u094b\u0923\u0924\u093e\u0939\u0940 \u0938\u0902\u0935\u093e\u0926, \u092d\u0947\u091f, \u092a\u0947\u092e\u0947\u0902\u091f, \u0915\u0930\u093e\u0930 \u0915\u093f\u0902\u0935\u093e \u0935\u094d\u092f\u0935\u0939\u093e\u0930 \u092a\u0942\u0930\u094d\u0923\u092a\u0923\u0947 \u0924\u094d\u092f\u093e\u0902\u091a\u094d\u092f\u093e \u0938\u094d\u0935\u0924\u0903\u091a\u094d\u092f\u093e \u091c\u094b\u0916\u092e\u0940\u0935\u0930 \u0939\u094b\u0924\u094b. \u0918\u0930 \u0926\u0947\u0916\u094b\u091a\u093e \u092f\u093e\u0924 \u0915\u094b\u0923\u0924\u093e\u0939\u0940 \u0938\u0939\u092d\u093e\u0917 \u0915\u093f\u0902\u0935\u093e \u091c\u092c\u093e\u092c\u0926\u093e\u0930\u0940 \u0928\u093e\u0939\u0940.",
"\u0918\u0930 \u0926\u0947\u0916\u094b \u092f\u093e \u0905\u0945\u092a\u0926\u094d\u0935\u093e\u0930\u0947 \u091d\u093e\u0932\u0947\u0932\u094d\u092f\u093e \u0938\u0902\u092a\u0930\u094d\u0915\u093e\u0924\u0942\u0928 \u0909\u0926\u094d\u092d\u0935\u0923\u093e\u0931\u094d\u092f\u093e \u0915\u094b\u0923\u0924\u094d\u092f\u093e\u0939\u0940 \u0935\u093e\u0926, \u092b\u0938\u0935\u0923\u0942\u0915, \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0941\u0915\u0938\u093e\u0928, \u092e\u093e\u0932\u092e\u0924\u094d\u0924\u0947\u091a\u0947 \u0928\u0941\u0915\u0938\u093e\u0928, \u0917\u0948\u0930\u0935\u0930\u094d\u0924\u0928, \u091b\u0933, \u0907\u091c\u093e \u0915\u093f\u0902\u0935\u093e \u0907\u0924\u0930 \u0915\u094b\u0923\u0924\u094d\u092f\u093e\u0939\u0940 \u0905\u0928\u0941\u091a\u093f\u0924 \u0918\u091f\u0928\u0947\u0938\u093e\u0920\u0940 \u091c\u092c\u093e\u092c\u0926\u093e\u0930 \u0928\u093e\u0939\u0940.",
"\u0915\u094b\u0923\u093e\u0932\u093e \u092d\u0947\u091f\u0923\u094d\u092f\u093e\u092a\u0942\u0930\u094d\u0935\u0940 \u0915\u093f\u0902\u0935\u093e \u092a\u0947\u092e\u0947\u0902\u091f \u0915\u0930\u0923\u094d\u092f\u093e\u092a\u0942\u0930\u094d\u0935\u0940, \u0906\u092e\u094d\u0939\u0940 \u0926\u0941\u0938\u0931\u094d\u092f\u093e \u0935\u094d\u092f\u0915\u094d\u0924\u0940\u091a\u0940 \u0913\u0933\u0916 \u0938\u0924\u094d\u092f\u093e\u092a\u093f\u0924 \u0915\u0930\u0923\u094d\u092f\u093e\u091a\u0940, \u092e\u093e\u0932\u092e\u0924\u094d\u0924\u0947\u091a\u0940 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u092a\u093e\u0939\u0923\u0940 \u0915\u0930\u0923\u094d\u092f\u093e\u091a\u0940 \u0906\u0923\u093f \u0936\u0915\u094d\u092f \u0905\u0938\u0947\u0932 \u0924\u093f\u0925\u0947 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924, \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0920\u093f\u0915\u093e\u0923\u0940 \u092d\u0947\u091f\u0923\u094d\u092f\u093e\u091a\u0940 \u091c\u094b\u0930\u0926\u093e\u0930 \u0936\u093f\u092b\u093e\u0930\u0938 \u0915\u0930\u0924\u094b.",
"\u0918\u0930 \u0926\u0947\u0916\u094b \u0935\u093e\u092a\u0930\u0942\u0928, \u0924\u0941\u092e\u094d\u0939\u0940 \u092a\u094d\u0932\u0945\u091f\u092b\u0949\u0930\u094d\u092e\u091a\u093e \u091c\u092c\u093e\u092c\u0926\u093e\u0930\u0940\u0928\u0947 \u0935\u093e\u092a\u0930 \u0915\u0930\u0923\u094d\u092f\u093e\u0938, \u092a\u094d\u0930\u093e\u092e\u093e\u0923\u093f\u0915 \u092e\u093e\u0939\u093f\u0924\u0940 \u092a\u094b\u0938\u094d\u091f \u0915\u0930\u0923\u094d\u092f\u093e\u0938, \u0906\u0923\u093f \u0907\u0924\u0930 \u0935\u093e\u092a\u0930\u0915\u0930\u094d\u0924\u094d\u092f\u093e\u0902\u0936\u0940 \u0938\u0902\u0935\u093e\u0926 \u0938\u093e\u0927\u0924\u093e\u0928\u093e \u092f\u094b\u0917\u094d\u092f \u0924\u0940 \u0916\u092c\u0930\u0926\u093e\u0930\u0940 \u0918\u0947\u0923\u094d\u092f\u093e\u0938 \u0938\u0939\u092e\u0924 \u0906\u0939\u093e\u0924.",
"\u092b\u0938\u0935\u0940, \u0917\u0948\u0930\u0935\u0930\u094d\u0924\u0928\u093e\u091a\u0940 \u0915\u093f\u0902\u0935\u093e \u092f\u093e \u0905\u091f\u0940\u0902\u091a\u0947 \u0909\u0932\u094d\u0932\u0902\u0918\u0928 \u0915\u0930\u0923\u093e\u0930\u0940 \u0935\u093e\u091f\u0923\u093e\u0930\u0940 \u0932\u093f\u0938\u094d\u091f\u093f\u0902\u0917 \u0906\u092e\u094d\u0939\u0940 \u0915\u093e\u0922\u0942 \u0936\u0915\u0924\u094b \u0915\u093f\u0902\u0935\u093e \u0916\u093e\u0924\u0940 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093f\u0924 \u0915\u0930\u0942 \u0936\u0915\u0924\u094b, \u092a\u0923 \u0905\u0938\u0947 \u0938\u0930\u094d\u0935 \u0915\u0902\u091f\u0947\u0902\u091f \u092a\u0915\u0921\u0932\u0947 \u0915\u093f\u0902\u0935\u093e \u0915\u093e\u0922\u0932\u0947 \u091c\u093e\u0908\u0932\u091a \u092f\u093e\u091a\u0940 \u0939\u092e\u0940 \u0928\u093e\u0939\u0940.",
"\u0905\u0945\u092a \u0935\u093e\u0922\u0924 \u0905\u0938\u0924\u093e\u0928\u093e \u092f\u093e \u0905\u091f\u0940 \u0905\u0926\u094d\u092f\u092f\u093e\u0935\u0924 \u0915\u0947\u0932\u094d\u092f\u093e \u091c\u093e\u090a \u0936\u0915\u0924\u093e\u0924. \u0918\u0930 \u0926\u0947\u0916\u094b\u091a\u093e \u0938\u0924\u0924 \u0935\u093e\u092a\u0930 \u092e\u094d\u0939\u0923\u091c\u0947 \u0924\u0941\u092e\u094d\u0939\u0940 \u0905\u091f\u0940\u0902\u091a\u0940 \u0938\u0927\u094d\u092f\u093e\u091a\u0940 \u0906\u0935\u0943\u0924\u094d\u0924\u0940 \u0938\u094d\u0935\u0940\u0915\u093e\u0930\u0924\u093e."
],
te:[
"\u0c18\u0c30\u0c4d \u0c26\u0c47\u0c16\u0c4b \u0c05\u0c28\u0c47\u0c26\u0c3f \u0c2f\u0c1c\u0c2e\u0c3e\u0c28\u0c41\u0c32\u0c41, \u0c35\u0c3f\u0c15\u0c4d\u0c30\u0c47\u0c24\u0c32\u0c41 \u0c2e\u0c30\u0c3f\u0c2f\u0c41 \u0c38\u0c4d\u0c1f\u0c21\u0c40-\u0c38\u0c4d\u0c2a\u0c47\u0c38\u0c4d \u0c2a\u0c4d\u0c30\u0c4a\u0c35\u0c48\u0c21\u0c30\u0c4d\u0c32\u0c28\u0c41 \u0c17\u0c26\u0c3f, \u0c07\u0c32\u0c4d\u0c32\u0c41 \u0c32\u0c47\u0c26\u0c3e \u0c38\u0c40\u0c1f\u0c41 \u0c15\u0c4b\u0c38\u0c02 \u0c35\u0c46\u0c24\u0c41\u0c15\u0c41\u0c24\u0c41\u0c28\u0c4d\u0c28 \u0c35\u0c4d\u0c2f\u0c15\u0c4d\u0c24\u0c41\u0c32\u0c24\u0c4b \u0c28\u0c47\u0c30\u0c41\u0c17\u0c3e \u0c05\u0c28\u0c41\u0c38\u0c02\u0c27\u0c3e\u0c28\u0c3f\u0c02\u0c1a\u0c47 \u0c32\u0c3f\u0c38\u0c4d\u0c1f\u0c3f\u0c02\u0c17\u0c4d \u0c2a\u0c4d\u0c32\u0c3e\u0c1f\u0c4d\u200c\u0c2b\u0c3e\u0c30\u0c2e\u0c4d. \u0c2e\u0c47\u0c2e\u0c41 \u0c15\u0c47\u0c35\u0c32\u0c02 \u0c12\u0c15 \u0c15\u0c32\u0c2f\u0c3f\u0c15 \u0c38\u0c4d\u0c25\u0c32\u0c02 \u0c2e\u0c3e\u0c24\u0c4d\u0c30\u0c2e\u0c47 \u2014 \u0c2c\u0c4d\u0c30\u0c4b\u0c15\u0c30\u0c4d, \u0c0f\u0c1c\u0c46\u0c02\u0c1f\u0c4d, \u0c2f\u0c1c\u0c2e\u0c3e\u0c28\u0c3f \u0c15\u0c3e\u0c26\u0c41, \u0c35\u0c3f\u0c28\u0c3f\u0c2f\u0c4b\u0c17\u0c26\u0c3e\u0c30\u0c41\u0c32 \u0c2e\u0c27\u0c4d\u0c2f \u0c12\u0c2a\u0c4d\u0c2a\u0c02\u0c26\u0c3e\u0c28\u0c3f\u0c15\u0c3f \u0c2a\u0c15\u0c4d\u0c37\u0c02 \u0c15\u0c3e\u0c26\u0c41.",
"\u0c2e\u0c47\u0c2e\u0c41 \u0c35\u0c3f\u0c28\u0c3f\u0c2f\u0c4b\u0c17\u0c26\u0c3e\u0c30\u0c41\u0c32 \u0c17\u0c41\u0c30\u0c4d\u0c24\u0c3f\u0c02\u0c2a\u0c41, \u0c32\u0c3f\u0c38\u0c4d\u0c1f\u0c3f\u0c02\u0c17\u0c4d\u200c\u0c32 \u0c16\u0c1a\u0c4d\u0c1a\u0c3f\u0c24\u0c24\u0c4d\u0c35\u0c02, \u0c32\u0c47\u0c26\u0c3e \u0c0f\u0c26\u0c48\u0c28\u0c3e \u0c06\u0c38\u0c4d\u0c24\u0c3f \u0c2a\u0c30\u0c3f\u0c38\u0c4d\u0c25\u0c3f\u0c24\u0c3f, \u0c1a\u0c1f\u0c4d\u0c1f\u0c2c\u0c26\u0c4d\u0c27\u0c24 \u0c32\u0c47\u0c26\u0c3e \u0c2f\u0c3e\u0c1c\u0c2e\u0c3e\u0c28\u0c4d\u0c2f\u0c3e\u0c28\u0c4d\u0c28\u0c3f \u0c27\u0c43\u0c35\u0c40\u0c15\u0c30\u0c3f\u0c02\u0c1a\u0c2e\u0c41. \u0c32\u0c3f\u0c38\u0c4d\u0c1f\u0c3f\u0c02\u0c17\u0c4d\u200c\u0c32\u0c4b \u0c2e\u0c40\u0c30\u0c41 \u0c1a\u0c42\u0c38\u0c47\u0c26\u0c3f \u0c2a\u0c4b\u0c38\u0c4d\u0c1f\u0c4d \u0c1a\u0c47\u0c38\u0c3f\u0c28 \u0c35\u0c4d\u0c2f\u0c15\u0c4d\u0c24\u0c3f \u0c05\u0c02\u0c26\u0c3f\u0c02\u0c1a\u0c3f\u0c28\u0c26\u0c3f, \u0c18\u0c30\u0c4d \u0c26\u0c47\u0c16\u0c4b \u0c15\u0c3e\u0c26\u0c41.",
"\u0c2f\u0c1c\u0c2e\u0c3e\u0c28\u0c3f/\u0c35\u0c3f\u0c15\u0c4d\u0c30\u0c47\u0c24 \u0c2e\u0c30\u0c3f\u0c2f\u0c41 \u0c05\u0c28\u0c4d\u0c35\u0c47\u0c37\u0c15\u0c41\u0c28\u0c3f \u0c2e\u0c27\u0c4d\u0c2f \u0c0f\u0c26\u0c48\u0c28\u0c3e \u0c38\u0c02\u0c2d\u0c3e\u0c37\u0c23, \u0c38\u0c2e\u0c3e\u0c35\u0c47\u0c36\u0c02, \u0c1a\u0c46\u0c32\u0c4d\u0c32\u0c3f\u0c02\u0c2a\u0c41, \u0c12\u0c2a\u0c4d\u0c2a\u0c02\u0c26\u0c02 \u0c32\u0c47\u0c26\u0c3e \u0c32\u0c3e\u0c35\u0c3e\u0c26\u0c47\u0c35\u0c40 \u0c2a\u0c42\u0c30\u0c4d\u0c24\u0c3f\u0c17\u0c3e \u0c35\u0c3e\u0c30\u0c3f \u0c38\u0c4d\u0c35\u0c02\u0c24 \u0c30\u0c3f\u0c38\u0c4d\u0c15\u0c4d\u200c\u0c2a\u0c48 \u0c1c\u0c30\u0c41\u0c17\u0c41\u0c24\u0c41\u0c02\u0c26\u0c3f. \u0c18\u0c30\u0c4d \u0c26\u0c47\u0c16\u0c4b\u0c15\u0c41 \u0c07\u0c02\u0c26\u0c41\u0c32\u0c4b \u0c2a\u0c4d\u0c30\u0c2e\u0c47\u0c2f\u0c02 \u0c32\u0c47\u0c26\u0c3e \u0c2c\u0c3e\u0c27\u0c4d\u0c2f\u0c24 \u0c32\u0c47\u0c26\u0c41.",
"\u0c08 \u0c2f\u0c3e\u0c2a\u0c4d \u0c26\u0c4d\u0c35\u0c3e\u0c30\u0c3e \u0c1c\u0c30\u0c3f\u0c17\u0c3f\u0c28 \u0c38\u0c02\u0c2a\u0c4d\u0c30\u0c26\u0c3f\u0c02\u0c2a\u0c41\u0c32 \u0c28\u0c41\u0c02\u0c21\u0c3f \u0c09\u0c24\u0c4d\u0c2a\u0c28\u0c4d\u0c28\u0c2e\u0c2f\u0c4d\u0c2f\u0c47 \u0c0f\u0c26\u0c48\u0c28\u0c3e \u0c35\u0c3f\u0c35\u0c3e\u0c26\u0c02, \u0c2e\u0c4b\u0c38\u0c02, \u0c06\u0c30\u0c4d\u0c25\u0c3f\u0c15 \u0c28\u0c37\u0c4d\u0c1f\u0c02, \u0c06\u0c38\u0c4d\u0c24\u0c3f \u0c28\u0c37\u0c4d\u0c1f\u0c02, \u0c26\u0c41\u0c30\u0c4d\u0c35\u0c3f\u0c28\u0c3f\u0c2f\u0c4b\u0c17\u0c02, \u0c35\u0c47\u0c27\u0c3f\u0c02\u0c2a\u0c41\u0c32\u0c41, \u0c17\u0c3e\u0c2f\u0c02 \u0c32\u0c47\u0c26\u0c3e \u0c07\u0c24\u0c30 \u0c05\u0c35\u0c3e\u0c02\u0c1b\u0c28\u0c40\u0c2f \u0c38\u0c02\u0c18\u0c1f\u0c28\u0c15\u0c41 \u0c18\u0c30\u0c4d \u0c26\u0c47\u0c16\u0c4b \u0c2c\u0c3e\u0c27\u0c4d\u0c2f\u0c24 \u0c35\u0c39\u0c3f\u0c02\u0c1a\u0c26\u0c41.",
"\u0c0e\u0c35\u0c30\u0c3f\u0c28\u0c48\u0c28\u0c3e \u0c15\u0c32\u0c35\u0c21\u0c3e\u0c28\u0c3f\u0c15\u0c3f \u0c32\u0c47\u0c26\u0c3e \u0c1a\u0c46\u0c32\u0c4d\u0c32\u0c3f\u0c02\u0c2a\u0c41 \u0c1a\u0c47\u0c2f\u0c21\u0c3e\u0c28\u0c3f\u0c15\u0c3f \u0c2e\u0c41\u0c02\u0c26\u0c41, \u0c30\u0c46\u0c02\u0c21\u0c4b \u0c35\u0c4d\u0c2f\u0c15\u0c4d\u0c24\u0c3f \u0c17\u0c41\u0c30\u0c4d\u0c24\u0c3f\u0c02\u0c2a\u0c41\u0c28\u0c41 \u0c27\u0c43\u0c35\u0c40\u0c15\u0c30\u0c3f\u0c02\u0c1a\u0c3e\u0c32\u0c28\u0c3f, \u0c06\u0c38\u0c4d\u0c24\u0c3f\u0c28\u0c3f \u0c35\u0c4d\u0c2f\u0c15\u0c4d\u0c24\u0c3f\u0c17\u0c24\u0c02\u0c17\u0c3e \u0c2a\u0c30\u0c3f\u0c36\u0c40\u0c32\u0c3f\u0c02\u0c1a\u0c3e\u0c32\u0c28\u0c3f, \u0c2e\u0c30\u0c3f\u0c2f\u0c41 \u0c35\u0c40\u0c32\u0c48\u0c28\u0c2a\u0c4d\u0c2a\u0c41\u0c21\u0c41 \u0c38\u0c41\u0c30\u0c15\u0c4d\u0c37\u0c3f\u0c24\u0c2e\u0c48\u0c28, \u0c2c\u0c39\u0c3f\u0c30\u0c02\u0c17 \u0c2a\u0c4d\u0c30\u0c26\u0c47\u0c36\u0c3e\u0c32\u0c32\u0c4b \u0c15\u0c32\u0c35\u0c3e\u0c32\u0c28\u0c3f \u0c2e\u0c47\u0c2e\u0c41 \u0c17\u0c1f\u0c4d\u0c1f\u0c3f\u0c17\u0c3e \u0c38\u0c3f\u0c2b\u0c3e\u0c30\u0c4d\u0c38\u0c41 \u0c1a\u0c47\u0c38\u0c4d\u0c24\u0c41\u0c28\u0c4d\u0c28\u0c3e\u0c2e\u0c41.",
"\u0c18\u0c30\u0c4d \u0c26\u0c47\u0c16\u0c4b\u0c28\u0c41 \u0c09\u0c2a\u0c2f\u0c4b\u0c17\u0c3f\u0c02\u0c1a\u0c21\u0c02 \u0c26\u0c4d\u0c35\u0c3e\u0c30\u0c3e, \u0c2e\u0c40\u0c30\u0c41 \u0c2a\u0c4d\u0c32\u0c3e\u0c1f\u0c4d\u200c\u0c2b\u0c3e\u0c30\u0c2e\u0c4d\u200c\u0c28\u0c41 \u0c2c\u0c3e\u0c27\u0c4d\u0c2f\u0c24\u0c3e\u0c2f\u0c41\u0c24\u0c02\u0c17\u0c3e \u0c09\u0c2a\u0c2f\u0c4b\u0c17\u0c3f\u0c02\u0c1a\u0c21\u0c3e\u0c28\u0c3f\u0c15\u0c3f, \u0c28\u0c3f\u0c1c\u0c3e\u0c2f\u0c3f\u0c24\u0c40\u0c17\u0c32 \u0c38\u0c2e\u0c3e\u0c1a\u0c3e\u0c30\u0c02 \u0c2a\u0c4b\u0c38\u0c4d\u0c1f\u0c4d \u0c1a\u0c47\u0c2f\u0c21\u0c3e\u0c28\u0c3f\u0c15\u0c3f, \u0c07\u0c24\u0c30 \u0c35\u0c3f\u0c28\u0c3f\u0c2f\u0c4b\u0c17\u0c26\u0c3e\u0c30\u0c41\u0c32\u0c24\u0c4b \u0c38\u0c02\u0c2d\u0c3e\u0c37\u0c3f\u0c02\u0c1a\u0c47\u0c1f\u0c2a\u0c4d\u0c2a\u0c41\u0c21\u0c41 \u0c24\u0c17\u0c3f\u0c28 \u0c1c\u0c3e\u0c17\u0c4d\u0c30\u0c24\u0c4d\u0c24\u0c32\u0c41 \u0c24\u0c40\u0c38\u0c41\u0c15\u0c4b\u0c35\u0c21\u0c3e\u0c28\u0c3f\u0c15\u0c3f \u0c05\u0c02\u0c17\u0c40\u0c15\u0c30\u0c3f\u0c38\u0c4d\u0c24\u0c41\u0c28\u0c4d\u0c28\u0c3e\u0c30\u0c41.",
"\u0c2e\u0c4b\u0c38\u0c2a\u0c42\u0c30\u0c3f\u0c24\u0c02\u0c17\u0c3e, \u0c26\u0c41\u0c30\u0c4d\u0c35\u0c3f\u0c28\u0c3f\u0c2f\u0c4b\u0c17\u0c02\u0c17\u0c3e \u0c32\u0c47\u0c26\u0c3e \u0c08 \u0c28\u0c3f\u0c2c\u0c02\u0c27\u0c28\u0c32\u0c28\u0c41 \u0c09\u0c32\u0c4d\u0c32\u0c02\u0c18\u0c3f\u0c02\u0c1a\u0c47\u0c32\u0c3e \u0c15\u0c28\u0c3f\u0c2a\u0c3f\u0c02\u0c1a\u0c47 \u0c32\u0c3f\u0c38\u0c4d\u0c1f\u0c3f\u0c02\u0c17\u0c4d\u200c\u0c32\u0c28\u0c41 \u0c2e\u0c47\u0c2e\u0c41 \u0c24\u0c4a\u0c32\u0c17\u0c3f\u0c02\u0c1a\u0c35\u0c1a\u0c4d\u0c1a\u0c41 \u0c32\u0c47\u0c26\u0c3e \u0c16\u0c3e\u0c24\u0c3e\u0c32\u0c28\u0c41 \u0c2a\u0c30\u0c3f\u0c2e\u0c3f\u0c24\u0c02 \u0c1a\u0c47\u0c2f\u0c35\u0c1a\u0c4d\u0c1a\u0c41, \u0c15\u0c3e\u0c28\u0c40 \u0c05\u0c32\u0c3e\u0c02\u0c1f\u0c3f \u0c15\u0c02\u0c1f\u0c46\u0c02\u0c1f\u0c4d \u0c05\u0c02\u0c24\u0c3e \u0c2a\u0c1f\u0c4d\u0c1f\u0c41\u0c15\u0c41\u0c02\u0c1f\u0c3e\u0c2e\u0c28\u0c3f \u0c32\u0c47\u0c26\u0c3e \u0c24\u0c4a\u0c32\u0c17\u0c3f\u0c38\u0c4d\u0c24\u0c3e\u0c2e\u0c28\u0c3f \u0c39\u0c3e\u0c2e\u0c40 \u0c07\u0c35\u0c4d\u0c35\u0c2e\u0c41.",
"\u0c2f\u0c3e\u0c2a\u0c4d \u0c2a\u0c46\u0c30\u0c41\u0c17\u0c41\u0c24\u0c41\u0c28\u0c4d\u0c28 \u0c15\u0c4a\u0c26\u0c4d\u0c26\u0c40 \u0c08 \u0c28\u0c3f\u0c2c\u0c02\u0c27\u0c28\u0c32\u0c41 \u0c05\u0c2a\u0c4d\u200c\u0c21\u0c47\u0c1f\u0c4d \u0c15\u0c3e\u0c35\u0c1a\u0c4d\u0c1a\u0c41. \u0c18\u0c30\u0c4d \u0c26\u0c47\u0c16\u0c4b\u0c28\u0c41 \u0c28\u0c3f\u0c30\u0c02\u0c24\u0c30\u0c02 \u0c09\u0c2a\u0c2f\u0c4b\u0c17\u0c3f\u0c02\u0c1a\u0c21\u0c02 \u0c05\u0c02\u0c1f\u0c47 \u0c2e\u0c40\u0c30\u0c41 \u0c28\u0c3f\u0c2c\u0c02\u0c27\u0c28\u0c32 \u0c2a\u0c4d\u0c30\u0c38\u0c4d\u0c24\u0c41\u0c24 \u0c35\u0c46\u0c30\u0c4d\u0c37\u0c28\u0c4d\u200c\u0c28\u0c41 \u0c05\u0c02\u0c17\u0c40\u0c15\u0c30\u0c3f\u0c38\u0c4d\u0c24\u0c41\u0c28\u0c4d\u0c28\u0c3e\u0c30\u0c28\u0c3f \u0c05\u0c30\u0c4d\u0c25\u0c02."
],
ta:[
"\u0b95\u0bb0\u0bcd \u0ba4\u0bc7\u0b95\u0bcb \u0b8e\u0ba9\u0bcd\u0baa\u0ba4\u0bc1 \u0bb5\u0bc0\u0b9f\u0bc1, \u0b85\u0bb1\u0bc8 \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0b87\u0b9f\u0bae\u0bcd \u0ba4\u0bc7\u0b9f\u0bc1\u0bae\u0bcd \u0ba8\u0baa\u0bb0\u0bcd\u0b95\u0bb3\u0bc1\u0b9f\u0ba9\u0bcd \u0b89\u0bb0\u0bbf\u0bae\u0bc8\u0baf\u0bbe\u0bb3\u0bb0\u0bcd\u0b95\u0bb3\u0bcd, \u0bb5\u0bbf\u0bb1\u0bcd\u0baa\u0ba9\u0bc8\u0baf\u0bbe\u0bb3\u0bb0\u0bcd\u0b95\u0bb3\u0bcd \u0bae\u0bb1\u0bcd\u0bb1\u0bc1\u0bae\u0bcd \u0baa\u0b9f\u0bbf\u0baa\u0bcd\u0baa\u0bc1-\u0b87\u0b9f \u0bb5\u0bb4\u0b99\u0bcd\u0b95\u0bc1\u0ba8\u0bb0\u0bcd\u0b95\u0bb3\u0bc8 \u0ba8\u0bc7\u0bb0\u0b9f\u0bbf\u0baf\u0bbe\u0b95 \u0b87\u0ba3\u0bc8\u0b95\u0bcd\u0b95\u0bc1\u0bae\u0bcd \u0baa\u0b9f\u0bcd\u0b9f\u0bbf\u0baf\u0bb2\u0bcd \u0ba4\u0bb3\u0bae\u0bbe\u0b95\u0bc1\u0bae\u0bcd. \u0ba8\u0bbe\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0b92\u0bb0\u0bc1 \u0b9a\u0ba8\u0bcd\u0ba4\u0bbf\u0baa\u0bcd\u0baa\u0bc1 \u0b87\u0b9f\u0bae\u0bcd \u0bae\u0b9f\u0bcd\u0b9f\u0bc1\u0bae\u0bc7 \u2014 \u0ba4\u0bb0\u0b95\u0bb0\u0bcd, \u0bae\u0bc1\u0b95\u0bb5\u0bb0\u0bcd, \u0bb5\u0bc0\u0b9f\u0bcd\u0b9f\u0bc1 \u0b89\u0bb0\u0bbf\u0bae\u0bc8\u0baf\u0bbe\u0bb3\u0bb0\u0bcd \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0baa\u0baf\u0ba9\u0bb0\u0bcd\u0b95\u0bb3\u0bc1\u0b95\u0bcd\u0b95\u0bbf\u0b9f\u0bc8\u0baf\u0bc7\u0baf\u0bbe\u0ba9 \u0b8e\u0ba8\u0bcd\u0ba4 \u0b92\u0baa\u0bcd\u0baa\u0ba8\u0bcd\u0ba4\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bc1\u0bae\u0bcd \u0ba4\u0bb0\u0baa\u0bcd\u0baa\u0bbf\u0ba9\u0bb0\u0bcd \u0b85\u0bb2\u0bcd\u0bb2.",
"\u0baa\u0baf\u0ba9\u0bb0\u0bcd\u0b95\u0bb3\u0bbf\u0ba9\u0bcd \u0b85\u0b9f\u0bc8\u0baf\u0bbe\u0bb3\u0bae\u0bcd, \u0baa\u0b9f\u0bcd\u0b9f\u0bbf\u0baf\u0bb2\u0bcd\u0b95\u0bb3\u0bbf\u0ba9\u0bcd \u0ba4\u0bc1\u0bb2\u0bcd\u0bb2\u0bbf\u0baf\u0bae\u0bcd, \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0b8e\u0ba8\u0bcd\u0ba4 \u0b9a\u0bca\u0ba4\u0bcd\u0ba4\u0bbf\u0ba9\u0bcd \u0ba8\u0bbf\u0bb2\u0bc8, \u0b9a\u0b9f\u0bcd\u0b9f\u0baa\u0bc2\u0bb0\u0bcd\u0bb5\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bc8 \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0b89\u0bb0\u0bbf\u0bae\u0bc8\u0baf\u0bc8 \u0ba8\u0bbe\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0b9a\u0bb0\u0bbf\u0baa\u0bbe\u0bb0\u0bcd\u0b95\u0bcd\u0b95\u0bb5\u0bbf\u0bb2\u0bcd\u0bb2\u0bc8. \u0baa\u0b9f\u0bcd\u0b9f\u0bbf\u0baf\u0bb2\u0bbf\u0bb2\u0bcd \u0ba8\u0bc0\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0baa\u0bbe\u0bb0\u0bcd\u0baa\u0bcd\u0baa\u0ba4\u0bc1 \u0b85\u0ba4\u0bc8 \u0bb5\u0bc6\u0bb3\u0bbf\u0baf\u0bbf\u0b9f\u0bcd\u0b9f \u0ba8\u0baa\u0bb0\u0bbe\u0bb2\u0bcd \u0bb5\u0bb4\u0b99\u0bcd\u0b95\u0baa\u0bcd\u0baa\u0b9f\u0bcd\u0b9f\u0ba4\u0bc1, \u0b95\u0bb0\u0bcd \u0ba4\u0bc7\u0b95\u0bcb\u0bb5\u0bbe\u0bb2\u0bcd \u0b85\u0bb2\u0bcd\u0bb2.",
"\u0b89\u0bb0\u0bbf\u0bae\u0bc8\u0baf\u0bbe\u0bb3\u0bb0\u0bcd/\u0bb5\u0bbf\u0bb1\u0bcd\u0baa\u0ba9\u0bc8\u0baf\u0bbe\u0bb3\u0bb0\u0bcd \u0bae\u0bb1\u0bcd\u0bb1\u0bc1\u0bae\u0bcd \u0ba4\u0bc7\u0b9f\u0bc1\u0baa\u0bb5\u0bb0\u0bc1\u0b95\u0bcd\u0b95\u0bc1 \u0b87\u0b9f\u0bc8\u0baf\u0bc7\u0baf\u0bbe\u0ba9 \u0b8e\u0ba8\u0bcd\u0ba4 \u0ba4\u0bca\u0b9f\u0bb0\u0bcd\u0baa\u0bc1, \u0b9a\u0ba8\u0bcd\u0ba4\u0bbf\u0baa\u0bcd\u0baa\u0bc1, \u0b95\u0b9f\u0bcd\u0b9f\u0ba3\u0bae\u0bcd, \u0b92\u0baa\u0bcd\u0baa\u0ba8\u0bcd\u0ba4\u0bae\u0bcd \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0baa\u0bb0\u0bbf\u0bb5\u0bb0\u0bcd\u0ba4\u0bcd\u0ba4\u0ba9\u0bc8\u0baf\u0bc1\u0bae\u0bcd \u0bae\u0bc1\u0bb1\u0bcd\u0bb1\u0bbf\u0bb2\u0bc1\u0bae\u0bcd \u0b85\u0bb5\u0bb0\u0bcd\u0b95\u0bb3\u0bbf\u0ba9\u0bcd \u0b9a\u0bca\u0ba8\u0bcd\u0ba4 \u0b86\u0baa\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0bc8\u0baa\u0bc6\u0bb1\u0bc1\u0b95\u0bbf\u0bb1\u0ba4\u0bc1. \u0b95\u0bb0\u0bcd \u0ba4\u0bc7\u0b95\u0bcb\u0bb5\u0bbf\u0bb1\u0bcd\u0b95\u0bc1 \u0b87\u0ba4\u0bbf\u0bb2\u0bcd \u0b8e\u0ba8\u0bcd\u0ba4 \u0b88\u0b9f\u0bc1\u0baa\u0bbe\u0b9f\u0bc1\u0bae\u0bcd \u0baa\u0bca\u0bb1\u0bc1\u0baa\u0bcd\u0baa\u0bc1\u0bae\u0bcd \u0b87\u0bb2\u0bcd\u0bb2\u0bc8.",
"\u0b87\u0ba8\u0bcd\u0ba4 \u0b86\u0baa\u0bcd \u0bae\u0bc2\u0bb2\u0bae\u0bcd \u0b8f\u0bb1\u0bcd\u0baa\u0b9f\u0bcd\u0b9f \u0ba4\u0bca\u0b9f\u0bb0\u0bcd\u0baa\u0bbf\u0bb2\u0bbf\u0bb0\u0bc1\u0ba8\u0bcd\u0ba4\u0bc1 \u0b8e\u0bb4\u0bc1\u0bae\u0bcd \u0b8e\u0ba8\u0bcd\u0ba4 \u0b9a\u0bb0\u0bcd\u0b9a\u0bcd\u0b9a\u0bc8, \u0bae\u0bcb\u0b9a\u0b9f\u0bbf, \u0ba8\u0bbf\u0ba4\u0bbf \u0b87\u0bb4\u0baa\u0bcd\u0baa\u0bc1, \u0b9a\u0bca\u0ba4\u0bcd\u0ba4\u0bc1 \u0b9a\u0bc7\u0ba4\u0bae\u0bcd, \u0ba4\u0bb5\u0bb1\u0bbe\u0ba9 \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc8, \u0ba4\u0bc1\u0ba9\u0bcd\u0baa\u0bc1\u0bb1\u0bc1\u0ba4\u0bcd\u0ba4\u0bb2\u0bcd, \u0b95\u0bbe\u0baf\u0bae\u0bcd \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0baa\u0bbf\u0bb1 \u0ba4\u0bc0\u0b99\u0bcd\u0b95\u0bc1\u0b95\u0bcd\u0b95\u0bc1 \u0b95\u0bb0\u0bcd \u0ba4\u0bc7\u0b95\u0bcb \u0baa\u0bca\u0bb1\u0bc1\u0baa\u0bcd\u0baa\u0bb2\u0bcd\u0bb2.",
"\u0baf\u0bbe\u0bb0\u0bc8\u0baf\u0bbe\u0bb5\u0ba4\u0bc1 \u0b9a\u0ba8\u0bcd\u0ba4\u0bbf\u0b95\u0bcd\u0b95\u0bc1\u0bae\u0bcd \u0bae\u0bc1\u0ba9\u0bcd \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0b95\u0b9f\u0bcd\u0b9f\u0ba3\u0bae\u0bcd \u0b9a\u0bc6\u0bb2\u0bc1\u0ba4\u0bcd\u0ba4\u0bc1\u0bae\u0bcd \u0bae\u0bc1\u0ba9\u0bcd, \u0bae\u0bb1\u0bcd\u0bb1 \u0ba8\u0baa\u0bb0\u0bbf\u0ba9\u0bcd \u0b85\u0b9f\u0bc8\u0baf\u0bbe\u0bb3\u0ba4\u0bcd\u0ba4\u0bc8 \u0b9a\u0bb0\u0bbf\u0baa\u0bbe\u0bb0\u0bcd\u0b95\u0bcd\u0b95\u0bb5\u0bc1\u0bae\u0bcd, \u0b9a\u0bca\u0ba4\u0bcd\u0ba4\u0bc8 \u0ba8\u0bc7\u0bb0\u0bbf\u0bb2\u0bcd \u0b86\u0baf\u0bcd\u0bb5\u0bc1 \u0b9a\u0bc6\u0baf\u0bcd\u0baf\u0bb5\u0bc1\u0bae\u0bcd, \u0bae\u0bc1\u0b9f\u0bbf\u0ba8\u0bcd\u0ba4\u0bb5\u0bb0\u0bc8 \u0baa\u0bbe\u0ba4\u0bc1\u0b95\u0bbe\u0baa\u0bcd\u0baa\u0bbe\u0ba9, \u0baa\u0bca\u0ba4\u0bc1 \u0b87\u0b9f\u0b99\u0bcd\u0b95\u0bb3\u0bbf\u0bb2\u0bcd \u0b9a\u0ba8\u0bcd\u0ba4\u0bbf\u0b95\u0bcd\u0b95\u0bb5\u0bc1\u0bae\u0bcd \u0ba8\u0bbe\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0b95\u0b9f\u0bc1\u0bae\u0bc8\u0baf\u0bbe\u0b95 \u0baa\u0bb0\u0bbf\u0ba8\u0bcd\u0ba4\u0bc1\u0bb0\u0bc8\u0b95\u0bcd\u0b95\u0bbf\u0bb1\u0bcb\u0bae\u0bcd.",
"\u0b95\u0bb0\u0bcd \u0ba4\u0bc7\u0b95\u0bcb\u0bb5\u0bc8\u0baa\u0bcd \u0baa\u0baf\u0ba9\u0bcd\u0baa\u0b9f\u0bc1\u0ba4\u0bcd\u0ba4\u0bc1\u0bb5\u0ba4\u0ba9\u0bcd \u0bae\u0bc2\u0bb2\u0bae\u0bcd, \u0ba4\u0bb3\u0ba4\u0bcd\u0ba4\u0bc8 \u0baa\u0bca\u0bb1\u0bc1\u0baa\u0bcd\u0baa\u0bc1\u0b9f\u0ba9\u0bcd \u0baa\u0baf\u0ba9\u0bcd\u0baa\u0b9f\u0bc1\u0ba4\u0bcd\u0ba4\u0bb5\u0bc1\u0bae\u0bcd, \u0ba8\u0bc7\u0bb0\u0bcd\u0bae\u0bc8\u0baf\u0bbe\u0ba9 \u0ba4\u0b95\u0bb5\u0bb2\u0bcd\u0b95\u0bb3\u0bc8 \u0baa\u0ba4\u0bbf\u0bb5\u0bbf\u0b9f\u0bb5\u0bc1\u0bae\u0bcd, \u0bae\u0bb1\u0bcd\u0bb1 \u0baa\u0baf\u0ba9\u0bb0\u0bcd\u0b95\u0bb3\u0bc1\u0b9f\u0ba9\u0bcd \u0ba4\u0bca\u0b9f\u0bb0\u0bcd\u0baa\u0bc1 \u0b95\u0bca\u0bb3\u0bcd\u0bb3\u0bc1\u0bae\u0bcd\u0baa\u0bcb\u0ba4\u0bc1 \u0ba8\u0bbf\u0baf\u0bbe\u0baf\u0bae\u0bbe\u0ba9 \u0bae\u0bc1\u0ba9\u0bcd\u0ba9\u0bc6\u0b9a\u0bcd\u0b9a\u0bb0\u0bbf\u0b95\u0bcd\u0b95\u0bc8 \u0ba8\u0b9f\u0bb5\u0b9f\u0bbf\u0b95\u0bcd\u0b95\u0bc8\u0b95\u0bb3\u0bc8 \u0b8e\u0b9f\u0bc1\u0b95\u0bcd\u0b95\u0bb5\u0bc1\u0bae\u0bcd \u0ba8\u0bc0\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0b92\u0baa\u0bcd\u0baa\u0bc1\u0b95\u0bcd\u0b95\u0bca\u0bb3\u0bcd\u0b95\u0bbf\u0bb1\u0bc0\u0bb0\u0bcd\u0b95\u0bb3\u0bcd.",
"\u0bae\u0bcb\u0b9a\u0b9f\u0bbf, \u0ba4\u0bb5\u0bb1\u0bbe\u0ba9 \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc8 \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0b87\u0ba8\u0bcd\u0ba4 \u0bb5\u0bbf\u0ba4\u0bbf\u0bae\u0bc1\u0bb1\u0bc8\u0b95\u0bb3\u0bc8 \u0bae\u0bc0\u0bb1\u0bc1\u0bb5\u0ba4\u0bbe\u0b95\u0ba4\u0bcd \u0ba4\u0bcb\u0ba9\u0bcd\u0bb1\u0bc1\u0bae\u0bcd \u0baa\u0b9f\u0bcd\u0b9f\u0bbf\u0baf\u0bb2\u0bcd\u0b95\u0bb3\u0bc8 \u0ba8\u0bbe\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0b85\u0b95\u0bb1\u0bcd\u0bb1\u0bb2\u0bbe\u0bae\u0bcd \u0b85\u0bb2\u0bcd\u0bb2\u0ba4\u0bc1 \u0b95\u0ba3\u0b95\u0bcd\u0b95\u0bc1\u0b95\u0bb3\u0bc8 \u0b95\u0b9f\u0bcd\u0b9f\u0bc1\u0baa\u0bcd\u0baa\u0b9f\u0bc1\u0ba4\u0bcd\u0ba4\u0bb2\u0bbe\u0bae\u0bcd, \u0b86\u0ba9\u0bbe\u0bb2\u0bcd \u0b85\u0ba4\u0bcd\u0ba4\u0b95\u0bc8\u0baf \u0b89\u0bb3\u0bcd\u0bb3\u0b9f\u0b95\u0bcd\u0b95\u0bae\u0bcd \u0b85\u0ba9\u0bc8\u0ba4\u0bcd\u0ba4\u0bc1\u0bae\u0bcd \u0b95\u0ba3\u0bcd\u0b9f\u0bb1\u0bbf\u0baf\u0baa\u0bcd\u0baa\u0b9f\u0bcd\u0b9f\u0bc1 \u0b85\u0b95\u0bb1\u0bcd\u0bb1\u0baa\u0bcd\u0baa\u0b9f\u0bc1\u0bae\u0bcd \u0b8e\u0ba9 \u0b89\u0ba4\u0bcd\u0ba4\u0bb0\u0bb5\u0bbe\u0ba4\u0bae\u0bcd \u0b85\u0bb3\u0bbf\u0b95\u0bcd\u0b95\u0bb5\u0bbf\u0bb2\u0bcd\u0bb2\u0bc8.",
"\u0b86\u0baa\u0bcd \u0bb5\u0bb3\u0bb0\u0bc1\u0bae\u0bcd\u0baa\u0bcb\u0ba4\u0bc1 \u0b87\u0ba8\u0bcd\u0ba4 \u0bb5\u0bbf\u0ba4\u0bbf\u0bae\u0bc1\u0bb1\u0bc8\u0b95\u0bb3\u0bcd \u0baa\u0bc1\u0ba4\u0bc1\u0baa\u0bcd\u0baa\u0bbf\u0b95\u0bcd\u0b95\u0baa\u0bcd\u0baa\u0b9f\u0bb2\u0bbe\u0bae\u0bcd. \u0b95\u0bb0\u0bcd \u0ba4\u0bc7\u0b95\u0bcb\u0bb5\u0bc8 \u0ba4\u0bca\u0b9f\u0bb0\u0bcd\u0ba8\u0bcd\u0ba4\u0bc1 \u0baa\u0baf\u0ba9\u0bcd\u0baa\u0b9f\u0bc1\u0ba4\u0bcd\u0ba4\u0bc1\u0bb5\u0ba4\u0bc1 \u0b8e\u0ba9\u0bcd\u0baa\u0ba4\u0bc1 \u0ba4\u0bb1\u0bcd\u0baa\u0bcb\u0ba4\u0bc8\u0baf \u0bb5\u0bbf\u0ba4\u0bbf\u0bae\u0bc1\u0bb1\u0bc8\u0b95\u0bb3\u0bc8 \u0ba8\u0bc0\u0b99\u0bcd\u0b95\u0bb3\u0bcd \u0b8f\u0bb1\u0bcd\u0bb1\u0bc1\u0b95\u0bcd\u0b95\u0bca\u0bb3\u0bcd\u0b95\u0bbf\u0bb1\u0bc0\u0bb0\u0bcd\u0b95\u0bb3\u0bcd \u0b8e\u0ba9\u0bcd\u0bb1\u0bc1 \u0baa\u0bca\u0bb0\u0bc1\u0bb3\u0bcd."
],
gu:[
"\u0a98\u0ab0 \u0aa6\u0ac7\u0a96\u0acb \u0a8f \u0a8f\u0a95 \u0ab2\u0abf\u0ab8\u0acd\u0a9f\u0abf\u0a82\u0a97 \u0aaa\u0acd\u0ab2\u0ac7\u0a9f\u0aab\u0acb\u0ab0\u0acd\u0aae \u0a9b\u0ac7 \u0a9c\u0ac7 \u0aae\u0abe\u0ab2\u0abf\u0a95\u0acb, \u0ab5\u0abf\u0a95\u0acd\u0ab0\u0ac7\u0aa4\u0abe\u0a93 \u0a85\u0aa8\u0ac7 \u0ab8\u0acd\u0a9f\u0aa1\u0ac0-\u0ab8\u0acd\u0aaa\u0ac7\u0ab8 \u0aaa\u0acd\u0ab0\u0aa6\u0abe\u0aa4\u0abe\u0a93\u0aa8\u0ac7 \u0ab0\u0ac2\u0aae, \u0a98\u0ab0 \u0a85\u0aa5\u0ab5\u0abe \u0ab8\u0ac0\u0a9f \u0ab6\u0acb\u0aa7\u0aa4\u0abe \u0ab2\u0acb\u0a95\u0acb \u0ab8\u0abe\u0aa5\u0ac7 \u0ab8\u0ac0\u0aa7\u0abe \u0a9c\u0acb\u0aa1\u0ab5\u0abe\u0aae\u0abe\u0a82 \u0aae\u0aa6\u0aa6 \u0a95\u0ab0\u0ac7 \u0a9b\u0ac7. \u0a85\u0aae\u0ac7 \u0aab\u0a95\u0acd\u0aa4 \u0a8f\u0a95 \u0aae\u0abf\u0ab2\u0aa8 \u0ab8\u0acd\u0aa5\u0ab3 \u0a9b\u0ac0\u0a8f \u2014 \u0aa6\u0ab2\u0abe\u0ab2, \u0a8f\u0a9c\u0aa8\u0acd\u0a9f, \u0aae\u0a95\u0abe\u0aa8\u0aae\u0abe\u0ab2\u0abf\u0a95 \u0a85\u0aa5\u0ab5\u0abe \u0ab5\u0aaa\u0ab0\u0abe\u0ab6\u0a95\u0ab0\u0acd\u0aa4\u0abe\u0a93 \u0ab5\u0a9a\u0acd\u0a9a\u0ac7\u0aa8\u0abe \u0a95\u0acb\u0a88\u0aaa\u0aa3 \u0a95\u0ab0\u0abe\u0ab0\u0aa8\u0acb \u0aaa\u0a95\u0acd\u0ab7 \u0aa8\u0aa5\u0ac0.",
"\u0a85\u0aae\u0ac7 \u0ab5\u0aaa\u0ab0\u0abe\u0ab6\u0a95\u0ab0\u0acd\u0aa4\u0abe\u0a93\u0aa8\u0ac0 \u0a93\u0ab3\u0a96, \u0ab2\u0abf\u0ab8\u0acd\u0a9f\u0abf\u0a82\u0a97\u0aa8\u0ac0 \u0a9a\u0acb\u0a95\u0ab8\u0abe\u0a88, \u0a85\u0aa5\u0ab5\u0abe \u0a95\u0acb\u0a88\u0aaa\u0aa3 \u0aae\u0abf\u0ab2\u0a95\u0aa4\u0aa8\u0ac0 \u0ab8\u0acd\u0aa5\u0abf\u0aa4\u0abf, \u0a95\u0abe\u0aaf\u0aa6\u0ac7\u0ab8\u0ab0\u0aa4\u0abe, \u0a85\u0aa5\u0ab5\u0abe \u0aae\u0abe\u0ab2\u0abf\u0a95\u0ac0\u0aa8\u0ac0 \u0a9a\u0a95\u0abe\u0ab8\u0aa3\u0ac0 \u0a95\u0ab0\u0aa4\u0abe \u0aa8\u0aa5\u0ac0. \u0ab2\u0abf\u0ab8\u0acd\u0a9f\u0abf\u0a82\u0a97\u0aae\u0abe\u0a82 \u0aa4\u0aae\u0ac7 \u0a9c\u0ac7 \u0a9c\u0ac1\u0a93 \u0a9b\u0acb \u0aa4\u0ac7 \u0aa4\u0ac7\u0aa8\u0ac7 \u0aaa\u0acb\u0ab8\u0acd\u0a9f \u0a95\u0ab0\u0aa8\u0abe\u0ab0 \u0ab5\u0acd\u0aaf\u0a95\u0acd\u0aa4\u0abf \u0aa6\u0acd\u0ab5\u0abe\u0ab0\u0abe \u0a86\u0aaa\u0ab5\u0abe\u0aae\u0abe\u0a82 \u0a86\u0ab5\u0acd\u0aaf\u0ac1\u0a82 \u0a9b\u0ac7, \u0a98\u0ab0 \u0aa6\u0ac7\u0a96\u0acb \u0aa6\u0acd\u0ab5\u0abe\u0ab0\u0abe \u0aa8\u0ab9\u0ac0\u0a82.",
"\u0aae\u0abe\u0ab2\u0abf\u0a95/\u0ab5\u0abf\u0a95\u0acd\u0ab0\u0ac7\u0aa4\u0abe \u0a85\u0aa8\u0ac7 \u0ab6\u0acb\u0aa7\u0aa8\u0abe\u0ab0 \u0ab5\u0a9a\u0acd\u0a9a\u0ac7\u0aa8\u0acb \u0a95\u0acb\u0a88\u0aaa\u0aa3 \u0ab8\u0a82\u0a9a\u0abe\u0ab0, \u0aae\u0ac1\u0ab2\u0abe\u0a95\u0abe\u0aa4, \u0a9a\u0ac1\u0a95\u0ab5\u0aa3\u0ac0, \u0a95\u0ab0\u0abe\u0ab0, \u0a85\u0aa5\u0ab5\u0abe \u0ab5\u0acd\u0aaf\u0ab5\u0ab9\u0abe\u0ab0 \u0ab8\u0a82\u0aaa\u0ac2\u0ab0\u0acd\u0aa3\u0aaa\u0aa3\u0ac7 \u0aa4\u0ac7\u0aae\u0aa8\u0abe \u0aaa\u0acb\u0aa4\u0abe\u0aa8\u0abe \u0a9c\u0acb\u0a96\u0aae\u0ac7 \u0aa5\u0abe\u0aaf \u0a9b\u0ac7. \u0a98\u0ab0 \u0aa6\u0ac7\u0a96\u0acb\u0aa8\u0ac0 \u0a86\u0aae\u0abe\u0a82 \u0a95\u0acb\u0a88 \u0ab8\u0a82\u0aa1\u0acb\u0ab5\u0aa3\u0ac0 \u0a95\u0ac7 \u0a9c\u0ab5\u0abe\u0aac\u0aa6\u0abe\u0ab0\u0ac0 \u0aa8\u0aa5\u0ac0.",
"\u0a86 \u0a8f\u0aaa \u0aa6\u0acd\u0ab5\u0abe\u0ab0\u0abe \u0aa5\u0aaf\u0ac7\u0ab2\u0abe \u0ab8\u0a82\u0aaa\u0ab0\u0acd\u0a95\u0aa5\u0ac0 \u0a89\u0aa6\u0acd\u0aad\u0ab5\u0aa4\u0abe \u0a95\u0acb\u0a88\u0aaa\u0aa3 \u0ab5\u0abf\u0ab5\u0abe\u0aa6, \u0a9b\u0ac7\u0aa4\u0ab0\u0aaa\u0abf\u0a82\u0aa1\u0ac0, \u0aa8\u0abe\u0aa3\u0abe\u0a95\u0ac0\u0aaf \u0aa8\u0ac1\u0a95\u0ab8\u0abe\u0aa8, \u0aae\u0abf\u0ab2\u0a95\u0aa4\u0aa8\u0ac7 \u0aa8\u0ac1\u0a95\u0ab8\u0abe\u0aa8, \u0aa6\u0ac1\u0ab0\u0acd\u0ab5\u0acd\u0aaf\u0ab5\u0ab9\u0abe\u0ab0, \u0ab9\u0ac7\u0ab0\u0abe\u0aa8\u0a97\u0aa4\u0abf, \u0a88\u0a9c\u0abe, \u0a85\u0aa5\u0ab5\u0abe \u0a85\u0aa8\u0acd\u0aaf \u0a95\u0acb\u0a88 \u0aa6\u0ac1\u0ab0\u0acd\u0a98\u0a9f\u0aa8\u0abe \u0aae\u0abe\u0a9f\u0ac7 \u0a98\u0ab0 \u0aa6\u0ac7\u0a96\u0acb \u0a9c\u0ab5\u0abe\u0aac\u0aa6\u0abe\u0ab0 \u0aa8\u0aa5\u0ac0.",
"\u0a95\u0acb\u0a88\u0aa8\u0ac7 \u0aae\u0ab3\u0aa4\u0abe \u0aaa\u0ab9\u0ac7\u0ab2\u0abe \u0a85\u0aa5\u0ab5\u0abe \u0a9a\u0ac1\u0a95\u0ab5\u0aa3\u0ac0 \u0a95\u0ab0\u0aa4\u0abe \u0aaa\u0ab9\u0ac7\u0ab2\u0abe, \u0a85\u0aae\u0ac7 \u0aad\u0abe\u0ab0\u0aaa\u0ac2\u0ab0\u0acd\u0ab5\u0a95 \u0aad\u0ab2\u0abe\u0aae\u0aa3 \u0a95\u0ab0\u0ac0\u0a8f \u0a9b\u0ac0\u0a8f \u0a95\u0ac7 \u0aac\u0ac0\u0a9c\u0ac0 \u0ab5\u0acd\u0aaf\u0a95\u0acd\u0aa4\u0abf\u0aa8\u0ac0 \u0a93\u0ab3\u0a96 \u0a9a\u0a95\u0abe\u0ab8\u0acb, \u0aae\u0abf\u0ab2\u0a95\u0aa4\u0aa8\u0ac1\u0a82 \u0ab0\u0ac2\u0aac\u0ab0\u0ac2 \u0aa8\u0abf\u0ab0\u0ac0\u0a95\u0acd\u0ab7\u0aa3 \u0a95\u0ab0\u0acb, \u0a85\u0aa8\u0ac7 \u0ab6\u0a95\u0acd\u0aaf \u0ab9\u0acb\u0aaf \u0aa4\u0acd\u0aaf\u0abe\u0a82 \u0ab8\u0ac1\u0ab0\u0a95\u0acd\u0ab7\u0abf\u0aa4, \u0a9c\u0abe\u0ab9\u0ac7\u0ab0 \u0ab8\u0acd\u0aa5\u0ab3\u0acb\u0a8f \u0aae\u0ab3\u0acb.",
"\u0a98\u0ab0 \u0aa6\u0ac7\u0a96\u0acb\u0aa8\u0acb \u0a89\u0aaa\u0aaf\u0acb\u0a97 \u0a95\u0ab0\u0ac0\u0aa8\u0ac7, \u0aa4\u0aae\u0ac7 \u0aaa\u0acd\u0ab2\u0ac7\u0a9f\u0aab\u0acb\u0ab0\u0acd\u0aae\u0aa8\u0acb \u0a9c\u0ab5\u0abe\u0aac\u0aa6\u0abe\u0ab0\u0ac0\u0aaa\u0ac2\u0ab0\u0acd\u0ab5\u0a95 \u0a89\u0aaa\u0aaf\u0acb\u0a97 \u0a95\u0ab0\u0ab5\u0abe, \u0aaa\u0acd\u0ab0\u0abe\u0aae\u0abe\u0aa3\u0abf\u0a95 \u0aae\u0abe\u0ab9\u0abf\u0aa4\u0ac0 \u0aaa\u0acb\u0ab8\u0acd\u0a9f \u0a95\u0ab0\u0ab5\u0abe, \u0a85\u0aa8\u0ac7 \u0a85\u0aa8\u0acd\u0aaf \u0ab5\u0aaa\u0ab0\u0abe\u0ab6\u0a95\u0ab0\u0acd\u0aa4\u0abe\u0a93 \u0ab8\u0abe\u0aa5\u0ac7 \u0ab5\u0abe\u0aa4\u0a9a\u0ac0\u0aa4 \u0a95\u0ab0\u0aa4\u0ac0 \u0ab5\u0a96\u0aa4\u0ac7 \u0ab5\u0abe\u0a9c\u0aac\u0ac0 \u0ab8\u0abe\u0ab5\u0a9a\u0ac7\u0aa4\u0ac0 \u0ab0\u0abe\u0a96\u0ab5\u0abe \u0ab8\u0a82\u0aae\u0aa4 \u0aa5\u0abe\u0a93 \u0a9b\u0acb.",
"\u0a85\u0aae\u0ac7 \u0a8f\u0ab5\u0ac0 \u0ab2\u0abf\u0ab8\u0acd\u0a9f\u0abf\u0a82\u0a97 \u0aa6\u0ac2\u0ab0 \u0a95\u0ab0\u0ac0 \u0ab6\u0a95\u0ac0\u0a8f \u0a9b\u0ac0\u0a8f \u0a85\u0aa5\u0ab5\u0abe \u0a96\u0abe\u0aa4\u0abe\u0a93 \u0aaa\u0acd\u0ab0\u0aa4\u0abf\u0aac\u0a82\u0aa7\u0abf\u0aa4 \u0a95\u0ab0\u0ac0 \u0ab6\u0a95\u0ac0\u0a8f \u0a9b\u0ac0\u0a8f \u0a9c\u0ac7 \u0a9b\u0ac7\u0aa4\u0ab0\u0aaa\u0abf\u0a82\u0aa1\u0ac0\u0ab5\u0abe\u0ab3\u0ac0, \u0a85\u0aaa\u0aae\u0abe\u0aa8\u0a9c\u0aa8\u0a95, \u0a85\u0aa5\u0ab5\u0abe \u0a86 \u0ab6\u0ab0\u0aa4\u0acb\u0aa8\u0ac1\u0a82 \u0a89\u0ab2\u0acd\u0ab2\u0a82\u0a98\u0aa8 \u0a95\u0ab0\u0aa4\u0ac0 \u0a9c\u0aa3\u0abe\u0aaf, \u0aaa\u0ab0\u0a82\u0aa4\u0ac1 \u0a85\u0aae\u0ac7 \u0a96\u0abe\u0aa4\u0ab0\u0ac0 \u0a86\u0aaa\u0aa4\u0abe \u0aa8\u0aa5\u0ac0 \u0a95\u0ac7 \u0a86\u0ab5\u0ac0 \u0aac\u0aa7\u0ac0 \u0ab8\u0abe\u0aae\u0a97\u0acd\u0ab0\u0ac0 \u0aaa\u0a95\u0aa1\u0abe\u0ab6\u0ac7 \u0a85\u0aa5\u0ab5\u0abe \u0aa6\u0ac2\u0ab0 \u0a95\u0ab0\u0ab5\u0abe\u0aae\u0abe\u0a82 \u0a86\u0ab5\u0ab6\u0ac7.",
"\u0a8f\u0aaa \u0ab5\u0aa7\u0ab5\u0abe\u0aa8\u0ac0 \u0ab8\u0abe\u0aa5\u0ac7 \u0a86 \u0ab6\u0ab0\u0aa4\u0acb \u0a85\u0aaa\u0aa1\u0ac7\u0a9f \u0aa5\u0a88 \u0ab6\u0a95\u0ac7 \u0a9b\u0ac7. \u0a98\u0ab0 \u0aa6\u0ac7\u0a96\u0acb\u0aa8\u0acb \u0ab8\u0aa4\u0aa4 \u0a89\u0aaa\u0aaf\u0acb\u0a97 \u0a8f\u0a9f\u0ab2\u0ac7 \u0aa4\u0aae\u0ac7 \u0ab6\u0ab0\u0aa4\u0acb\u0aa8\u0abe \u0ab5\u0ab0\u0acd\u0aa4\u0aae\u0abe\u0aa8 \u0ab8\u0a82\u0ab8\u0acd\u0a95\u0ab0\u0aa3\u0aa8\u0ac7 \u0ab8\u0acd\u0ab5\u0ac0\u0a95\u0abe\u0ab0\u0acb \u0a9b\u0acb."
],
ur:[
"\u06af\u06be\u0631 \u062f\u06cc\u06a9\u06be\u0648 \u0627\u06cc\u06a9 \u0644\u0633\u0679\u0646\u06af \u067e\u0644\u06cc\u0679 \u0641\u0627\u0631\u0645 \u06c1\u06d2 \u062c\u0648 \u0645\u0627\u0644\u06a9\u0627\u0646\u060c \u0641\u0631\u0648\u062e\u062a \u06a9\u0646\u0646\u062f\u06af\u0627\u0646 \u0627\u0648\u0631 \u0627\u0633\u0679\u0688\u06cc \u0627\u0633\u067e\u06cc\u0633 \u0641\u0631\u0627\u06c1\u0645 \u06a9\u0646\u0646\u062f\u06af\u0627\u0646 \u06a9\u0648 \u06a9\u0645\u0631\u06d2\u060c \u06af\u06be\u0631 \u06cc\u0627 \u0633\u06cc\u0679 \u062a\u0644\u0627\u0634 \u06a9\u0631\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u0644\u0648\u06af\u0648\u06ba \u0633\u06d2 \u0628\u0631\u0627\u06c1 \u0631\u0627\u0633\u062a \u062c\u0648\u0691\u0646\u06d2 \u0645\u06cc\u06ba \u0645\u062f\u062f \u06a9\u0631\u062a\u0627 \u06c1\u06d2\u06d4 \u06c1\u0645 \u0635\u0631\u0641 \u0627\u06cc\u06a9 \u0645\u0644\u0627\u0642\u0627\u062a \u06a9\u06cc \u062c\u06af\u06c1 \u06c1\u06cc\u06ba \u2014 \u06a9\u0648\u0626\u06cc \u062f\u0644\u0627\u0644\u060c \u0627\u06cc\u062c\u0646\u0679\u060c \u0645\u0627\u0644\u06a9 \u0645\u06a9\u0627\u0646\u060c \u06cc\u0627 \u0635\u0627\u0631\u0641\u06cc\u0646 \u06a9\u06d2 \u062f\u0631\u0645\u06cc\u0627\u0646 \u06a9\u0633\u06cc \u0645\u0639\u0627\u06c1\u062f\u06d2 \u06a9\u0627 \u0641\u0631\u06cc\u0642 \u0646\u06c1\u06cc\u06ba\u06d4",
"\u06c1\u0645 \u0635\u0627\u0631\u0641\u06cc\u0646 \u06a9\u06cc \u0634\u0646\u0627\u062e\u062a\u060c \u0644\u0633\u0679\u0646\u06af\u0632 \u06a9\u06cc \u062f\u0631\u0633\u062a\u06af\u06cc\u060c \u06cc\u0627 \u06a9\u0633\u06cc \u0628\u06be\u06cc \u062c\u0627\u0626\u06cc\u062f\u0627\u062f \u06a9\u06cc \u062d\u0627\u0644\u062a\u060c \u0642\u0627\u0646\u0648\u0646\u06cc \u062d\u06cc\u062b\u06cc\u062a\u060c \u06cc\u0627 \u0645\u0644\u06a9\u06cc\u062a \u06a9\u06cc \u062a\u0635\u062f\u06cc\u0642 \u0646\u06c1\u06cc\u06ba \u06a9\u0631\u062a\u06d2\u06d4 \u0644\u0633\u0679\u0646\u06af \u0645\u06cc\u06ba \u062c\u0648 \u0622\u067e \u062f\u06cc\u06a9\u06be\u062a\u06d2 \u06c1\u06cc\u06ba \u0648\u06c1 \u067e\u0648\u0633\u0679 \u06a9\u0631\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u0634\u062e\u0635 \u0646\u06d2 \u0641\u0631\u0627\u06c1\u0645 \u06a9\u06cc\u0627 \u06c1\u06d2\u060c \u06af\u06be\u0631 \u062f\u06cc\u06a9\u06be\u0648 \u0646\u06d2 \u0646\u06c1\u06cc\u06ba\u06d4",
"\u0645\u0627\u0644\u06a9/\u0641\u0631\u0648\u062e\u062a \u06a9\u0646\u0646\u062f\u06c1 \u0627\u0648\u0631 \u062a\u0644\u0627\u0634 \u06a9\u0631\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u06a9\u06d2 \u062f\u0631\u0645\u06cc\u0627\u0646 \u06a9\u0648\u0626\u06cc \u0628\u06be\u06cc \u0631\u0627\u0628\u0637\u06c1\u060c \u0645\u0644\u0627\u0642\u0627\u062a\u060c \u0627\u062f\u0627\u0626\u06cc\u06af\u06cc\u060c \u0645\u0639\u0627\u06c1\u062f\u06c1\u060c \u06cc\u0627 \u0644\u06cc\u0646 \u062f\u06cc\u0646 \u0645\u06a9\u0645\u0644 \u0637\u0648\u0631 \u067e\u0631 \u0627\u0646 \u06a9\u06d2 \u0627\u067e\u0646\u06d2 \u062e\u0637\u0631\u06d2 \u0627\u0648\u0631 \u0635\u0648\u0627\u0628\u062f\u06cc\u062f \u067e\u0631 \u06c1\u0648\u062a\u0627 \u06c1\u06d2\u06d4 \u06af\u06be\u0631 \u062f\u06cc\u06a9\u06be\u0648 \u06a9\u06cc \u0627\u0633 \u0645\u06cc\u06ba \u06a9\u0648\u0626\u06cc \u0634\u0645\u0648\u0644\u06cc\u062a \u06cc\u0627 \u0630\u0645\u06c1 \u062f\u0627\u0631\u06cc \u0646\u06c1\u06cc\u06ba\u06d4",
"\u06af\u06be\u0631 \u062f\u06cc\u06a9\u06be\u0648 \u0627\u0633 \u0627\u06cc\u067e \u06a9\u06d2 \u0630\u0631\u06cc\u0639\u06d2 \u06c1\u0648\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u0631\u0627\u0628\u0637\u06d2 \u0633\u06d2 \u067e\u06cc\u062f\u0627 \u06c1\u0648\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u06a9\u0633\u06cc \u0628\u06be\u06cc \u062a\u0646\u0627\u0632\u0639\u06c1\u060c \u062f\u06be\u0648\u06a9\u06c1 \u062f\u06c1\u06cc\u060c \u0645\u0627\u0644\u06cc \u0646\u0642\u0635\u0627\u0646\u060c \u062c\u0627\u0626\u06cc\u062f\u0627\u062f \u06a9\u0648 \u0646\u0642\u0635\u0627\u0646\u060c \u0628\u062f\u0633\u0644\u0648\u06a9\u06cc\u060c \u06c1\u0631\u0627\u0633\u0627\u0646\u06cc\u060c \u0686\u0648\u0679\u060c \u06cc\u0627 \u06a9\u0633\u06cc \u0627\u0648\u0631 \u062d\u0627\u062f\u062b\u06d2 \u06a9\u0627 \u0630\u0645\u06c1 \u062f\u0627\u0631 \u0646\u06c1\u06cc\u06ba\u06d4",
"\u06a9\u0633\u06cc \u0633\u06d2 \u0645\u0644\u0646\u06d2 \u06cc\u0627 \u06a9\u0648\u0626\u06cc \u0627\u062f\u0627\u0626\u06cc\u06af\u06cc \u06a9\u0631\u0646\u06d2 \u0633\u06d2 \u067e\u06c1\u0644\u06d2\u060c \u06c1\u0645 \u0633\u062e\u062a\u06cc \u0633\u06d2 \u062a\u062c\u0648\u06cc\u0632 \u06a9\u0631\u062a\u06d2 \u06c1\u06cc\u06ba \u06a9\u06c1 \u062f\u0648\u0633\u0631\u06d2 \u0634\u062e\u0635 \u06a9\u06cc \u0634\u0646\u0627\u062e\u062a \u06a9\u06cc \u062a\u0635\u062f\u06cc\u0642 \u06a9\u0631\u06cc\u06ba\u060c \u062c\u0627\u0626\u06cc\u062f\u0627\u062f \u06a9\u0627 \u062e\u0648\u062f \u0645\u0639\u0627\u0626\u0646\u06c1 \u06a9\u0631\u06cc\u06ba\u060c \u0627\u0648\u0631 \u062c\u06c1\u0627\u06ba \u0645\u0645\u06a9\u0646 \u06c1\u0648 \u0645\u062d\u0641\u0648\u0638\u060c \u0639\u0648\u0627\u0645\u06cc \u0645\u0642\u0627\u0645\u0627\u062a \u067e\u0631 \u0645\u0644\u06cc\u06ba\u06d4",
"\u06af\u06be\u0631 \u062f\u06cc\u06a9\u06be\u0648 \u0627\u0633\u062a\u0639\u0645\u0627\u0644 \u06a9\u0631 \u06a9\u06d2\u060c \u0622\u067e \u067e\u0644\u06cc\u0679 \u0641\u0627\u0631\u0645 \u06a9\u0648 \u0630\u0645\u06c1 \u062f\u0627\u0631\u06cc \u0633\u06d2 \u0627\u0633\u062a\u0639\u0645\u0627\u0644 \u06a9\u0631\u0646\u06d2\u060c \u0627\u06cc\u0645\u0627\u0646\u062f\u0627\u0631\u0627\u0646\u06c1 \u0645\u0639\u0644\u0648\u0645\u0627\u062a \u067e\u0648\u0633\u0679 \u06a9\u0631\u0646\u06d2\u060c \u0627\u0648\u0631 \u062f\u06cc\u06af\u0631 \u0635\u0627\u0631\u0641\u06cc\u0646 \u06a9\u06d2 \u0633\u0627\u062a\u06be \u0628\u0627\u062a \u0686\u06cc\u062a \u06a9\u0631\u062a\u06d2 \u0648\u0642\u062a \u0645\u0646\u0627\u0633\u0628 \u0627\u062d\u062a\u06cc\u0627\u0637 \u0628\u0631\u062a\u0646\u06d2 \u067e\u0631 \u0645\u062a\u0641\u0642 \u06c1\u0648\u062a\u06d2 \u06c1\u06cc\u06ba\u06d4",
"\u06c1\u0645 \u0627\u06cc\u0633\u06cc \u0644\u0633\u0679\u0646\u06af\u0632 \u06c1\u0679\u0627 \u0633\u06a9\u062a\u06d2 \u06c1\u06cc\u06ba \u06cc\u0627 \u0627\u06a9\u0627\u0624\u0646\u0679\u0633 \u06a9\u0648 \u0645\u062d\u062f\u0648\u062f \u06a9\u0631 \u0633\u06a9\u062a\u06d2 \u06c1\u06cc\u06ba \u062c\u0648 \u062f\u06be\u0648\u06a9\u06c1 \u062f\u06c1\u06cc \u067e\u0631 \u0645\u0628\u0646\u06cc\u060c \u062c\u0627\u0631\u062d\u0627\u0646\u06c1\u060c \u06cc\u0627 \u0627\u0646 \u0634\u0631\u0627\u0626\u0637 \u06a9\u06cc \u062e\u0644\u0627\u0641 \u0648\u0631\u0632\u06cc \u06a9\u0631\u062a\u06cc \u0646\u0638\u0631 \u0622\u0626\u06cc\u06ba\u060c \u0644\u06cc\u06a9\u0646 \u06c1\u0645 \u0636\u0645\u0627\u0646\u062a \u0646\u06c1\u06cc\u06ba \u062f\u06cc\u062a\u06d2 \u06a9\u06c1 \u0627\u06cc\u0633\u0627 \u062a\u0645\u0627\u0645 \u0645\u0648\u0627\u062f \u067e\u06a9\u0691\u0627 \u06cc\u0627 \u06c1\u0679\u0627\u06cc\u0627 \u062c\u0627\u0626\u06d2 \u06af\u0627\u06d4",
"\u0627\u06cc\u067e \u06a9\u06d2 \u0628\u0691\u06be\u0646\u06d2 \u06a9\u06d2 \u0633\u0627\u062a\u06be \u06cc\u06c1 \u0634\u0631\u0627\u0626\u0637 \u0627\u067e \u0688\u06cc\u0679 \u06c1\u0648 \u0633\u06a9\u062a\u06cc \u06c1\u06cc\u06ba\u06d4 \u06af\u06be\u0631 \u062f\u06cc\u06a9\u06be\u0648 \u06a9\u0627 \u0645\u0633\u0644\u0633\u0644 \u0627\u0633\u062a\u0639\u0645\u0627\u0644 \u06a9\u0627 \u0645\u0637\u0644\u0628 \u06c1\u06d2 \u06a9\u06c1 \u0622\u067e \u0634\u0631\u0627\u0626\u0637 \u06a9\u06d2 \u0645\u0648\u062c\u0648\u062f\u06c1 \u0648\u0631\u0698\u0646 \u0633\u06d2 \u0627\u062a\u0641\u0627\u0642 \u06a9\u0631\u062a\u06d2 \u06c1\u06cc\u06ba\u06d4"
],
kn:[
"\u0c98\u0cb0\u0ccd \u0ca6\u0cc7\u0c96\u0ccb \u0c8e\u0c82\u0cac\u0cc1\u0ca6\u0cc1 \u0cae\u0cbe\u0cb2\u0cc0\u0c95\u0cb0\u0cc1, \u0cae\u0cbe\u0cb0\u0cbe\u0c9f\u0c97\u0cbe\u0cb0\u0cb0\u0cc1 \u0cae\u0ca4\u0ccd\u0ca4\u0cc1 \u0c85\u0ca7\u0ccd\u0caf\u0caf\u0ca8-\u0cb8\u0ccd\u0ca5\u0cb3 \u0caa\u0cc2\u0cb0\u0cc8\u0c95\u0cc6\u0ca6\u0cbe\u0cb0\u0cb0\u0ca8\u0ccd\u0ca8\u0cc1 \u0c95\u0cca\u0ca0\u0ca1\u0cbf, \u0cae\u0ca8\u0cc6 \u0c85\u0ca5\u0cb5\u0cbe \u0cb8\u0cc0\u0c9f\u0ccd \u0cb9\u0cc1\u0ca1\u0cc1\u0c95\u0cc1\u0ca4\u0ccd\u0ca4\u0cbf\u0cb0\u0cc1\u0cb5 \u0c9c\u0ca8\u0cb0\u0cca\u0c82\u0ca6\u0cbf\u0c97\u0cc6 \u0ca8\u0cc7\u0cb0\u0cb5\u0cbe\u0c97\u0cbf \u0cb8\u0c82\u0caa\u0cb0\u0ccd\u0c95\u0cbf\u0cb8\u0cb2\u0cc1 \u0cb8\u0cb9\u0cbe\u0caf \u0cae\u0cbe\u0ca1\u0cc1\u0cb5 \u0caa\u0c9f\u0ccd\u0c9f\u0cbf \u0cb5\u0cc7\u0ca6\u0cbf\u0c95\u0cc6\u0caf\u0cbe\u0c97\u0cbf\u0ca6\u0cc6. \u0ca8\u0cbe\u0cb5\u0cc1 \u0c95\u0cc7\u0cb5\u0cb2 \u0cad\u0cc7\u0c9f\u0cbf \u0cb8\u0ccd\u0ca5\u0cb3 \u2014 \u0ca6\u0cb2\u0ccd\u0cb2\u0cbe\u0cb3\u0cbf, \u0c8f\u0c9c\u0cc6\u0c82\u0c9f\u0ccd, \u0cae\u0ca8\u0cc6 \u0cae\u0cbe\u0cb2\u0cc0\u0c95\u0cb0\u0cc1 \u0c85\u0ca5\u0cb5\u0cbe \u0cac\u0cb3\u0c95\u0cc6\u0ca6\u0cbe\u0cb0\u0cb0 \u0ca8\u0ca1\u0cc1\u0cb5\u0cbf\u0ca8 \u0caf\u0cbe\u0cb5\u0cc1\u0ca6\u0cc7 \u0c92\u0caa\u0ccd\u0caa\u0c82\u0ca6\u0ca6 \u0caa\u0c95\u0ccd\u0cb7 \u0c85\u0cb2\u0ccd\u0cb2.",
"\u0ca8\u0cbe\u0cb5\u0cc1 \u0cac\u0cb3\u0c95\u0cc6\u0ca6\u0cbe\u0cb0\u0cb0 \u0c97\u0cc1\u0cb0\u0cc1\u0ca4\u0cc1, \u0caa\u0c9f\u0ccd\u0c9f\u0cbf\u0c97\u0cb3 \u0ca8\u0cbf\u0c96\u0cb0\u0ca4\u0cc6, \u0c85\u0ca5\u0cb5\u0cbe \u0caf\u0cbe\u0cb5\u0cc1\u0ca6\u0cc7 \u0c86\u0cb8\u0ccd\u0ca4\u0cbf\u0caf \u0cb8\u0ccd\u0ca5\u0cbf\u0ca4\u0cbf, \u0c95\u0cbe\u0ca8\u0cc2\u0ca8\u0cc1\u0cac\u0ca6\u0ccd\u0ca7\u0ca4\u0cc6 \u0c85\u0ca5\u0cb5\u0cbe \u0cae\u0cbe\u0cb2\u0cc0\u0c95\u0ca4\u0ccd\u0cb5\u0cb5\u0ca8\u0ccd\u0ca8\u0cc1 \u0caa\u0cb0\u0cbf\u0cb6\u0cc0\u0cb2\u0cbf\u0cb8\u0cc1\u0cb5\u0cc1\u0ca6\u0cbf\u0cb2\u0ccd\u0cb2. \u0caa\u0c9f\u0ccd\u0c9f\u0cbf\u0caf\u0cb2\u0ccd\u0cb2\u0cbf \u0ca8\u0cc0\u0cb5\u0cc1 \u0ca8\u0ccb\u0ca1\u0cc1\u0cb5\u0cc1\u0ca6\u0cc1 \u0c85\u0ca6\u0ca8\u0ccd\u0ca8\u0cc1 \u0caa\u0ccb\u0cb8\u0ccd\u0c9f\u0ccd \u0cae\u0cbe\u0ca1\u0cbf\u0ca6 \u0cb5\u0ccd\u0caf\u0c95\u0ccd\u0ca4\u0cbf\u0caf\u0cbf\u0c82\u0ca6 \u0c92\u0ca6\u0c97\u0cbf\u0cb8\u0cb2\u0ccd\u0caa\u0c9f\u0ccd\u0c9f\u0cbf\u0ca6\u0cc6, \u0c98\u0cb0\u0ccd \u0ca6\u0cc7\u0c96\u0ccb\u0ca6\u0cbf\u0c82\u0ca6\u0cb2\u0ccd\u0cb2.",
"\u0cae\u0cbe\u0cb2\u0cc0\u0c95/\u0cae\u0cbe\u0cb0\u0cbe\u0c9f\u0c97\u0cbe\u0cb0 \u0cae\u0ca4\u0ccd\u0ca4\u0cc1 \u0cb9\u0cc1\u0ca1\u0cc1\u0c95\u0cc1\u0cb5\u0cb5\u0cb0 \u0ca8\u0ca1\u0cc1\u0cb5\u0cbf\u0ca8 \u0caf\u0cbe\u0cb5\u0cc1\u0ca6\u0cc7 \u0cb8\u0c82\u0cb5\u0cb9\u0ca8, \u0cad\u0cc7\u0c9f\u0cbf, \u0caa\u0cbe\u0cb5\u0ca4\u0cbf, \u0c92\u0caa\u0ccd\u0caa\u0c82\u0ca6 \u0c85\u0ca5\u0cb5\u0cbe \u0cb5\u0cb9\u0cbf\u0cb5\u0cbe\u0c9f\u0cc1 \u0cb8\u0c82\u0caa\u0cc2\u0cb0\u0ccd\u0ca3\u0cb5\u0cbe\u0c97\u0cbf \u0c85\u0cb5\u0cb0 \u0cb8\u0ccd\u0cb5\u0c82\u0ca4 \u0c85\u0caa\u0cbe\u0caf\u0ca6\u0cb2\u0ccd\u0cb2\u0cbf \u0ca8\u0ca1\u0cc6\u0caf\u0cc1\u0ca4\u0ccd\u0ca4\u0ca6\u0cc6. \u0c98\u0cb0\u0ccd \u0ca6\u0cc7\u0c96\u0ccb\u0c97\u0cc6 \u0c87\u0ca6\u0cb0\u0cb2\u0ccd\u0cb2\u0cbf \u0caf\u0cbe\u0cb5\u0cc1\u0ca6\u0cc7 \u0caa\u0cbe\u0cb2\u0ccd\u0c97\u0cca\u0cb3\u0ccd\u0cb3\u0cc1\u0cb5\u0cbf\u0c95\u0cc6 \u0c85\u0ca5\u0cb5\u0cbe \u0c9c\u0cb5\u0cbe\u0cac\u0ccd\u0ca6\u0cbe\u0cb0\u0cbf \u0c87\u0cb2\u0ccd\u0cb2.",
"\u0c88 \u0c86\u0ccd\u0caf\u0caa\u0ccd \u0cae\u0cc2\u0cb2\u0c95 \u0cb8\u0c82\u0caa\u0cb0\u0ccd\u0c95\u0ca6\u0cbf\u0c82\u0ca6 \u0c89\u0c82\u0c9f\u0cbe\u0c97\u0cc1\u0cb5 \u0caf\u0cbe\u0cb5\u0cc1\u0ca6\u0cc7 \u0cb5\u0cbf\u0cb5\u0cbe\u0ca6, \u0cb5\u0c82\u0c9a\u0ca8\u0cc6, \u0c86\u0cb0\u0ccd\u0ca5\u0cbf\u0c95 \u0ca8\u0cb7\u0ccd\u0c9f, \u0c86\u0cb8\u0ccd\u0ca4\u0cbf \u0cb9\u0cbe\u0ca8\u0cbf, \u0ca6\u0cc1\u0cb0\u0ccd\u0cb5\u0cb0\u0ccd\u0ca4\u0ca8\u0cc6, \u0c95\u0cbf\u0cb0\u0cc1\u0c95\u0cc1\u0cb3, \u0c97\u0cbe\u0caf, \u0c85\u0ca5\u0cb5\u0cbe \u0c87\u0ca4\u0cb0 \u0c85\u0cb9\u0cbf\u0ca4\u0c95\u0cb0 \u0c98\u0c9f\u0ca8\u0cc6\u0c97\u0cc6 \u0c98\u0cb0\u0ccd \u0ca6\u0cc7\u0c96\u0ccb \u0c9c\u0cb5\u0cbe\u0cac\u0ccd\u0ca6\u0cbe\u0cb0\u0ca8\u0cb2\u0ccd\u0cb2.",
"\u0caf\u0cbe\u0cb0\u0ca8\u0ccd\u0ca8\u0cbe\u0ca6\u0cb0\u0cc2 \u0cad\u0cc7\u0c9f\u0cbf\u0caf\u0cbe\u0c97\u0cc1\u0cb5 \u0c85\u0ca5\u0cb5\u0cbe \u0caf\u0cbe\u0cb5\u0cc1\u0ca6\u0cc7 \u0caa\u0cbe\u0cb5\u0ca4\u0cbf \u0cae\u0cbe\u0ca1\u0cc1\u0cb5 \u0cae\u0cca\u0ca6\u0cb2\u0cc1, \u0c87\u0ca8\u0ccd\u0ca8\u0cca\u0cac\u0ccd\u0cac \u0cb5\u0ccd\u0caf\u0c95\u0ccd\u0ca4\u0cbf\u0caf \u0c97\u0cc1\u0cb0\u0cc1\u0ca4\u0ca8\u0ccd\u0ca8\u0cc1 \u0caa\u0cb0\u0cbf\u0cb6\u0cc0\u0cb2\u0cbf\u0cb8\u0cb2\u0cc1, \u0c86\u0cb8\u0ccd\u0ca4\u0cbf\u0caf\u0ca8\u0ccd\u0ca8\u0cc1 \u0cb5\u0cc8\u0caf\u0c95\u0ccd\u0ca4\u0cbf\u0c95\u0cb5\u0cbe\u0c97\u0cbf \u0caa\u0cb0\u0cbf\u0cb6\u0cc0\u0cb2\u0cbf\u0cb8\u0cb2\u0cc1, \u0cae\u0ca4\u0ccd\u0ca4\u0cc1 \u0cb8\u0cbe\u0ca7\u0ccd\u0caf\u0cb5\u0cbe\u0ca6\u0cb2\u0ccd\u0cb2\u0cbf \u0cb8\u0cc1\u0cb0\u0c95\u0ccd\u0cb7\u0cbf\u0ca4, \u0cb8\u0cbe\u0cb0\u0ccd\u0cb5\u0c9c\u0ca8\u0cbf\u0c95 \u0cb8\u0ccd\u0ca5\u0cb3\u0c97\u0cb3\u0cb2\u0ccd\u0cb2\u0cbf \u0cad\u0cc7\u0c9f\u0cbf\u0caf\u0cbe\u0c97\u0cb2\u0cc1 \u0ca8\u0cbe\u0cb5\u0cc1 \u0cac\u0cb2\u0cb5\u0cbe\u0c97\u0cbf \u0cb6\u0cbf\u0cab\u0cbe\u0cb0\u0cb8\u0cc1 \u0cae\u0cbe\u0ca1\u0cc1\u0ca4\u0ccd\u0ca4\u0cc7\u0cb5\u0cc6.",
"\u0c98\u0cb0\u0ccd \u0ca6\u0cc7\u0c96\u0ccb \u0cac\u0cb3\u0cb8\u0cc1\u0cb5 \u0cae\u0cc2\u0cb2\u0c95, \u0ca8\u0cc0\u0cb5\u0cc1 \u0cb5\u0cc7\u0ca6\u0cbf\u0c95\u0cc6\u0caf\u0ca8\u0ccd\u0ca8\u0cc1 \u0c9c\u0cb5\u0cbe\u0cac\u0ccd\u0ca6\u0cbe\u0cb0\u0cbf\u0caf\u0cc1\u0ca4\u0cb5\u0cbe\u0c97\u0cbf \u0cac\u0cb3\u0cb8\u0cb2\u0cc1, \u0caa\u0ccd\u0cb0\u0cbe\u0cae\u0cbe\u0ca3\u0cbf\u0c95 \u0cae\u0cbe\u0cb9\u0cbf\u0ca4\u0cbf\u0caf\u0ca8\u0ccd\u0ca8\u0cc1 \u0caa\u0ccb\u0cb8\u0ccd\u0c9f\u0ccd \u0cae\u0cbe\u0ca1\u0cb2\u0cc1, \u0cae\u0ca4\u0ccd\u0ca4\u0cc1 \u0c87\u0ca4\u0cb0 \u0cac\u0cb3\u0c95\u0cc6\u0ca6\u0cbe\u0cb0\u0cb0\u0cca\u0c82\u0ca6\u0cbf\u0c97\u0cc6 \u0cb8\u0c82\u0cb5\u0cb9\u0ca8 \u0ca8\u0ca1\u0cc6\u0cb8\u0cc1\u0cb5\u0cbe\u0c97 \u0cb8\u0cae\u0c82\u0c9c\u0cb8 \u0cae\u0cc1\u0ca8\u0ccd\u0ca8\u0cc6\u0c9a\u0ccd\u0c9a\u0cb0\u0cbf\u0c95\u0cc6 \u0ca4\u0cc6\u0c97\u0cc6\u0ca6\u0cc1\u0c95\u0cca\u0cb3\u0ccd\u0cb3\u0cb2\u0cc1 \u0c92\u0caa\u0ccd\u0caa\u0cc1\u0ca4\u0ccd\u0ca4\u0cc0\u0cb0\u0cbf.",
"\u0cb5\u0c82\u0c9a\u0ca8\u0cc6, \u0ca6\u0cc1\u0cb0\u0ccd\u0cac\u0cb3\u0c95\u0cc6, \u0c85\u0ca5\u0cb5\u0cbe \u0c88 \u0ca8\u0cbf\u0caf\u0cae\u0c97\u0cb3\u0ca8\u0ccd\u0ca8\u0cc1 \u0c89\u0cb2\u0ccd\u0cb2\u0c82\u0c98\u0cbf\u0cb8\u0cc1\u0cb5\u0c82\u0ca4\u0cc6 \u0c95\u0c82\u0ca1\u0cc1\u0cac\u0cb0\u0cc1\u0cb5 \u0caa\u0c9f\u0ccd\u0c9f\u0cbf\u0c97\u0cb3\u0ca8\u0ccd\u0ca8\u0cc1 \u0ca8\u0cbe\u0cb5\u0cc1 \u0ca4\u0cc6\u0c97\u0cc6\u0ca6\u0cc1\u0cb9\u0cbe\u0c95\u0cac\u0cb9\u0cc1\u0ca6\u0cc1 \u0c85\u0ca5\u0cb5\u0cbe \u0c96\u0cbe\u0ca4\u0cc6\u0c97\u0cb3\u0ca8\u0ccd\u0ca8\u0cc1 \u0ca8\u0cbf\u0cb0\u0ccd\u0cac\u0c82\u0ca7\u0cbf\u0cb8\u0cac\u0cb9\u0cc1\u0ca6\u0cc1, \u0c86\u0ca6\u0cb0\u0cc6 \u0c85\u0c82\u0ca4\u0cb9 \u0c8e\u0cb2\u0ccd\u0cb2\u0cbe \u0cb5\u0cbf\u0cb7\u0caf\u0cb5\u0ca8\u0ccd\u0ca8\u0cc1 \u0caa\u0ca4\u0ccd\u0ca4\u0cc6 \u0cb9\u0c9a\u0ccd\u0c9a\u0cb2\u0cbe\u0c97\u0cc1\u0ca4\u0ccd\u0ca4\u0ca6\u0cc6 \u0c85\u0ca5\u0cb5\u0cbe \u0ca4\u0cc6\u0c97\u0cc6\u0ca6\u0cc1\u0cb9\u0cbe\u0c95\u0cb2\u0cbe\u0c97\u0cc1\u0ca4\u0ccd\u0ca4\u0ca6\u0cc6 \u0c8e\u0c82\u0ca6\u0cc1 \u0ca8\u0cbe\u0cb5\u0cc1 \u0c96\u0cbe\u0ca4\u0cb0\u0cbf\u0caa\u0ca1\u0cbf\u0cb8\u0cc1\u0cb5\u0cc1\u0ca6\u0cbf\u0cb2\u0ccd\u0cb2.",
"\u0c86\u0ccd\u0caf\u0caa\u0ccd \u0cac\u0cc6\u0cb3\u0cc6\u0caf\u0cc1\u0ca4\u0ccd\u0ca4\u0cbf\u0ca6\u0ccd\u0ca6\u0c82\u0ca4\u0cc6 \u0c88 \u0ca8\u0cbf\u0caf\u0cae\u0c97\u0cb3\u0ca8\u0ccd\u0ca8\u0cc1 \u0ca8\u0cb5\u0cc0\u0c95\u0cb0\u0cbf\u0cb8\u0cac\u0cb9\u0cc1\u0ca6\u0cc1. \u0c98\u0cb0\u0ccd \u0ca6\u0cc7\u0c96\u0ccb\u0cb5\u0ca8\u0ccd\u0ca8\u0cc1 \u0cae\u0cc1\u0c82\u0ca6\u0cc1\u0cb5\u0cb0\u0cbf\u0cb8\u0cbf \u0cac\u0cb3\u0cb8\u0cc1\u0cb5\u0cc1\u0ca6\u0cc1 \u0c8e\u0c82\u0ca6\u0cb0\u0cc6 \u0ca8\u0cc0\u0cb5\u0cc1 \u0ca8\u0cbf\u0caf\u0cae\u0c97\u0cb3 \u0caa\u0ccd\u0cb0\u0cb8\u0ccd\u0ca4\u0cc1\u0ca4 \u0c86\u0cb5\u0cc3\u0ca4\u0ccd\u0ca4\u0cbf\u0caf\u0ca8\u0ccd\u0ca8\u0cc1 \u0c92\u0caa\u0ccd\u0caa\u0cbf\u0c95\u0cca\u0cb3\u0ccd\u0cb3\u0cc1\u0ca4\u0ccd\u0ca4\u0cc0\u0cb0\u0cbf \u0c8e\u0c82\u0ca6\u0cb0\u0ccd\u0ca5."
],
ml:[
"\u0d2e\u0d41\u0d31\u0d3f, \u0d35\u0d40\u0d1f\u0d4d \u0d05\u0d32\u0d4d\u0d32\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d7d \u0d38\u0d40\u0d31\u0d4d\u0d31\u0d4d \u0d24\u0d3f\u0d30\u0d2f\u0d41\u0d28\u0d4d\u0d28 \u0d06\u0d33\u0d41\u0d15\u0d33\u0d41\u0d2e\u0d3e\u0d2f\u0d3f \u0d09\u0d1f\u0d2e\u0d15\u0d7e, \u0d35\u0d3f\u0d7d\u0d2a\u0d4d\u0d2a\u0d28\u0d15\u0d4d\u0d15\u0d3e\u0d7c, \u0d2a\u0d20\u0d28-\u0d07\u0d1f \u0d26\u0d3e\u0d24\u0d3e\u0d15\u0d4d\u0d15\u0d7e \u0d0e\u0d28\u0d4d\u0d28\u0d3f\u0d35\u0d30\u0d46 \u0d28\u0d47\u0d30\u0d3f\u0d1f\u0d4d\u0d1f\u0d4d \u0d2c\u0d28\u0d4d\u0d27\u0d3f\u0d2a\u0d4d\u0d2a\u0d3f\u0d15\u0d4d\u0d15\u0d3e\u0d7b \u0d38\u0d39\u0d3e\u0d2f\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28 \u0d12\u0d30\u0d41 \u0d32\u0d3f\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d3f\u0d02\u0d17\u0d4d \u0d2a\u0d4d\u0d32\u0d3e\u0d31\u0d4d\u0d31\u0d4d\u200c\u0d2b\u0d4b\u0d2e\u0d3e\u0d23\u0d4d \u0d18\u0d7c \u0d26\u0d47\u0d16\u0d4b. \u0d1e\u0d19\u0d4d\u0d19\u0d7e \u0d12\u0d30\u0d41 \u0d15\u0d42\u0d1f\u0d3f\u0d15\u0d4d\u0d15\u0d3e\u0d34\u0d4d\u0d1a \u0d38\u0d4d\u0d25\u0d32\u0d02 \u0d2e\u0d3e\u0d24\u0d4d\u0d30\u0d2e\u0d3e\u0d23\u0d4d \u2014 \u0d2c\u0d4d\u0d30\u0d4b\u0d15\u0d4d\u0d15\u0d31\u0d4b \u0d0f\u0d1c\u0d28\u0d4d\u0d31\u0d4b \u0d09\u0d1f\u0d2e\u0d38\u0d4d\u0d25\u0d28\u0d4b \u0d09\u0d2a\u0d2f\u0d4b\u0d15\u0d4d\u0d24\u0d3e\u0d15\u0d4d\u0d15\u0d7e \u0d24\u0d2e\u0d4d\u0d2e\u0d3f\u0d32\u0d41\u0d33\u0d4d\u0d33 \u0d0f\u0d24\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d32\u0d41\u0d02 \u0d15\u0d30\u0d3e\u0d31\u0d3f\u0d28\u0d4d\u0d31\u0d46 \u0d15\u0d15\u0d4d\u0d37\u0d3f\u0d2f\u0d4b \u0d05\u0d32\u0d4d\u0d32.",
"\u0d09\u0d2a\u0d2f\u0d4b\u0d15\u0d4d\u0d24\u0d3e\u0d15\u0d4d\u0d15\u0d33\u0d41\u0d1f\u0d46 \u0d10\u0d21\u0d28\u0d4d\u0d31\u0d3f\u0d31\u0d4d\u0d31\u0d3f, \u0d32\u0d3f\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d3f\u0d02\u0d17\u0d41\u0d15\u0d33\u0d41\u0d1f\u0d46 \u0d15\u0d43\u0d24\u0d4d\u0d2f\u0d24, \u0d05\u0d32\u0d4d\u0d32\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d7d \u0d0f\u0d24\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d32\u0d41\u0d02 \u0d35\u0d38\u0d4d\u0d24\u0d41\u0d35\u0d3f\u0d28\u0d4d\u0d31\u0d46 \u0d05\u0d35\u0d38\u0d4d\u0d25, \u0d28\u0d3f\u0d2f\u0d2e\u0d38\u0d3e\u0d27\u0d41\u0d24, \u0d09\u0d1f\u0d2e\u0d38\u0d4d\u0d25\u0d3e\u0d35\u0d15\u0d3e\u0d36\u0d02 \u0d0e\u0d28\u0d4d\u0d28\u0d3f\u0d35 \u0d1e\u0d19\u0d4d\u0d19\u0d7e \u0d2a\u0d30\u0d3f\u0d36\u0d4b\u0d27\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d3f\u0d32\u0d4d\u0d32. \u0d32\u0d3f\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d3f\u0d02\u0d17\u0d3f\u0d7d \u0d28\u0d3f\u0d19\u0d4d\u0d19\u0d7e \u0d15\u0d3e\u0d23\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d4d \u0d05\u0d24\u0d4d \u0d2a\u0d4b\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d4d \u0d1a\u0d46\u0d2f\u0d4d\u0d24 \u0d35\u0d4d\u0d2f\u0d15\u0d4d\u0d24\u0d3f \u0d28\u0d7d\u0d15\u0d3f\u0d2f\u0d24\u0d3e\u0d23\u0d4d, \u0d18\u0d7c \u0d26\u0d47\u0d16\u0d4b \u0d05\u0d32\u0d4d\u0d32.",
"\u0d09\u0d1f\u0d2e/\u0d35\u0d3f\u0d7d\u0d2a\u0d4d\u0d2a\u0d28\u0d15\u0d4d\u0d15\u0d3e\u0d30\u0d28\u0d41\u0d02 \u0d05\u0d28\u0d4d\u0d35\u0d47\u0d37\u0d15\u0d28\u0d41\u0d02 \u0d24\u0d2e\u0d4d\u0d2e\u0d3f\u0d32\u0d41\u0d33\u0d4d\u0d33 \u0d0f\u0d24\u0d4a\u0d30\u0d41 \u0d06\u0d36\u0d2f\u0d35\u0d3f\u0d28\u0d3f\u0d2e\u0d2f\u0d02, \u0d15\u0d42\u0d1f\u0d3f\u0d15\u0d4d\u0d15\u0d3e\u0d34\u0d4d\u0d1a, \u0d2a\u0d47\u0d2f\u0d4d\u200c\u0d2e\u0d46\u0d28\u0d4d\u0d31\u0d4d, \u0d15\u0d30\u0d3e\u0d7c, \u0d05\u0d32\u0d4d\u0d32\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d7d \u0d07\u0d1f\u0d2a\u0d3e\u0d1f\u0d4d \u0d2a\u0d42\u0d7c\u0d23\u0d4d\u0d23\u0d2e\u0d3e\u0d2f\u0d41\u0d02 \u0d05\u0d35\u0d30\u0d41\u0d1f\u0d46 \u0d38\u0d4d\u0d35\u0d28\u0d4d\u0d24\u0d02 \u0d05\u0d2a\u0d15\u0d1f\u0d38\u0d3e\u0d27\u0d4d\u0d2f\u0d24\u0d2f\u0d3f\u0d32\u0d41\u0d02 \u0d35\u0d3f\u0d35\u0d47\u0d1a\u0d28\u0d3e\u0d27\u0d3f\u0d15\u0d3e\u0d30\u0d24\u0d4d\u0d24\u0d3f\u0d32\u0d41\u0d2e\u0d3e\u0d23\u0d4d \u0d28\u0d1f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d4d. \u0d18\u0d7c \u0d26\u0d47\u0d16\u0d4b\u0d2f\u0d4d\u0d15\u0d4d\u0d15\u0d4d \u0d07\u0d24\u0d3f\u0d7d \u0d2a\u0d19\u0d4d\u0d15\u0d4b \u0d09\u0d24\u0d4d\u0d24\u0d30\u0d35\u0d3e\u0d26\u0d3f\u0d24\u0d4d\u0d24\u0d2e\u0d4b \u0d07\u0d32\u0d4d\u0d32.",
"\u0d08 \u0d06\u0d2a\u0d4d\u0d2a\u0d4d \u0d35\u0d34\u0d3f\u0d2f\u0d41\u0d33\u0d4d\u0d33 \u0d2c\u0d28\u0d4d\u0d27\u0d24\u0d4d\u0d24\u0d3f\u0d7d \u0d28\u0d3f\u0d28\u0d4d\u0d28\u0d4d \u0d09\u0d23\u0d4d\u0d1f\u0d3e\u0d15\u0d41\u0d28\u0d4d\u0d28 \u0d0f\u0d24\u0d4a\u0d30\u0d41 \u0d24\u0d7c\u0d15\u0d4d\u0d15\u0d02, \u0d24\u0d1f\u0d4d\u0d1f\u0d3f\u0d2a\u0d4d\u0d2a\u0d4d, \u0d38\u0d3e\u0d2e\u0d4d\u0d2a\u0d24\u0d4d\u0d24\u0d3f\u0d15 \u0d28\u0d37\u0d4d\u0d1f\u0d02, \u0d38\u0d4d\u0d35\u0d24\u0d4d\u0d24\u0d4d \u0d28\u0d3e\u0d36\u0d02, \u0d26\u0d41\u0d7c\u0d35\u0d3f\u0d28\u0d3f\u0d2f\u0d4b\u0d17\u0d02, \u0d2a\u0d40\u0d21\u0d28\u0d02, \u0d2a\u0d30\u0d3f\u0d15\u0d4d\u0d15\u0d4d, \u0d05\u0d32\u0d4d\u0d32\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d7d \u0d2e\u0d31\u0d4d\u0d31\u0d47\u0d24\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d32\u0d41\u0d02 \u0d05\u0d2a\u0d15\u0d1f\u0d24\u0d4d\u0d24\u0d3f\u0d28\u0d4d \u0d18\u0d7c \u0d26\u0d47\u0d16\u0d4b \u0d09\u0d24\u0d4d\u0d24\u0d30\u0d35\u0d3e\u0d26\u0d3f\u0d2f\u0d32\u0d4d\u0d32.",
"\u0d06\u0d30\u0d46\u0d2f\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d32\u0d41\u0d02 \u0d15\u0d3e\u0d23\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d3f\u0d28\u0d4b \u0d2a\u0d47\u0d2f\u0d4d\u200c\u0d2e\u0d46\u0d28\u0d4d\u0d31\u0d4d \u0d28\u0d1f\u0d24\u0d4d\u0d24\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d3f\u0d28\u0d4b \u0d2e\u0d41\u0d2e\u0d4d\u0d2a\u0d4d, \u0d2e\u0d31\u0d4d\u0d31\u0d47 \u0d35\u0d4d\u0d2f\u0d15\u0d4d\u0d24\u0d3f\u0d2f\u0d41\u0d1f\u0d46 \u0d10\u0d21\u0d28\u0d4d\u0d31\u0d3f\u0d31\u0d4d\u0d31\u0d3f \u0d2a\u0d30\u0d3f\u0d36\u0d4b\u0d27\u0d3f\u0d15\u0d4d\u0d15\u0d3e\u0d28\u0d41\u0d02, \u0d35\u0d38\u0d4d\u0d24\u0d41 \u0d28\u0d47\u0d30\u0d3f\u0d1f\u0d4d\u0d1f\u0d4d \u0d2a\u0d30\u0d3f\u0d36\u0d4b\u0d27\u0d3f\u0d15\u0d4d\u0d15\u0d3e\u0d28\u0d41\u0d02, \u0d15\u0d34\u0d3f\u0d2f\u0d41\u0d28\u0d4d\u0d28\u0d3f\u0d1f\u0d24\u0d4d\u0d24\u0d4b\u0d33\u0d02 \u0d38\u0d41\u0d30\u0d15\u0d4d\u0d37\u0d3f\u0d24\u0d35\u0d41\u0d02 \u0d2a\u0d4a\u0d24\u0d41\u0d35\u0d41\u0d2e\u0d3e\u0d2f \u0d38\u0d4d\u0d25\u0d32\u0d19\u0d4d\u0d19\u0d33\u0d3f\u0d7d \u0d15\u0d3e\u0d23\u0d3e\u0d28\u0d41\u0d02 \u0d1e\u0d19\u0d4d\u0d19\u0d7e \u0d36\u0d15\u0d4d\u0d24\u0d2e\u0d3e\u0d2f\u0d3f \u0d36\u0d41\u0d2a\u0d3e\u0d7c\u0d36 \u0d1a\u0d46\u0d2f\u0d4d\u0d2f\u0d41\u0d28\u0d4d\u0d28\u0d41.",
"\u0d18\u0d7c \u0d26\u0d47\u0d16\u0d4b \u0d09\u0d2a\u0d2f\u0d4b\u0d17\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d3f\u0d32\u0d42\u0d1f\u0d46, \u0d2a\u0d4d\u0d32\u0d3e\u0d31\u0d4d\u0d31\u0d4d\u200c\u0d2b\u0d4b\u0d02 \u0d09\u0d24\u0d4d\u0d24\u0d30\u0d35\u0d3e\u0d26\u0d3f\u0d24\u0d4d\u0d24\u0d24\u0d4d\u0d24\u0d4b\u0d1f\u0d46 \u0d09\u0d2a\u0d2f\u0d4b\u0d17\u0d3f\u0d15\u0d4d\u0d15\u0d3e\u0d28\u0d41\u0d02, \u0d38\u0d24\u0d4d\u0d2f\u0d38\u0d28\u0d4d\u0d27\u0d2e\u0d3e\u0d2f \u0d35\u0d3f\u0d35\u0d30\u0d19\u0d4d\u0d19\u0d7e \u0d2a\u0d4b\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d4d \u0d1a\u0d46\u0d2f\u0d4d\u0d2f\u0d3e\u0d28\u0d41\u0d02, \u0d2e\u0d31\u0d4d\u0d31\u0d4d \u0d09\u0d2a\u0d2f\u0d4b\u0d15\u0d4d\u0d24\u0d3e\u0d15\u0d4d\u0d15\u0d33\u0d41\u0d2e\u0d3e\u0d2f\u0d3f \u0d07\u0d1f\u0d2a\u0d34\u0d15\u0d41\u0d2e\u0d4d\u0d2a\u0d4b\u0d7e \u0d28\u0d4d\u0d2f\u0d3e\u0d2f\u0d2e\u0d3e\u0d2f \u0d2e\u0d41\u0d7b\u0d15\u0d30\u0d41\u0d24\u0d32\u0d41\u0d15\u0d7e \u0d0e\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d3e\u0d28\u0d41\u0d02 \u0d28\u0d3f\u0d19\u0d4d\u0d19\u0d7e \u0d38\u0d2e\u0d4d\u0d2e\u0d24\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41.",
"\u0d35\u0d1e\u0d4d\u0d1a\u0d28\u0d3e\u0d2a\u0d30\u0d2e\u0d4b \u0d26\u0d41\u0d30\u0d41\u0d2a\u0d2f\u0d4b\u0d17\u0d2a\u0d30\u0d2e\u0d4b \u0d08 \u0d28\u0d3f\u0d2c\u0d28\u0d4d\u0d27\u0d28\u0d15\u0d7e \u0d32\u0d02\u0d18\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d4b \u0d06\u0d2f\u0d3f \u0d24\u0d4b\u0d28\u0d4d\u0d28\u0d41\u0d28\u0d4d\u0d28 \u0d32\u0d3f\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d3f\u0d02\u0d17\u0d41\u0d15\u0d7e \u0d1e\u0d19\u0d4d\u0d19\u0d7e \u0d28\u0d40\u0d15\u0d4d\u0d15\u0d02 \u0d1a\u0d46\u0d2f\u0d4d\u0d24\u0d47\u0d15\u0d4d\u0d15\u0d3e\u0d02 \u0d05\u0d32\u0d4d\u0d32\u0d46\u0d19\u0d4d\u0d15\u0d3f\u0d7d \u0d05\u0d15\u0d4d\u0d15\u0d57\u0d23\u0d4d\u0d1f\u0d41\u0d15\u0d7e \u0d28\u0d3f\u0d2f\u0d28\u0d4d\u0d24\u0d4d\u0d30\u0d3f\u0d1a\u0d4d\u0d1a\u0d47\u0d15\u0d4d\u0d15\u0d3e\u0d02, \u0d0e\u0d28\u0d4d\u0d28\u0d3e\u0d7d \u0d05\u0d24\u0d4d\u0d24\u0d30\u0d02 \u0d0e\u0d32\u0d4d\u0d32\u0d3e \u0d09\u0d33\u0d4d\u0d33\u0d1f\u0d15\u0d4d\u0d15\u0d35\u0d41\u0d02 \u0d15\u0d23\u0d4d\u0d1f\u0d46\u0d24\u0d4d\u0d24\u0d3f \u0d28\u0d40\u0d15\u0d4d\u0d15\u0d02 \u0d1a\u0d46\u0d2f\u0d4d\u0d2f\u0d41\u0d2e\u0d46\u0d28\u0d4d\u0d28\u0d4d \u0d1e\u0d19\u0d4d\u0d19\u0d7e \u0d09\u0d31\u0d2a\u0d4d\u0d2a\u0d41\u0d28\u0d7d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d3f\u0d32\u0d4d\u0d32.",
"\u0d06\u0d2a\u0d4d\u0d2a\u0d4d \u0d35\u0d33\u0d30\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d3f\u0d28\u0d28\u0d41\u0d38\u0d30\u0d3f\u0d1a\u0d4d\u0d1a\u0d4d \u0d08 \u0d28\u0d3f\u0d2c\u0d28\u0d4d\u0d27\u0d28\u0d15\u0d7e \u0d05\u0d2a\u0d4d\u200c\u0d21\u0d47\u0d31\u0d4d\u0d31\u0d4d \u0d1a\u0d46\u0d2f\u0d4d\u0d24\u0d47\u0d15\u0d4d\u0d15\u0d3e\u0d02. \u0d18\u0d7c \u0d26\u0d47\u0d16\u0d4b \u0d24\u0d41\u0d1f\u0d7c\u0d28\u0d4d\u0d28\u0d41\u0d02 \u0d09\u0d2a\u0d2f\u0d4b\u0d17\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d4d \u0d28\u0d3f\u0d32\u0d35\u0d3f\u0d32\u0d46 \u0d28\u0d3f\u0d2c\u0d28\u0d4d\u0d27\u0d28\u0d15\u0d7e \u0d28\u0d3f\u0d19\u0d4d\u0d19\u0d7e \u0d05\u0d02\u0d17\u0d40\u0d15\u0d30\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41 \u0d0e\u0d28\u0d4d\u0d28\u0d3e\u0d23\u0d4d \u0d05\u0d7c\u0d24\u0d4d\u0d25\u0d2e\u0d3e\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d24\u0d4d."
],
pa:[
"\u0a18\u0a30 \u0a26\u0a47\u0a16\u0a4b \u0a07\u0a71\u0a15 \u0a32\u0a3f\u0a38\u0a1f\u0a3f\u0a70\u0a17 \u0a2a\u0a32\u0a47\u0a1f\u0a2b\u0a3e\u0a30\u0a2e \u0a39\u0a48 \u0a1c\u0a4b \u0a2e\u0a3e\u0a32\u0a15\u0a3e\u0a02, \u0a35\u0a47\u0a1a\u0a23 \u0a35\u0a3e\u0a32\u0a3f\u0a06\u0a02, \u0a05\u0a24\u0a47 \u0a38\u0a1f\u0a71\u0a21\u0a40-\u0a38\u0a2a\u0a47\u0a38 \u0a2a\u0a4d\u0a30\u0a26\u0a3e\u0a24\u0a3e\u0a35\u0a3e\u0a02 \u0a28\u0a42\u0a70 \u0a15\u0a2e\u0a30\u0a3e, \u0a18\u0a30 \u0a1c\u0a3e\u0a02 \u0a38\u0a40\u0a1f \u0a32\u0a71\u0a2d \u0a30\u0a39\u0a47 \u0a32\u0a4b\u0a15\u0a3e\u0a02 \u0a28\u0a3e\u0a32 \u0a38\u0a3f\u0a71\u0a27\u0a3e \u0a1c\u0a4b\u0a5c\u0a28 \u0a35\u0a3f\u0a71\u0a1a \u0a2e\u0a26\u0a26 \u0a15\u0a30\u0a26\u0a3e \u0a39\u0a48\u0964 \u0a05\u0a38\u0a40\u0a02 \u0a38\u0a3f\u0a30\u0a2b\u0a3c \u0a07\u0a71\u0a15 \u0a2e\u0a3f\u0a32\u0a23 \u0a38\u0a25\u0a3e\u0a28 \u0a39\u0a3e\u0a02 \u2014 \u0a15\u0a4b\u0a08 \u0a26\u0a32\u0a3e\u0a32, \u0a0f\u0a1c\u0a70\u0a1f, \u0a2e\u0a15\u0a3e\u0a28-\u0a2e\u0a3e\u0a32\u0a15, \u0a1c\u0a3e\u0a02 \u0a35\u0a30\u0a24\u0a4b\u0a02\u0a15\u0a3e\u0a30\u0a3e\u0a02 \u0a35\u0a3f\u0a1a\u0a15\u0a3e\u0a30 \u0a15\u0a3f\u0a38\u0a47 \u0a38\u0a2e\u0a1d\u0a4c\u0a24\u0a47 \u0a26\u0a40 \u0a27\u0a3f\u0a30 \u0a28\u0a39\u0a40\u0a02\u0964",
"\u0a05\u0a38\u0a40\u0a02 \u0a35\u0a30\u0a24\u0a4b\u0a02\u0a15\u0a3e\u0a30\u0a3e\u0a02 \u0a26\u0a40 \u0a2a\u0a1b\u0a3e\u0a23, \u0a32\u0a3f\u0a38\u0a1f\u0a3f\u0a70\u0a17\u0a3e\u0a02 \u0a26\u0a40 \u0a38\u0a3c\u0a41\u0a71\u0a27\u0a24\u0a3e, \u0a1c\u0a3e\u0a02 \u0a15\u0a3f\u0a38\u0a47 \u0a35\u0a40 \u0a1c\u0a3e\u0a07\u0a26\u0a3e\u0a26 \u0a26\u0a40 \u0a39\u0a3e\u0a32\u0a24, \u0a15\u0a3e\u0a28\u0a42\u0a70\u0a28\u0a40\u0a24\u0a3e, \u0a1c\u0a3e\u0a02 \u0a2e\u0a3e\u0a32\u0a15\u0a40 \u0a26\u0a40 \u0a24\u0a38\u0a26\u0a40\u0a15 \u0a28\u0a39\u0a40\u0a02 \u0a15\u0a30\u0a26\u0a47\u0964 \u0a32\u0a3f\u0a38\u0a1f\u0a3f\u0a70\u0a17 \u0a35\u0a3f\u0a71\u0a1a \u0a1c\u0a4b \u0a24\u0a41\u0a38\u0a40\u0a02 \u0a26\u0a47\u0a16\u0a26\u0a47 \u0a39\u0a4b \u0a09\u0a39 \u0a2a\u0a4b\u0a38\u0a1f \u0a15\u0a30\u0a28 \u0a35\u0a3e\u0a32\u0a47 \u0a35\u0a3f\u0a05\u0a15\u0a24\u0a40 \u0a26\u0a41\u0a06\u0a30\u0a3e \u0a26\u0a3f\u0a71\u0a24\u0a3e \u0a17\u0a3f\u0a06 \u0a39\u0a48, \u0a18\u0a30 \u0a26\u0a47\u0a16\u0a4b \u0a26\u0a41\u0a06\u0a30\u0a3e \u0a28\u0a39\u0a40\u0a02\u0964",
"\u0a2e\u0a3e\u0a32\u0a15/\u0a35\u0a47\u0a1a\u0a23 \u0a35\u0a3e\u0a32\u0a47 \u0a05\u0a24\u0a47 \u0a32\u0a71\u0a2d\u0a23 \u0a35\u0a3e\u0a32\u0a47 \u0a35\u0a3f\u0a1a\u0a15\u0a3e\u0a30 \u0a15\u0a4b\u0a08 \u0a35\u0a40 \u0a17\u0a71\u0a32\u0a2c\u0a3e\u0a24, \u0a2e\u0a41\u0a32\u0a3e\u0a15\u0a3e\u0a24, \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28, \u0a38\u0a2e\u0a1d\u0a4c\u0a24\u0a3e, \u0a1c\u0a3e\u0a02 \u0a32\u0a48\u0a23-\u0a26\u0a47\u0a23 \u0a2a\u0a42\u0a30\u0a40 \u0a24\u0a30\u0a4d\u0a39\u0a3e\u0a02 \u0a09\u0a39\u0a28\u0a3e\u0a02 \u0a26\u0a47 \u0a06\u0a2a\u0a23\u0a47 \u0a1c\u0a4b\u0a16\u0a2e \u0a05\u0a24\u0a47 \u0a38\u0a42\u0a1d '\u0a24\u0a47 \u0a39\u0a41\u0a70\u0a26\u0a3e \u0a39\u0a48\u0964 \u0a18\u0a30 \u0a26\u0a47\u0a16\u0a4b \u0a26\u0a40 \u0a07\u0a38 \u0a35\u0a3f\u0a71\u0a1a \u0a15\u0a4b\u0a08 \u0a38\u0a3c\u0a2e\u0a42\u0a32\u0a40\u0a05\u0a24 \u0a1c\u0a3e\u0a02 \u0a1c\u0a3c\u0a3f\u0a70\u0a2e\u0a47\u0a35\u0a3e\u0a30\u0a40 \u0a28\u0a39\u0a40\u0a02\u0964",
"\u0a07\u0a38 \u0a10\u0a2a \u0a30\u0a3e\u0a39\u0a40\u0a02 \u0a39\u0a4b\u0a0f \u0a38\u0a70\u0a2a\u0a30\u0a15 \u0a24\u0a4b\u0a02 \u0a2a\u0a48\u0a26\u0a3e \u0a39\u0a4b\u0a23 \u0a35\u0a3e\u0a32\u0a47 \u0a15\u0a3f\u0a38\u0a47 \u0a35\u0a40 \u0a1d\u0a17\u0a5c\u0a47, \u0a27\u0a4b\u0a16\u0a3e\u0a27\u0a5c\u0a40, \u0a35\u0a3f\u0a71\u0a24\u0a40 \u0a28\u0a41\u0a15\u0a38\u0a3e\u0a28, \u0a1c\u0a3e\u0a07\u0a26\u0a3e\u0a26 \u0a28\u0a42\u0a70 \u0a28\u0a41\u0a15\u0a38\u0a3e\u0a28, \u0a26\u0a41\u0a30\u0a35\u0a3f\u0a35\u0a39\u0a3e\u0a30, \u0a2a\u0a30\u0a47\u0a38\u0a3c\u0a3e\u0a28\u0a40, \u0a38\u0a71\u0a1f, \u0a1c\u0a3e\u0a02 \u0a15\u0a3f\u0a38\u0a47 \u0a39\u0a4b\u0a30 \u0a26\u0a41\u0a30\u0a18\u0a1f\u0a28\u0a3e \u0a32\u0a08 \u0a18\u0a30 \u0a26\u0a47\u0a16\u0a4b \u0a1c\u0a3c\u0a3f\u0a70\u0a2e\u0a47\u0a35\u0a3e\u0a30 \u0a28\u0a39\u0a40\u0a02\u0964",
"\u0a15\u0a3f\u0a38\u0a47 \u0a28\u0a42\u0a70 \u0a2e\u0a3f\u0a32\u0a23 \u0a1c\u0a3e\u0a02 \u0a15\u0a4b\u0a08 \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u0a15\u0a30\u0a28 \u0a24\u0a4b\u0a02 \u0a2a\u0a39\u0a3f\u0a32\u0a3e\u0a02, \u0a05\u0a38\u0a40\u0a02 \u0a1c\u0a3c\u0a4b\u0a30\u0a26\u0a3e\u0a30 \u0a38\u0a3f\u0a2b\u0a3c\u0a3e\u0a30\u0a38\u0a3c \u0a15\u0a30\u0a26\u0a47 \u0a39\u0a3e\u0a02 \u0a15\u0a3f \u0a26\u0a42\u0a1c\u0a47 \u0a35\u0a3f\u0a05\u0a15\u0a24\u0a40 \u0a26\u0a40 \u0a2a\u0a1b\u0a3e\u0a23 \u0a26\u0a40 \u0a24\u0a38\u0a26\u0a40\u0a15 \u0a15\u0a30\u0a4b, \u0a1c\u0a3e\u0a07\u0a26\u0a3e\u0a26 \u0a26\u0a3e \u0a16\u0a41\u0a26 \u0a28\u0a3f\u0a30\u0a40\u0a16\u0a23 \u0a15\u0a30\u0a4b, \u0a05\u0a24\u0a47 \u0a1c\u0a3f\u0a71\u0a25\u0a47 \u0a38\u0a70\u0a2d\u0a35 \u0a39\u0a4b\u0a35\u0a47 \u0a38\u0a41\u0a30\u0a71\u0a16\u0a3f\u0a05\u0a24, \u0a1c\u0a28\u0a24\u0a15 \u0a25\u0a3e\u0a35\u0a3e\u0a02 '\u0a24\u0a47 \u0a2e\u0a3f\u0a32\u0a4b\u0964",
"\u0a18\u0a30 \u0a26\u0a47\u0a16\u0a4b \u0a26\u0a40 \u0a35\u0a30\u0a24\u0a4b\u0a02 \u0a15\u0a30\u0a15\u0a47, \u0a24\u0a41\u0a38\u0a40\u0a02 \u0a2a\u0a32\u0a47\u0a1f\u0a2b\u0a3e\u0a30\u0a2e \u0a28\u0a42\u0a70 \u0a1c\u0a3c\u0a3f\u0a70\u0a2e\u0a47\u0a35\u0a3e\u0a30\u0a40 \u0a28\u0a3e\u0a32 \u0a35\u0a30\u0a24\u0a23, \u0a07\u0a2e\u0a3e\u0a28\u0a26\u0a3e\u0a30 \u0a1c\u0a3e\u0a23\u0a15\u0a3e\u0a30\u0a40 \u0a2a\u0a4b\u0a38\u0a1f \u0a15\u0a30\u0a28, \u0a05\u0a24\u0a47 \u0a39\u0a4b\u0a30 \u0a35\u0a30\u0a24\u0a4b\u0a02\u0a15\u0a3e\u0a30\u0a3e\u0a02 \u0a28\u0a3e\u0a32 \u0a17\u0a71\u0a32\u0a2c\u0a3e\u0a24 \u0a15\u0a30\u0a26\u0a47 \u0a38\u0a2e\u0a47\u0a02 \u0a09\u0a1a\u0a3f\u0a24 \u0a38\u0a3e\u0a35\u0a27\u0a3e\u0a28\u0a40 \u0a35\u0a30\u0a24\u0a23 \u0a32\u0a08 \u0a38\u0a39\u0a3f\u0a2e\u0a24 \u0a39\u0a41\u0a70\u0a26\u0a47 \u0a39\u0a4b\u0964",
