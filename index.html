  const compressImage=(file)=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=1280;
        let{width,height}=img;
        if(width>maxDim||height>maxDim){
          if(width>height){height=Math.round(height*maxDim/width);width=maxDim;}
          else{width=Math.round(width*maxDim/height);height=maxDim;}
        }
        const canvas=document.createElement("canvas");
        canvas.width=width;canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        canvas.toBlob((blob)=>blob?resolve(blob):reject(new Error("Compression failed")),"image/jpeg",0.72);
      };
      img.onerror=()=>reject(new Error("Could not read image"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });

  const uploadToCloudinary=async(blob)=>{
    const fd=new FormData();
    fd.append("file",blob);
    fd.append("upload_preset",UPLOAD_PRESET);
    const res=await fetch(CLOUDINARY_URL,{method:"POST",body:fd});
    const data=await res.json();
    if(data.secure_url)return data.secure_url;
    throw new Error(data.error?.message||"Upload failed");
  };

  const MAX_UPLOAD_BYTES=15*1024*1024;

    const files=Array.from(e.target.files||[]);

    const toUpload=files.slice(0,remaining);
    if(files.length>remaining)msg(`Only ${remaining} more photo(s) allowed (max 10)`,"err");
    if(toUpload.length===0){e.target.value="";return;}
    setUploadingPhotos(true);
    const newUrls=[];
    for(let i=0;i<toUpload.length;i++){
      setPhotoProgress(`Uploading ${i+1}/${toUpload.length}...`);
      const file=toUpload[i];
      if(!file.type.startsWith("image/")){msg(`❌ ${file.name} is not an image`,"err");continue;}
      if(file.size>MAX_UPLOAD_BYTES){msg(`❌ ${file.name} is over 15MB`,"err");continue;}
      try{
        const blob=await compressImage(file);
        const url=await uploadToCloudinary(blob);
        newUrls.push(url);
      }catch(err){msg("❌ Photo upload failed: "+err.message,"err");}
    }
    if(newUrls.length>0)setForm(f=>({...f,photos:[...f.photos,...newUrls]}));
    setUploadingPhotos(false);

  const detectLocation=()=>{

        const addr=data.address||{};
        const city=addr.city||addr.town||addr.village||addr.county||addr.state_district||"";

        const label=city&&state?`${city}, ${state}`:(city||state||"");

        setLocationPicker(false);
      }catch(e){msg("Could not detect location","err");}

      const res=await fetch(`https://api.postalpincode.in/pincode/${pin}`);

      const rec=data&&data[0];
      if(rec&&rec.Status==="Success"&&rec.PostOffice&&rec.PostOffice.length>0){

    // Sorting client-side instead of .orderBy("lastMessageAt") in the query

    return db.collection("chats").where("participants","array-contains",user.uid)

      setChatText("");
      await db.collection("chats").doc(activeChat.id).collection("messages").add({senderId:user.uid,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      await db.collection("chats").doc(activeChat.id).update({lastMessage:text,lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()});
    }catch(e){msg("❌ Message failed to send","err");}
    setChatSending(false);
  };

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(fbUser)=>{
      if(fbUser){
        try{
          const token=await fbUser.getIdToken();
          const res=await fetch(`${BASE}/users/${fbUser.uid}?key=${KEY}`,{headers:{Authorization:`Bearer ${token}`}});
          if(res.ok){
            const profile=fromFS(await res.json());
            const u={uid:fbUser.uid,phone:profile.phone||fbUser.phoneNumber||"",name:profile.name||fbUser.phoneNumber||"User",role:profile.role||"seeker",picture:profile.picture||"",bio:profile.bio||""};
            setUser(u);
            setProfileForm({name:u.name,phone:u.phone,bio:u.bio,picture:u.picture});
            if(profile.city){setMyLocation(profile.city);}
            else if(!locAskedOnce){setLocAskedOnce(true);detectLocation();}
          }else{
            const u={uid:fbUser.uid,phone:fbUser.phoneNumber||"",name:fbUser.phoneNumber||fbUser.displayName||fbUser.email||"User",role:"seeker",picture:"",bio:""};
            setUser(u);
            setProfileForm({name:u.name,phone:u.phone,bio:"",picture:""});
          }
        }catch(e){setUser({uid:fbUser.uid,phone:fbUser.phoneNumber||"",name:fbUser.phoneNumber||"User",role:"seeker"});}
      }else{setUser(null);}
    });
    return unsub;
  },[]);

  useEffect(()=>{
    auth.getRedirectResult().then(async(result)=>{
      if(!result||!result.user)return;
      const fbUser=result.user;
      setDrawerOpen(false);
      try{
        const token=await fbUser.getIdToken();
        const res=await fetch(`${BASE}/users/${fbUser.uid}?key=${KEY}`,{headers:{Authorization:`Bearer ${token}`}});
        if(res.ok){
          setTab("browse");
        }else{
          setAuthForm(f=>({...f,name:fbUser.displayName||""}));
          setIsNewUser(true);
          setAuthStep("profile");
          setTab("login");
        }
      }catch(e){
        const text=(e.message||"Google sign-in failed").replace("Firebase: ","");
        setAuthError(text);setTab("login");msg("❌ Google sign-in: "+text,"err");
      }
    }).catch(e=>{
      const text=(e.message||"Google sign-in failed").replace("Firebase: ","");
      setDrawerOpen(false);setAuthError(text);setTab("login");msg("❌ Google sign-in: "+text,"err");
    });
  },[]);

  const signInWithGoogle=()=>{
    setAuthError("");
    auth.signInWithRedirect(googleProvider).catch(e=>{
      setAuthError((e.message||"Could not start Google sign-in").replace("Firebase: ",""));
    });
  };

  const authHeader=async()=>{
    if(!auth.currentUser)return{};
    const token=await auth.currentUser.getIdToken();
    return{Authorization:`Bearer ${token}`};
  };

  const setupRecaptcha=()=>{
    if(window.recaptchaVerifier)return window.recaptchaVerifier;
    window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"invisible"});
    return window.recaptchaVerifier;
  };

  const sendOtp=async()=>{
    const digits=(authForm.phone||"").replace(/[^0-9]/g,"");
    if(digits.length!==10){setAuthError("Enter a valid 10-digit mobile number");return;}
    setAuthBusy(true);setAuthError("");
    try{
      const verifier=setupRecaptcha();
      const result=await auth.signInWithPhoneNumber("+91"+digits,verifier);
      setConfirmResult(result);
      setAuthStep("otp");
    }catch(e){
      setAuthError((e.message||"Could not send OTP").replace("Firebase: ",""));
      if(window.recaptchaVerifier){try{window.recaptchaVerifier.clear();}catch(x){}window.recaptchaVerifier=null;}
    }
    setAuthBusy(false);
  };

  const verifyOtp=async()=>{
    const code=(authForm.otp||"").replace(/[^0-9]/g,"");
    if(code.length<6){setAuthError("Enter the 6-digit OTP");return;}
    if(!confirmResult){setAuthError("Please request a new OTP");return;}
    setAuthBusy(true);setAuthError("");
    try{
      const cred=await confirmResult.confirm(code);
      const token=await cred.user.getIdToken();
      const res=await fetch(`${BASE}/users/${cred.user.uid}?key=${KEY}`,{headers:{Authorization:`Bearer ${token}`}});
      if(res.ok){
        setAuthForm({name:"",phone:"",otp:"",role:"seeker"});
        setAuthStep("phone");
        setConfirmResult(null);
        setTab("browse");
      }else{
        setIsNewUser(true);
        setAuthStep("profile");
      }
    }catch(e){setAuthError((e.message||"Invalid OTP").replace("Firebase: ",""));}
    setAuthBusy(false);
  };

  const completeSignup=async()=>{
    if(!authForm.name.trim()){setAuthError("Please enter your name");return;}
    setAuthBusy(true);setAuthError("");
    try{
      const fbUser=auth.currentUser;
      await db.collection("users").doc(fbUser.uid).set({name:authForm.name.trim(),phone:fbUser.phoneNumber||"",email:fbUser.email||"",role:authForm.role},{merge:true});
      setUser(u=>({...(u||{}),uid:fbUser.uid,name:authForm.name.trim(),role:authForm.role,phone:fbUser.phoneNumber||""}));
      setAuthForm({name:"",phone:"",otp:"",role:"seeker"});
      setAuthStep("phone");
      setConfirmResult(null);
      setIsNewUser(false);
      setTab("browse");
    }catch(e){setAuthError((e.message||"Could not save profile").replace("Firebase: ",""));}
    setAuthBusy(false);
  };

  const emailLogin=async()=>{
    const email=(emailForm.email||"").trim();
    if(!email||!emailForm.password){setAuthError("Enter email and password");return;}
    setAuthBusy(true);setAuthError("");
    try{
      const cred=await auth.signInWithEmailAndPassword(email,emailForm.password);
      const token=await cred.user.getIdToken();
      const res=await fetch(`${BASE}/users/${cred.user.uid}?key=${KEY}`,{headers:{Authorization:`Bearer ${token}`}});
      if(res.ok){
        setEmailForm({name:"",email:"",password:"",role:"seeker"});
        setTab("browse");
      }else{
        setIsNewUser(true);
        setAuthStep("profile");
      }
    }catch(e){setAuthError((e.message||"Login failed").replace("Firebase: ",""));}
    setAuthBusy(false);
  };

  const emailSignup=async()=>{
    const email=(emailForm.email||"").trim();
    if(!emailForm.name.trim()){setAuthError("Please enter your name");return;}
    if(!email||!emailForm.password){setAuthError("Enter email and password");return;}
    if(emailForm.password.length<6){setAuthError("Password must be at least 6 characters");return;}
    setAuthBusy(true);setAuthError("");
    try{
      const cred=await auth.createUserWithEmailAndPassword(email,emailForm.password);
      await db.collection("users").doc(cred.user.uid).set({name:emailForm.name.trim(),email,phone:"",role:emailForm.role},{merge:true});
      setEmailForm({name:"",email:"",password:"",role:"seeker"});
      setTab("browse");
    }catch(e){setAuthError((e.message||"Sign up failed").replace("Firebase: ",""));}
    setAuthBusy(false);
  };

  const doLogout=()=>{auth.signOut();setTab("browse");setDrawerOpen(false);setAuthStep("phone");setConfirmResult(null);setAuthMode("phone");};

  const handleProfilePic=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    if(!file.type.startsWith("image/")){msg("❌ Please choose an image file","err");e.target.value="";return;}
    if(file.size>MAX_UPLOAD_BYTES){msg("❌ Image is over 15MB","err");e.target.value="";return;}
    setUploadingPic(true);
    try{
      const blob=await compressImage(file);
      const url=await uploadToCloudinary(blob);
      setProfileForm(f=>({...f,picture:url}));
    }catch(err){msg("❌ Picture upload failed: "+err.message,"err");}
    setUploadingPic(false);
    e.target.value="";
  };

  const saveProfile=async()=>{
    if(!user)return;
    if(!profileForm.name){msg("⚠️ Name is required","err");return;}
    setProfileBusy(true);
    try{
      await db.collection("users").doc(user.uid).set({name:profileForm.name,phone:profileForm.phone,bio:profileForm.bio,picture:profileForm.picture,role:user.role},{merge:true});
      setUser(u=>({...u,name:profileForm.name,phone:profileForm.phone,bio:profileForm.bio,picture:profileForm.picture}));
      msg("✅ Profile updated!");
      setTab("browse");
    }catch(e){msg("❌ Network error: "+e.message,"err");}
    setProfileBusy(false);
  };
  useEffect(()=>{if(tab==="post"&&(section==="rent"||section==="buy"))upd("category",section);},[tab,section]);

  const submit=async()=>{
    if(!user){msg("⚠️ Please log in to post a listing","err");setTab("login");return;}
    if(!form.title||!form.location||(form.category!=="library"&&!form.roomType)||!form.price||!form.ownerName||!form.phone){msg("⚠️ Fill all required fields","err");return;}
    setPosting(true);
    try{
      const hdr=await authHeader();
      const payload=toFS({...form,ownerId:user.uid,ownerPicture:user.picture||"",price:Number(form.price),bathrooms:Number(form.bathrooms),icon:rl(form.roomType)?.icon||"🏠",createdAt:new Date().toISOString()});
      const url=editingId?`${BASE}/listings/${editingId}?key=${KEY}`:`${BASE}/listings?key=${KEY}`;
      const res=await fetch(url,{method:editingId?"PATCH":"POST",headers:{"Content-Type":"application/json",...hdr},body:JSON.stringify(payload)});
      if(res.ok){msg(editingId?"✅ Listing updated!":"✅ Room posted! / कमरा पोस्ट हो गया!");setForm(EMPTY);setEditingId(null);setTab("browse");await load();}
      else{const j=await res.json();msg("❌ "+( j.error?.message||"Post failed"),"err");}
    }catch(e){msg("❌ Network error: "+e.message,"err");}
    setPosting(false);
  };

  const startEdit=(listing)=>{
    setForm({...EMPTY,...listing,amenities:listing.amenities||[],docs:listing.docs||[],photos:listing.photos||[]});
    setEditingId(listing.id);
    setSection(listing.category||"rent");
    setTab("post");
  };

  const deleteListing=async(id)=>{
    if(!window.confirm("Delete this listing permanently?"))return;
    try{
      const hdr=await authHeader();
      const res=await fetch(`${BASE}/listings/${id}?key=${KEY}`,{method:"DELETE",headers:hdr});
      if(res.ok){msg("🗑️ Listing deleted");await load();}
      else msg("❌ Delete failed — you may not own this listing","err");
    }catch(e){msg("❌ Network error: "+e.message,"err");}
  };

    chip:on=>({padding:"7px 12px",borderRadius:18,border:`1px solid ${on?C.accent:C.border}`,background:on?"#6B908022":C.card,color:on?C.accent:C.muted,cursor:"pointer",fontSize:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}),
    chipG:on=>({padding:"7px 12px",borderRadius:18,border:`1px solid ${on?C.accentG:C.border}`,background:on?"#B0896822":C.card,color:on?C.accentG:C.muted,cursor:"pointer",fontSize:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}),
    optC:on=>({background:on?"#6B908022":C.card,border:`2px solid ${on?C.accent:C.border}`,borderRadius:10,padding:"12px 8px",textAlign:"center",cursor:"pointer"}),
    optCG:on=>({background:on?"#B0896822":C.card,border:`2px solid ${on?C.accentG:C.border}`,borderRadius:10,padding:"12px 8px",textAlign:"center",cursor:"pointer"}),
    badge:col=>({padding:"3px 9px",borderRadius:20,fontSize:12,fontWeight:700,textTransform:"uppercase",background:col+"22",color:col}),
    card:{background:C.card,borderRadius:13,border:`1px solid ${C.border}`,overflow:"hidden",cursor:"pointer"},
    grid:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:14},

    dbx:{marginBottom:8,padding:12,background:C.card,borderRadius:9,border:`1px solid ${C.border}`},

  return(

              <div>

          <div style={{fontSize:29,fontWeight:900,background:`linear-gradient(135deg,${C.accent},${C.accentG})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:8}}>{section==="buy"?"Find Your Perfect Home to Buy":section==="library"?"Find a Library Near You":"Find Your Perfect Room"}</div>

            </div>

                  <div style={{fontSize:14,color:C.text,fontWeight:600,marginBottom:8}}>{user.phone||user.email||""}</div>
                  <div style={{display:"inline-block"}}><div style={{...S.badge(user.role==="owner"?C.accent:C.accentG),fontSize:14,padding:"5px 14px"}}>{user.role==="owner"?"🏠 Owner":"🔍 Seeker"}</div></div>
                  {user.bio&&<div style={{fontSize:13,color:C.muted,marginTop:8,lineHeight:1.4}}>{user.bio}</div>}
                </div>
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14,display:"flex",flexDirection:"column",gap:4}}>
                  <button onClick={()=>{setTab("profile");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>✏️ {tr("editProfile")}</button>
                  <button onClick={()=>{setTab("mylistings");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>📋 {tr("myListings")}</button>
                  <button onClick={()=>{setTab("chatlist");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>💬 {tr("messagesLabel")}{chats.length>0?` (${chats.length})`:""}</button>
                  <button onClick={()=>setLangPickerOpen(true)} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>🌐 {LANGS.find(l=>l.code===lang)?.native||"Language"}</button>
                  <button onClick={()=>{shareApp();setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>📤 {tr("shareApp")}</button>
                  <button onClick={()=>{setTab("terms");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>📄 {tr("termsConditions")}</button>
                  <button onClick={doLogout} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:"#E74C3C",fontSize:16,fontWeight:600,cursor:"pointer"}}>🚪 {tr("logout")}</button>
                </div>
              </>
            ):(
              <div style={{textAlign:"center",paddingTop:30}}>
                <div style={{fontSize:43,marginBottom:10}}>👤</div>
                <div style={{fontSize:16,color:C.muted,marginBottom:16}}>{tr("drawerLoginPrompt")}</div>
                <button onClick={()=>{setTab("login");setDrawerOpen(false);}} style={{...S.submitBtn,marginTop:0}}>{tr("loginSignup")}</button>
                <div style={{borderTop:`1px solid ${C.border}`,marginTop:18,paddingTop:14,display:"flex",flexDirection:"column",gap:4}}>
                  <button onClick={()=>setLangPickerOpen(true)} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>🌐 {LANGS.find(l=>l.code===lang)?.native||"Language"}</button>
                  <button onClick={()=>{shareApp();setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>📤 {tr("shareApp")}</button>
                  <button onClick={()=>{setTab("terms");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>📄 {tr("termsConditions")}</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* LANGUAGE PICKER */}
      {langPickerOpen&&(
        <div style={{position:"fixed",inset:0,background:"#00000055",zIndex:300,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setLangPickerOpen(false)}>
          <div style={{background:C.surface,borderTopLeftRadius:18,borderTopRightRadius:18,padding:18,width:"100%",maxWidth:460,maxHeight:"70vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontSize:17,fontWeight:800}}>🌐 Choose Language / भाषा चुनें</div>
              <button onClick={()=>setLangPickerOpen(false)} style={{background:C.card,border:"none",color:C.muted,width:28,height:28,borderRadius:7,cursor:"pointer",fontSize:14}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
              {LANGS.map(l=>(
                <button key={l.code} onClick={()=>changeLang(l.code)} style={{padding:"10px 8px",borderRadius:9,border:`2px solid ${lang===l.code?C.accent:C.border}`,background:lang===l.code?"#6B908022":C.card,color:lang===l.code?C.accent:C.text,fontWeight:700,fontSize:15,cursor:"pointer"}}>{l.native}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      {toast&&<div style={{position:"fixed",bottom:78,right:18,background:toast.type==="err"?"#E74C3C":C.green,color:"#fff",padding:"10px 16px",borderRadius:9,fontWeight:700,fontSize:14,zIndex:999,boxShadow:"0 4px 20px #00000022",maxWidth:300}}>{toast.text}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
  </html>
