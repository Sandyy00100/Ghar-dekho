<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GHAR DEKHO - घर देखो</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F5F0;color:#3A3A3A;font-family:'Segoe UI',Arial,sans-serif}
input,select,button{font-family:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#FFFFFF}
::-webkit-scrollbar-thumb{background:#6B9080;border-radius:2px}
</style>
  <link rel="manifest" href="/manifest.json">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;

const PROJECT="ghar-dekho-9b664";
const KEY="AIzaSyCESZDLJlfrN00bnwVhr6RKuTV3dpf3hGs";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
firebase.initializeApp({apiKey:KEY,authDomain:`${PROJECT}.firebaseapp.com`,projectId:PROJECT});
const auth=firebase.auth();

const toFS=(obj)=>{const f={};for(const[k,v]of Object.entries(obj)){if(v===null||v===undefined)continue;if(typeof v==="string")f[k]={stringValue:v};else if(typeof v==="number")f[k]={integerValue:String(v)};else if(typeof v==="boolean")f[k]={booleanValue:v};else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(i=>({stringValue:String(i)}))}};}return{fields:f};};
const fromFS=(doc)=>{const o={id:doc.name?.split("/").pop()};for(const[k,v]of Object.entries(doc.fields||{})){if(v.stringValue!==undefined)o[k]=v.stringValue;else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.booleanValue!==undefined)o[k]=v.booleanValue;else if(v.arrayValue)o[k]=(v.arrayValue.values||[]).map(i=>i.stringValue||"");}return o;};

const C={bg:"#F7F5F0",surface:"#FFFFFF",card:"#FBF9F5",border:"#E6E2D8",accent:"#6B9080",accentG:"#B08968",green:"#588157",text:"#3A3A3A",muted:"#8A8778",dim:"#C9C6BB"};
const ROOM_TYPES=[{id:"single",icon:"🛏️",label:"Single Room",hi:"एकल कमरा"},{id:"1bhk",icon:"🏠",label:"1 BHK",hi:"1 बीएचके"},{id:"2bhk",icon:"🏡",label:"2 BHK",hi:"2 बीएचके"},{id:"3bhk",icon:"🏘️",label:"3 BHK",hi:"3 बीएचके"},{id:"pg",icon:"🏨",label:"PG / Hostel",hi:"पीजी"},{id:"flat",icon:"🏢",label:"Full Flat",hi:"पूरा फ्लैट"}];
const AMENITIES=[{id:"wifi",icon:"📶",label:"WiFi"},{id:"ac",icon:"❄️",label:"AC"},{id:"parking",icon:"🚗",label:"Parking"},{id:"geyser",icon:"🚿",label:"Geyser"},{id:"fridge",icon:"🧊",label:"Fridge"},{id:"washing",icon:"🫧",label:"Washing Machine"},{id:"gas",icon:"🍳",label:"Gas Stove"},{id:"cctv",icon:"📹",label:"CCTV"},{id:"lift",icon:"🛗",label:"Lift"},{id:"power",icon:"⚡",label:"Power Backup"},{id:"garden",icon:"🌿",label:"Garden"},{id:"guard",icon:"💂",label:"Security Guard"}];
const TENANT_TYPES=[{id:"family",icon:"👨‍👩‍👧",label:"Family Only",hi:"सिर्फ परिवार"},{id:"single_male",icon:"👨",label:"Single Male",hi:"अकेला पुरुष"},{id:"single_female",icon:"👩",label:"Single Female",hi:"अकेली महिला"},{id:"working",icon:"💼",label:"Working Professional",hi:"कामकाजी"},{id:"student",icon:"📚",label:"Student",hi:"छात्र"},{id:"any",icon:"🤝",label:"Anyone Welcome",hi:"सभी स्वागत"}];
const DOCS=[{id:"aadhar",icon:"🪪",label:"Aadhar Card"},{id:"pan",icon:"📄",label:"PAN Card"},{id:"agreement",icon:"📝",label:"Rent Agreement"},{id:"police",icon:"👮",label:"Police Verification"},{id:"employment",icon:"💼",label:"Employment Proof"},{id:"photo",icon:"📸",label:"Passport Photo"}];
const LIBRARY_GUIDES=[{icon:"📝",title:"Rental Agreement Basics",titleHi:"किराया अनुबंध",desc:"What every rent agreement should include, and red flags to watch for."},{icon:"💰",title:"Budgeting for Your First Home",titleHi:"बजट बनाना",desc:"How much rent or EMI you can realistically afford."},{icon:"⚖️",title:"Tenant Rights in India",titleHi:"किरायेदार अधिकार",desc:"Security deposit rules, eviction notice periods, and your basic rights."},{icon:"🏦",title:"Home Loan Basics",titleHi:"होम लोन",desc:"How home loans work if you\u2019re planning to buy."}];
const RC={single:"#6B9080","1bhk":"#B08968","2bhk":"#588157","3bhk":"#3498DB",pg:"#9B59B6",flat:"#E74C3C"};
const rl=id=>ROOM_TYPES.find(r=>r.id===id);
const al=id=>AMENITIES.find(a=>a.id===id);
const tl=id=>TENANT_TYPES.find(t=>t.id===id)?.label||id;
const CLOUD_NAME="xwzoozmh";
const UPLOAD_PRESET="ghar.dekho.photos";
const CLOUDINARY_URL=`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
const EMPTY={title:"",titleHi:"",location:"",area:"",pincode:"",roomType:"",price:"",floor:"",bathrooms:"1",furnished:"Unfurnished",kitchen:false,tenantType:"",amenities:[],docs:[],ownerName:"",phone:"",available:"",category:"rent",photos:[]};

function App(){
  const[tab,setTab]=useState("browse");
  const[section,setSection]=useState("rent");
  const[listings,setListings]=useState([]);
  const[loading,setLoading]=useState(true);
  const[posting,setPosting]=useState(false);
  const[search,setSearch]=useState("");
  const[filter,setFilter]=useState("all");
  const[selected,setSelected]=useState(null);
  const[form,setForm]=useState(EMPTY);
  const[toast,setToast]=useState(null);
  const[editingId,setEditingId]=useState(null);
  const[lightbox,setLightbox]=useState(null);
  const[user,setUser]=useState(null);
  const[authMode,setAuthMode]=useState("login");
  const[authForm,setAuthForm]=useState({name:"",email:"",password:"",role:"seeker"});
  const[authError,setAuthError]=useState("");
  const[authBusy,setAuthBusy]=useState(false);
  const[drawerOpen,setDrawerOpen]=useState(false);
  const[profileForm,setProfileForm]=useState({name:"",phone:"",bio:"",picture:""});
  const[profileBusy,setProfileBusy]=useState(false);
  const[uploadingPic,setUploadingPic]=useState(false);

  const msg=(text,type="ok")=>{setToast({text,type});setTimeout(()=>setToast(null),3500);};
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));
  const tog=(k,id)=>setForm(f=>({...f,[k]:f[k].includes(id)?f[k].filter(x=>x!==id):[...f[k],id]}));

  const[uploadingPhotos,setUploadingPhotos]=useState(false);
  const[photoProgress,setPhotoProgress]=useState("");

  const compressImage=(file)=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=1280;
        let{width,height}=img;
        if(width>maxDim||height>maxDim){
          if(width>height){height=Math.round(height*maxDim/width);width=maxDim;}
          else{width=Math.round(width*maxDim/height);height=maxDim;}
        }
        const canvas=document.createElement("canvas");
        canvas.width=width;canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        canvas.toBlob((blob)=>blob?resolve(blob):reject(new Error("Compression failed")),"image/jpeg",0.72);
      };
      img.onerror=()=>reject(new Error("Could not read image"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });

  const uploadToCloudinary=async(blob)=>{
    const fd=new FormData();
    fd.append("file",blob);
    fd.append("upload_preset",UPLOAD_PRESET);
    const res=await fetch(CLOUDINARY_URL,{method:"POST",body:fd});
    const data=await res.json();
    if(data.secure_url)return data.secure_url;
    throw new Error(data.error?.message||"Upload failed");
  };

  const handlePhotoSelect=async(e)=>{
    const files=Array.from(e.target.files||[]);
    const remaining=10-form.photos.length;
    const toUpload=files.slice(0,remaining);
    if(files.length>remaining)msg(`Only ${remaining} more photo(s) allowed (max 10)`,"err");
    if(toUpload.length===0){e.target.value="";return;}
    setUploadingPhotos(true);
    const newUrls=[];
    for(let i=0;i<toUpload.length;i++){
      setPhotoProgress(`Uploading ${i+1}/${toUpload.length}...`);
      try{
        const blob=await compressImage(toUpload[i]);
        const url=await uploadToCloudinary(blob);
        newUrls.push(url);
      }catch(err){msg("❌ Photo upload failed: "+err.message,"err");}
    }
    if(newUrls.length>0)setForm(f=>({...f,photos:[...f.photos,...newUrls]}));
    setUploadingPhotos(false);
    setPhotoProgress("");
    e.target.value="";
  };

  const removePhoto=(url)=>setForm(f=>({...f,photos:f.photos.filter(p=>p!==url)}));

  const[pinStatus,setPinStatus]=useState("idle");
  const[pinOffices,setPinOffices]=useState([]);

  const lookupPincode=async(pin)=>{
    if(!/^[0-9]{6}$/.test(pin)){setPinStatus("idle");setPinOffices([]);return;}
    setPinStatus("loading");
    try{
      const res=await fetch(`https://api.postalpincode.in/pincode/${pin}`);
      const data=await res.json();
      const rec=data&&data[0];
      if(rec&&rec.Status==="Success"&&rec.PostOffice&&rec.PostOffice.length>0){
        const offices=rec.PostOffice;
        const first=offices[0];
        upd("location",`${first.District}, ${first.State}`);
        upd("area",first.Name);
        setPinOffices(offices.map(o=>o.Name));
        setPinStatus("ok");
      }else{
        setPinStatus("err");setPinOffices([]);
      }
    }catch(e){setPinStatus("err");setPinOffices([]);}
  };

  const updPincode=(v)=>{
    const digits=v.replace(/[^0-9]/g,"").slice(0,6);
    upd("pincode",digits);
    if(digits.length===6)lookupPincode(digits);
    else{setPinStatus("idle");setPinOffices([]);}
  };

  const load=async()=>{
    setLoading(true);
    try{
      const res=await fetch(`${BASE}/listings?key=${KEY}`);
      const data=await res.json();
      setListings((data.documents||[]).map(fromFS).reverse());
    }catch(e){msg("Could not load listings","err");}
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(fbUser)=>{
      if(fbUser){
        try{
          const token=await fbUser.getIdToken();
          const res=await fetch(`${BASE}/users/${fbUser.uid}?key=${KEY}`,{headers:{Authorization:`Bearer ${token}`}});
          if(res.ok){
            const profile=fromFS(await res.json());
            const u={uid:fbUser.uid,email:fbUser.email,name:profile.name||fbUser.email,role:profile.role||"seeker",picture:profile.picture||"",phone:profile.phone||"",bio:profile.bio||""};
            setUser(u);
            setProfileForm({name:u.name,phone:u.phone,bio:u.bio,picture:u.picture});
          }else{
            const u={uid:fbUser.uid,email:fbUser.email,name:fbUser.email,role:"seeker",picture:"",phone:"",bio:""};
            setUser(u);
            setProfileForm({name:u.name,phone:"",bio:"",picture:""});
          }
        }catch(e){setUser({uid:fbUser.uid,email:fbUser.email,name:fbUser.email,role:"seeker"});}
      }else{setUser(null);}
    });
    return unsub;
  },[]);

  const authHeader=async()=>{
    if(!auth.currentUser)return{};
    const token=await auth.currentUser.getIdToken();
    return{Authorization:`Bearer ${token}`};
  };

  const doSignup=async()=>{
    if(!authForm.name||!authForm.email||!authForm.password){setAuthError("Fill all fields");return;}
    if(authForm.password.length<6){setAuthError("Password must be at least 6 characters");return;}
    setAuthBusy(true);setAuthError("");
    try{
      const cred=await auth.createUserWithEmailAndPassword(authForm.email,authForm.password);
      const token=await cred.user.getIdToken();
      await fetch(`${BASE}/users/${cred.user.uid}?key=${KEY}`,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify(toFS({name:authForm.name,email:authForm.email,role:authForm.role}))});
      setAuthForm({name:"",email:"",password:"",role:"seeker"});
      setTab("browse");
    }catch(e){setAuthError((e.message||"Signup failed").replace("Firebase: ",""));}
    setAuthBusy(false);
  };

  const doLogin=async()=>{
    if(!authForm.email||!authForm.password){setAuthError("Fill all fields");return;}
    setAuthBusy(true);setAuthError("");
    try{
      await auth.signInWithEmailAndPassword(authForm.email,authForm.password);
      setAuthForm({name:"",email:"",password:"",role:"seeker"});
      setTab("browse");
    }catch(e){setAuthError((e.message||"Login failed").replace("Firebase: ",""));}
    setAuthBusy(false);
  };

  const doLogout=()=>{auth.signOut();setTab("browse");setDrawerOpen(false);};

  const handleProfilePic=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setUploadingPic(true);
    try{
      const blob=await compressImage(file);
      const url=await uploadToCloudinary(blob);
      setProfileForm(f=>({...f,picture:url}));
    }catch(err){msg("❌ Picture upload failed: "+err.message,"err");}
    setUploadingPic(false);
    e.target.value="";
  };

  const saveProfile=async()=>{
    if(!user)return;
    if(!profileForm.name){msg("⚠️ Name is required","err");return;}
    setProfileBusy(true);
    try{
      const hdr=await authHeader();
      await fetch(`${BASE}/users/${user.uid}?key=${KEY}`,{method:"PATCH",headers:{"Content-Type":"application/json",...hdr},body:JSON.stringify(toFS({name:profileForm.name,phone:profileForm.phone,bio:profileForm.bio,picture:profileForm.picture,role:user.role,email:user.email}))});
      setUser(u=>({...u,name:profileForm.name,phone:profileForm.phone,bio:profileForm.bio,picture:profileForm.picture}));
      msg("✅ Profile updated!");
      setTab("browse");
    }catch(e){msg("❌ Network error: "+e.message,"err");}
    setProfileBusy(false);
  };
  useEffect(()=>{if(tab==="post"&&(section==="rent"||section==="buy"))upd("category",section);},[tab,section]);

  const submit=async()=>{
    if(!user){msg("⚠️ Please log in to post a listing","err");setTab("login");return;}
    if(!form.title||!form.location||(form.category!=="library"&&!form.roomType)||!form.price||!form.ownerName||!form.phone){msg("⚠️ Fill all required fields","err");return;}
    setPosting(true);
    try{
      const hdr=await authHeader();
      const payload=toFS({...form,ownerId:user.uid,price:Number(form.price),bathrooms:Number(form.bathrooms),icon:rl(form.roomType)?.icon||"🏠",createdAt:new Date().toISOString()});
      const url=editingId?`${BASE}/listings/${editingId}?key=${KEY}`:`${BASE}/listings?key=${KEY}`;
      const res=await fetch(url,{method:editingId?"PATCH":"POST",headers:{"Content-Type":"application/json",...hdr},body:JSON.stringify(payload)});
      if(res.ok){msg(editingId?"✅ Listing updated!":"✅ Room posted! / कमरा पोस्ट हो गया!");setForm(EMPTY);setEditingId(null);setTab("browse");await load();}
      else{const j=await res.json();msg("❌ "+( j.error?.message||"Post failed"),"err");}
    }catch(e){msg("❌ Network error: "+e.message,"err");}
    setPosting(false);
  };

  const startEdit=(listing)=>{
    setForm({...EMPTY,...listing,amenities:listing.amenities||[],docs:listing.docs||[],photos:listing.photos||[]});
    setEditingId(listing.id);
    setSection(listing.category||"rent");
    setTab("post");
  };

  const deleteListing=async(id)=>{
    if(!window.confirm("Delete this listing permanently?"))return;
    try{
      const hdr=await authHeader();
      const res=await fetch(`${BASE}/listings/${id}?key=${KEY}`,{method:"DELETE",headers:hdr});
      if(res.ok){msg("🗑️ Listing deleted");await load();}
      else msg("❌ Delete failed — you may not own this listing","err");
    }catch(e){msg("❌ Network error: "+e.message,"err");}
  };

  const filtered=listings.filter(l=>{
    const q=search.toLowerCase();
    const cat=l.category||"rent";
    return cat===section&&(!q||[l.title,l.location,l.area].some(s=>(s||"").toLowerCase().includes(q)))&&(filter==="all"||l.roomType===filter);
  });

  const S={
    hdr:{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"0 14px",position:"sticky",top:0,zIndex:100},
    hdrIn:{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:58},
    logoTxt:{fontSize:22,fontWeight:900,background:`linear-gradient(135deg,${C.accent},${C.accentG})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"},
    live:{display:"flex",alignItems:"center",gap:4,background:"#58815722",border:"1px solid #58815744",color:"#588157",padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700},
    navTabs:{display:"flex",gap:3,background:C.border,borderRadius:9,padding:3},
    navTab:a=>({padding:"6px 13px",borderRadius:7,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,background:a?`linear-gradient(135deg,${C.accent},${C.accentG})`:"transparent",color:a?"#fff":C.muted}),
    hero:{background:`linear-gradient(160deg,#EAF4EF,#F7F5F0 60%,#F0EDE2)`,padding:"40px 16px 32px",textAlign:"center",borderBottom:`1px solid ${C.border}`},
    inp:{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:16,outline:"none",width:"100%"},
    sel:{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:16,outline:"none",width:"100%",cursor:"pointer"},
    chip:on=>({padding:"7px 12px",borderRadius:18,border:`1px solid ${on?C.accent:C.border}`,background:on?"#6B908022":C.card,color:on?C.accent:C.muted,cursor:"pointer",fontSize:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}),
    chipG:on=>({padding:"7px 12px",borderRadius:18,border:`1px solid ${on?C.accentG:C.border}`,background:on?"#B0896822":C.card,color:on?C.accentG:C.muted,cursor:"pointer",fontSize:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}),
    optC:on=>({background:on?"#6B908022":C.card,border:`2px solid ${on?C.accent:C.border}`,borderRadius:10,padding:"12px 8px",textAlign:"center",cursor:"pointer"}),
    optCG:on=>({background:on?"#B0896822":C.card,border:`2px solid ${on?C.accentG:C.border}`,borderRadius:10,padding:"12px 8px",textAlign:"center",cursor:"pointer"}),
    badge:col=>({padding:"3px 9px",borderRadius:20,fontSize:12,fontWeight:700,textTransform:"uppercase",background:col+"22",color:col}),
    card:{background:C.card,borderRadius:13,border:`1px solid ${C.border}`,overflow:"hidden",cursor:"pointer"},
    grid:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:14},
    secTitle:{fontSize:12,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1.5,marginBottom:13},
    lbl:{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4},
    row2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:9},
    dbx:{marginBottom:8,padding:12,background:C.card,borderRadius:9,border:`1px solid ${C.border}`},
    submitBtn:{width:"100%",padding:"13px",background:`linear-gradient(135deg,${C.accent},${C.accentG})`,border:"none",borderRadius:10,color:"#fff",fontSize:17,fontWeight:800,cursor:"pointer",marginTop:6},
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text}}>
      {/* HEADER */}
      <header style={S.hdr}>
        <div style={S.hdrIn}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>setDrawerOpen(true)} style={{width:36,height:36,borderRadius:9,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:19,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>☰</button>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:34,height:34,background:`linear-gradient(135deg,${C.accent},${C.accentG})`,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🏠</div>
              <div>
                <div style={S.logoTxt}>GHAR DEKHO</div>
                <div style={{fontSize:11,color:C.muted,letterSpacing:2}}>घर देखो • REAL LISTINGS</div>
              </div>
            </div>
          </div>
          <div style={S.live}>🔴 LIVE</div>
        </div>
      </header>

      {/* HERO */}
      {tab==="browse"&&(
        <div style={S.hero}>
          <div style={{display:"inline-block",background:"#6B908022",border:"1px solid #6B908044",color:C.accent,padding:"3px 12px",borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>🇮🇳 India's Own {section==="buy"?"Home Buying":section==="library"?"Study Space":"Rental"} Platform</div>
          <div style={{fontSize:38,fontWeight:900,background:"linear-gradient(135deg,#3A3A3A,#6B6B6B)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1.1}}>अपना घर खोजें</div>
          <div style={{fontSize:29,fontWeight:900,background:`linear-gradient(135deg,${C.accent},${C.accentG})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:8}}>{section==="buy"?"Find Your Perfect Home to Buy":section==="library"?"Find a Study Space Near You":"Find Your Perfect Room"}</div>
          <div style={{fontSize:14,color:C.muted,marginBottom:22}}>Direct from owners • No broker fee • Firebase powered</div>
          <div style={{display:"flex",gap:5,maxWidth:500,margin:"0 auto 18px",background:C.surface,borderRadius:11,padding:4,border:`1px solid ${C.border}`}}>
            <span style={{color:C.muted,padding:"8px 6px 8px 10px"}}>🔍</span>

                    </div>

              </div>
            </>

              </div>

              {form.category!=="library"&&(
              <div style={{marginBottom:20,paddingBottom:20,borderBottom:`1px solid ${C.border}`}}>

              </button>
              {editingId&&(

            </div>
            <div style={{background:C.surface,borderRadius:15,border:`1px solid ${C.border}`,padding:20}}>
              <div style={{display:"flex",justifyContent:"center",marginBottom:18}}>
                <div style={{position:"relative"}}>
                  {profileForm.picture?(
                    <img src={profileForm.picture} style={{width:84,height:84,borderRadius:"50%",objectFit:"cover",border:`2px solid ${C.border}`}}/>
                  ):(
                    <div style={{width:84,height:84,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent},${C.accentG})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:38,fontWeight:800,color:"#fff"}}>{(profileForm.name||user.email||"?")[0].toUpperCase()}</div>
                  )}
                  <label style={{position:"absolute",bottom:0,right:0,width:28,height:28,borderRadius:"50%",background:C.accent,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:15,border:`2px solid ${C.surface}`}}>
                    {uploadingPic?"⏳":"📷"}
                    <input type="file" accept="image/*" style={{display:"none"}} disabled={uploadingPic} onChange={handleProfilePic}/>
                  </label>
                </div>
              </div>
              <div style={S.lbl}>Full Name</div>
              <input style={{...S.inp,marginBottom:12}} value={profileForm.name} onChange={e=>setProfileForm(f=>({...f,name:e.target.value}))}/>
              <div style={S.lbl}>Phone (optional)</div>
              <input style={{...S.inp,marginBottom:12}} value={profileForm.phone} onChange={e=>setProfileForm(f=>({...f,phone:e.target.value}))}/>
              <div style={S.lbl}>About / Bio (optional)</div>
              <input style={S.inp} placeholder="A short line about you" value={profileForm.bio} onChange={e=>setProfileForm(f=>({...f,bio:e.target.value}))}/>
              <button disabled={profileBusy} onClick={saveProfile} style={{...S.submitBtn,opacity:profileBusy?0.7:1,cursor:profileBusy?"not-allowed":"pointer"}}>
                {profileBusy?"⏳ Saving...":"💾 Save Profile"}
              </button>
            </div>
          </div>
        )}

        {/* LOGIN / SIGNUP */}
        {tab==="login"&&(
          <div style={{maxWidth:420,margin:"0 auto"}}>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:24,fontWeight:800}}>{authMode==="login"?"Welcome Back!":"Create Account"}</div>
              <div style={{fontSize:14,color:C.muted}}>{authMode==="login"?"Sign in to post & manage listings":"Sign up to post & manage listings"}</div>
            </div>
            <div style={{background:C.surface,borderRadius:15,border:`1px solid ${C.border}`,padding:20}}>
              {authMode==="signup"&&(<>
                <div style={S.lbl}>I am a</div>
                <div style={{display:"flex",gap:8,marginBottom:14}}>
                  <button onClick={()=>setAuthForm(f=>({...f,role:"owner"}))} style={{flex:1,padding:10,borderRadius:9,border:`2px solid ${authForm.role==="owner"?C.accent:C.border}`,background:authForm.role==="owner"?"#6B908022":C.card,color:authForm.role==="owner"?C.accent:C.muted,fontWeight:700,cursor:"pointer",fontSize:14}}>🏠 Owner</button>
                  <button onClick={()=>setAuthForm(f=>({...f,role:"seeker"}))} style={{flex:1,padding:10,borderRadius:9,border:`2px solid ${authForm.role==="seeker"?C.accent:C.border}`,background:authForm.role==="seeker"?"#6B908022":C.card,color:authForm.role==="seeker"?C.accent:C.muted,fontWeight:700,cursor:"pointer",fontSize:14}}>🔍 Seeker</button>
                </div>
                <div style={S.lbl}>Full Name</div>
                <input style={{...S.inp,marginBottom:12}} value={authForm.name} onChange={e=>setAuthForm(f=>({...f,name:e.target.value}))}/>
              </>)}
              <div style={S.lbl}>Email</div>
              <input style={{...S.inp,marginBottom:12}} type="email" value={authForm.email} onChange={e=>setAuthForm(f=>({...f,email:e.target.value}))}/>
              <div style={S.lbl}>Password</div>
              <input style={S.inp} type="password" value={authForm.password} onChange={e=>setAuthForm(f=>({...f,password:e.target.value}))}/>
              {authError&&<div style={{color:"#E74C3C",fontSize:13,marginTop:10}}>{authError}</div>}
              <button disabled={authBusy} onClick={authMode==="login"?doLogin:doSignup} style={{...S.submitBtn,opacity:authBusy?0.7:1,cursor:authBusy?"not-allowed":"pointer"}}>
                {authBusy?"⏳ Please wait...":authMode==="login"?"Sign In":"Sign Up"}
              </button>
              <div style={{textAlign:"center",marginTop:14,fontSize:14,color:C.muted}}>
                {authMode==="login"?"Don't have an account? ":"Already have an account? "}
                <span style={{color:C.accent,fontWeight:700,cursor:"pointer"}} onClick={()=>{setAuthMode(authMode==="login"?"signup":"login");setAuthError("");}}>{authMode==="login"?"Sign Up":"Sign In"}</span>
              </div>
            </div>
          </div>
        )}

      </main>

      {/* MODAL */}
      {selected&&(
        <div style={{position:"fixed",inset:0,background:"#00000055",backdropFilter:"blur(5px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:14}} onClick={()=>setSelected(null)}>
          <div style={{background:C.surface,borderRadius:16,border:`1px solid ${C.border}`,padding:20,maxWidth:480,width:"100%",maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div>
                <div style={{fontSize:19,fontWeight:800}}>{selected.title}</div>
                {selected.titleHi&&<div style={{fontSize:13,color:C.muted}}>{selected.titleHi}</div>}
              </div>
              <button style={{background:C.card,border:"none",color:C.muted,width:28,height:28,borderRadius:7,cursor:"pointer",fontSize:16}} onClick={()=>setSelected(null)}>✕</button>
            </div>
            {selected.photos&&selected.photos.length>0?(
              <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>
                {selected.photos.map((url,i)=><img key={i} src={url} onClick={()=>setLightbox({photos:selected.photos,index:i})} style={{width:110,height:110,objectFit:"cover",borderRadius:9,flexShrink:0,border:`1px solid ${C.border}`,cursor:"pointer"}}/>)}
              </div>
            ):(
              <div style={{fontSize:46,textAlign:"center",padding:"14px 0",background:"linear-gradient(135deg,#FFFFFF,#F7F5F0)",borderRadius:9,marginBottom:12}}>{selected.icon||rl(selected.roomType)?.icon||"🏠"}</div>
            )}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div>
                <div style={{fontSize:29,fontWeight:900,color:C.accentG}}>₹{Number(selected.price).toLocaleString()}</div>
                <div style={{fontSize:12,color:C.muted}}>{(selected.category||"rent")==="buy"?"total price":selected.category==="library"?"per seat / month":"per month"} / प्रति माह</div>
              </div>
              <div style={S.badge(RC[selected.roomType]||C.accent)}>{selected.category==="library"?"📚 Study Space":`${rl(selected.roomType)?.icon||""} ${rl(selected.roomType)?.label||""}`}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:9}}>
              {(selected.category==="library"?[["Location",`${selected.area?selected.area+", ":""}${selected.location}${selected.pincode?" - "+selected.pincode:""}`],["Timings",selected.available||"Contact Owner"],["Total Seats",selected.bathrooms||"N/A"]]:[["Location",`${selected.area?selected.area+", ":""}${selected.location}${selected.pincode?" - "+selected.pincode:""}`],["Available",selected.available||"Contact Owner"],["Floor",selected.floor||"N/A"],["Bathrooms",selected.bathrooms||"N/A"],["Kitchen",selected.kitchen?"✅ Yes":"❌ No"],["Furnished",selected.furnished||"N/A"]]).map(([l,v])=>(
                <div key={l} style={S.dbx}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:3,fontWeight:600}}>{l}</div><div style={{fontSize:14,fontWeight:500}}>{v}</div></div>
              ))}
            </div>
            {selected.tenantType&&<div style={{...S.dbx,marginBottom:9}}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:3,fontWeight:600}}>Preferred Tenant</div><div style={{fontSize:14}}>{tl(selected.tenantType)}</div></div>}
            {selected.amenities?.length>0&&<div style={{...S.dbx,marginBottom:9}}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontWeight:600}}>Amenities</div><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{selected.amenities.map(a=>{const am=al(a);return am?<span key={a} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,padding:"2px 7px",fontSize:12,color:C.muted}}>{am.icon} {am.label}</span>:null;})}</div></div>}
            {selected.docs?.length>0&&<div style={{...S.dbx,marginBottom:9}}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontWeight:600}}>Required Docs</div><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{selected.docs.map(d=>{const doc=DOCS.find(x=>x.id===d);return doc?<span key={d} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,padding:"2px 7px",fontSize:12,color:C.muted}}>{doc.icon} {doc.label}</span>:null;})}</div></div>}
            <div style={{...S.dbx,marginBottom:12}}>
              <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontWeight:600}}>Owner / मालिक</div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent},${C.accentG})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:700,color:"#fff"}}>{selected.ownerName?.[0]||"O"}</div>
                <div><div style={{fontWeight:700,fontSize:16}}>{selected.ownerName}</div><div style={{fontSize:13,color:C.muted}}>📞 {selected.phone}</div></div>
              </div>
            </div>
            <button style={{width:"100%",padding:"12px",background:"#58815722",border:"1px solid #58815755",color:C.green,borderRadius:9,fontSize:16,fontWeight:800,cursor:"pointer"}} onClick={()=>window.open(`tel:${selected.phone}`)}>📞 Call Owner / मालिक को कॉल करें</button>
            <button style={{width:"100%",padding:"12px",background:"#25D36622",border:"1px solid #25D36644",color:"#25D366",borderRadius:9,fontSize:16,fontWeight:800,cursor:"pointer",marginTop:7}} onClick={()=>window.open(`https://wa.me/91${selected.phone}`)}>💬 WhatsApp Owner</button>
            <button style={{width:"100%",padding:"12px",background:"#3498DB22",border:"1px solid #3498DB44",color:"#3498DB",borderRadius:9,fontSize:16,fontWeight:800,cursor:"pointer",marginTop:7}} onClick={()=>{const addr=(selected.area?selected.area+", ":"")+selected.location+(selected.pincode?" "+selected.pincode:"");window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr));}}>📍 View on Map</button>
          </div>
        </div>
      )}

      {lightbox&&(
        <div style={{position:"fixed",inset:0,background:"#000D",zIndex:400,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}} onClick={()=>setLightbox(null)}>
          <button style={{position:"absolute",top:16,right:16,width:36,height:36,borderRadius:"50%",background:"#FFFFFF33",color:"#fff",border:"none",fontSize:21,cursor:"pointer"}} onClick={()=>setLightbox(null)}>✕</button>
          {lightbox.photos.length>1&&(
            <button style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",width:40,height:40,borderRadius:"50%",background:"#FFFFFF33",color:"#fff",border:"none",fontSize:21,cursor:"pointer"}} onClick={e=>{e.stopPropagation();setLightbox(l=>({...l,index:(l.index-1+l.photos.length)%l.photos.length}));}}>‹</button>
          )}
          <img src={lightbox.photos[lightbox.index]} onClick={e=>e.stopPropagation()} style={{maxWidth:"92vw",maxHeight:"80vh",objectFit:"contain",borderRadius:8}}/>
          {lightbox.photos.length>1&&(
            <button style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",width:40,height:40,borderRadius:"50%",background:"#FFFFFF33",color:"#fff",border:"none",fontSize:21,cursor:"pointer"}} onClick={e=>{e.stopPropagation();setLightbox(l=>({...l,index:(l.index+1)%l.photos.length}));}}>›</button>
          )}
          {lightbox.photos.length>1&&<div style={{color:"#fff",fontSize:13,marginTop:12}}>{lightbox.index+1} / {lightbox.photos.length}</div>}
        </div>
      )}

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:150,boxShadow:"0 -2px 12px #00000011"}}>
        {[
          {id:"rent",icon:"🏡",label:"Rent",onClick:()=>{setSection("rent");setTab("browse");},active:section==="rent"&&tab==="browse"},
          {id:"buy",icon:"🏠",label:"Buy",onClick:()=>{setSection("buy");setTab("browse");},active:section==="buy"&&tab==="browse"},
          {id:"library",icon:"📚",label:"Study",onClick:()=>{setSection("library");setTab("browse");},active:section==="library"&&tab==="browse"},
          {id:"post",icon:"➕",label:"Post",onClick:()=>{if(!user){setTab("login");return;}setEditingId(null);setForm(EMPTY);setTab("post");},active:tab==="post"},
        ].map(item=>(
          <button key={item.id} onClick={item.onClick} style={{flex:1,padding:"9px 4px 8px",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:23,opacity:item.active?1:0.55}}>{item.icon}</span>
            <span style={{fontSize:11,fontWeight:700,color:item.active?C.accent:C.muted}}>{item.label}</span>
          </button>
        ))}
      </div>

      {/* DRAWER */}
      {drawerOpen&&(
        <div style={{position:"fixed",inset:0,background:"#00000055",zIndex:250}} onClick={()=>setDrawerOpen(false)}>
          <div style={{position:"absolute",top:0,bottom:0,left:0,width:270,background:C.surface,boxShadow:"3px 0 20px #00000022",padding:20,overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setDrawerOpen(false)} style={{background:C.card,border:"none",color:C.muted,width:28,height:28,borderRadius:7,cursor:"pointer",fontSize:13,marginBottom:16}}>✕</button>
            {user?(
              <>
                <div style={{textAlign:"center",marginBottom:18}}>
                  {user.picture?(
                    <img src={user.picture} style={{width:72,height:72,borderRadius:"50%",objectFit:"cover",border:`2px solid ${C.border}`,margin:"0 auto 10px"}}/>
                  ):(
                    <div style={{width:72,height:72,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent},${C.accentG})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,fontWeight:800,color:"#fff",margin:"0 auto 10px"}}>{(user.name||user.email||"?")[0].toUpperCase()}</div>
                  )}
                  <div style={{fontWeight:800,fontSize:18}}>{user.name}</div>
                  <div style={{fontSize:13,color:C.muted,marginBottom:6}}>{user.email}</div>
                  <div style={{display:"inline-block"}}><div style={S.badge(user.role==="owner"?C.accent:C.accentG)}>{user.role==="owner"?"🏠 Owner":"🔍 Seeker"}</div></div>
                  {user.bio&&<div style={{fontSize:13,color:C.muted,marginTop:8,lineHeight:1.4}}>{user.bio}</div>}
                </div>
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14,display:"flex",flexDirection:"column",gap:4}}>
                  <button onClick={()=>{setTab("profile");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>✏️ Edit Profile</button>
                  <button onClick={()=>{setTab("mylistings");setDrawerOpen(false);}} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:C.text,fontSize:16,fontWeight:600,cursor:"pointer"}}>📋 My Listings</button>
                  <button onClick={doLogout} style={{textAlign:"left",padding:"10px 8px",background:"transparent",border:"none",borderRadius:8,color:"#E74C3C",fontSize:16,fontWeight:600,cursor:"pointer"}}>🚪 Logout</button>
                </div>
              </>
            ):(
              <div style={{textAlign:"center",paddingTop:30}}>
                <div style={{fontSize:43,marginBottom:10}}>👤</div>
                <div style={{fontSize:16,color:C.muted,marginBottom:16}}>Log in to post listings and manage your profile</div>
                <button onClick={()=>{setTab("login");setDrawerOpen(false);}} style={{...S.submitBtn,marginTop:0}}>Login / Sign Up</button>
              </div>
            )}
          </div>
        </div>
      )}

      {toast&&<div style={{position:"fixed",bottom:78,right:18,background:toast.type==="err"?"#E74C3C":C.green,color:"#fff",padding:"10px 16px",borderRadius:9,fontWeight:700,fontSize:14,zIndex:999,boxShadow:"0 4px 20px #00000022",maxWidth:300}}>{toast.text}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
